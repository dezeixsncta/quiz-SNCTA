:root{--blue:#003b7a;--blue2:#0057a8;--ink:#10233f;--muted:#667085;--bg:#f4f7fb;--green:#067647;--red:#b42318}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}.wrap{max-width:520px;margin:auto;padding:16px 14px 28px}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 5px 24px #00000012}
.logo{width:145px;height:auto;display:block;margin:4px auto 18px}

button{width:100%;border:0;border-radius:13px;padding:15px 14px;font-size:17px;font-weight:800;background:var(--blue);color:#fff;margin-top:12px}
button.secondary{background:#eef2ff;color:var(--blue)}button.option{background:#f8fafc;color:var(--ink);border:2px solid #e2e8f0;text-align:left;font-weight:650}
button.option.selected{border-color:var(--blue);background:#eef5ff}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:750}
.progress{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-bottom:18px}.bar{height:100%;background:var(--blue);transition:width .2s}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.stat{background:#f8fafc;border-radius:14px;padding:14px}
.big{font-size:28px;font-weight:850}.rank{font-size:21px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 5px;border-bottom:1px solid #eaecf0;text-align:left}
.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2ff;color:var(--blue);font-size:13px;font-weight:800}
.notice{padding:12px;border-radius:12px;background:#fffaeb;color:#92400e;font-size:13px;line-height:1.4;margin-top:14px}
.hidden{display:none!important}.center{text-align:center}

function start(){
 const nick=document.getElementById('nick').value.trim();
 if(!nick){alert('Choisis un pseudo pour commencer.');return}
 state={i:0,score:0,selected:null,profile:{nick,region:document.getElementById('region').value,center:document.getElementById('center').value}};
 question();
}
function question(){
 const q=QUESTIONS[state.i]; state.selected=null;
 render(`<div class="card">
 <div class="top"><span>Question ${state.i+1} / ${QUESTIONS.length}</span><span>${state.score} pt${state.score>1?'s':''}</span></div>
 <div class="progress"><div class="bar" style="width:${(state.i/QUESTIONS.length)*100}%"></div></div>
 <h2>${esc(q.question)}</h2>
 ${q.options.map((o,j)=>`<button class="option" onclick="choose(${j},this)">${String.fromCharCode(65+j)}. ${esc(o.label)}</button>`).join('')}
 <button id="next" class="secondary hidden" onclick="next()">Valider</button>
 </div>`);
}
function choose(j,el){
 document.querySelectorAll('.option').forEach(b=>b.classList.remove('selected'));
 el.classList.add('selected'); state.selected=j; document.getElementById('next').classList.remove('hidden');
}
function next(){
 if(state.selected===null)return;
 const q=QUESTIONS[state.i];
 if(q.options[state.selected].value===q.correct)state.score++;
 state.i++;
 if(state.i<QUESTIONS.length)question();else result();
}
function result(){
 const total=QUESTIONS.length,pct=Math.round(state.score/total*100);
 render(`<div class="card">
 <span class="badge">QUIZ TERMINÉ</span>
 <h1 style="margin-top:10px">Bravo ${esc(state.profile.nick)} !</h1>
 <div class="statgrid">
  <div class="stat"><div class="muted">Score</div><div class="big">${state.score}/${total}</div><div>${pct} % de bonnes réponses</div></div>
  <div class="stat"><div class="muted">Classement national</div><div class="big">27e</div><div class="muted">sur 1 248</div></div>
  <div class="stat"><div class="muted">Région</div><div class="rank">${state.profile.region?'4e':'—'}</div><div class="muted">${state.profile.region||'Non renseignée'}</div></div>
  <div class="stat"><div class="muted">Centre</div><div class="rank">${state.profile.center?'2e':'—'}</div><div class="muted">${state.profile.center||'Non renseigné'}</div></div>
 </div>
 <h2>Classement des régions</h2>
 <table><tr><th>#</th><th>Région</th><th>%</th></tr>
 <tr><td>1</td><td>Ouest</td><td>87,4</td></tr><tr><td>2</td><td>Sud-Ouest</td><td>85,9</td></tr><tr><td>3</td><td>Sud-Est</td><td>84,7</td></tr><tr><td>4</td><td>Nord</td><td>82,1</td></tr></table>
 <h2>Classement des centres</h2>
 <table><tr><th>#</th><th>Centre</th><th>%</th></tr>
 <tr><td>1</td><td>Brest</td><td>91,2</td></tr><tr><td>2</td><td>Nantes</td><td>89,6</td></tr><tr><td>3</td><td>Bordeaux</td><td>87,8</td></tr></table>
 <div class="notice">Dans la version finale, cette page sera calculée automatiquement à partir des résultats réels. Aucune nouvelle information ne sera demandée au participant.</div>
 <button onclick="home()">Rejouer le test</button>
 </div>`);
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
home();
</script>
