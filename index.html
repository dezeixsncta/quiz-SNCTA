    return `<button class="fam${sel}" data-fam="${esc(f)}">${esc(f)} <span class="count">${n}</span></button>`;
  }).join("");
  const grpDefi = state.grp && state.mode==="defi";
  main.innerHTML = `
    <div class="setup-grid">
    <div class="col-left">
    ${profileHTML()}
    ${grpSectionHTML()}
    <div class="section-label">Mode de jeu</div>
    <div class="modes">
      <button class="mode-btn ${state.mode==="defi"?"sel":""}" data-mode="defi">
        <h3>Défi 10 cartes</h3><p>10 cartes, un score final — le seul mode classé.</p>
      </button>
      <button class="mode-btn ${state.mode==="libre"?"sel":""}" data-mode="libre">
        <h3>Révision libre</h3><p>Tout le paquet, dans l'ordre du hasard, sans doublon. Non classé.</p>
      </button>
    </div>
    <div class="controls" style="margin-top:16px">
      <button class="btn reveal" id="lbBtn">🏆 Voir le classement</button>
    </div>
    </div>
    <div class="col-right">
    <div class="section-label">Familles</div>
    ${grpDefi ? '<div class="grp-msg" style="margin-bottom:10px">👥 Défi de groupe : les 21 familles sont utilisées pour que tout le monde ait les mêmes cartes.</div>' : `
    <div class="fam-tools">
      <button class="chip-action" id="allFams">Tout sélectionner</button>
      <button class="chip-action" id="noFams">Tout retirer</button>
    </div>
    <div class="fams">${famChips}</div>`}
    </div>
    </div>`;
  main.querySelectorAll(".mode-btn").forEach(b=>b.addEventListener("click",()=>{
    captureProfile(); state.mode=b.dataset.mode; renderSetup();
  }));
  if(!grpDefi){
    main.querySelectorAll(".fams .fam").forEach(b=>b.addEventListener("click",()=>{
      const f=b.dataset.fam;
      state.selFams.has(f)?state.selFams.delete(f):state.selFams.add(f);
      b.classList.toggle("sel"); updateStartBtn();
    }));
    document.getElementById("allFams").addEventListener("click",()=>{captureProfile();state.selFams=new Set(FAMILIES);renderSetup();});
    document.getElementById("noFams").addEventListener("click",()=>{captureProfile();state.selFams.clear();renderSetup();});
  }
  bindProfile(updateStartBtn);
  bindGrpSection(renderSetup);
  document.getElementById("lbBtn").addEventListener("click",()=>{ if(state.grp) lb.view="grp"; renderLeaderboard(); });
  captureProfile(); updateStartBtn();
  window.scrollTo(0,0);
}
function updateStartBtn(){
  const grpDefi = state.grp && state.mode==="defi";
  const pool = grpDefi ? CARDS.length : CARDS.filter(c=>state.selFams.has(c.f)).length;
  const okProfile = !!state.name && !!state.centre;
  startBtn.disabled = pool===0 || !okProfile;
  startBtn.textContent = !okProfile ? "Prénom valide et centre requis"
    : pool===0 ? "Choisis au moins une famille"
    : state.mode==="defi" ? "Lancer le défi · 10 cartes"
    : `Réviser · ${pool} cartes`;
}

/* ---------- partie ---------- */
function isVF(card){ return card.f===VF_FAMILY && /^(vrai|faux)/i.test(card.a); }
function vfTruth(card){ return /^vrai/i.test(card.a); }

function startGame(){
  captureProfile();
  if(!state.name || !state.centre){ renderSetup(); return; }
  const grpDefi = state.grp && state.mode==="defi";
  if(grpDefi){
    const seed = hashStr(state.grp.code+":inco:"+todayKey());
    state.deck = seededShuffle(CARDS, seed).slice(0,10);
  }else{
    const pool = shuffle(CARDS.filter(c=>state.selFams.has(c.f)));
    state.deck = state.mode==="defi" ? pool.slice(0,Math.min(10,pool.length)) : pool;
  }
  state.idx=0; state.ok=0; state.ko=0; state.playing=true; state.lastSavedId=null;
  startBar.classList.add("hidden");
  renderCard();
}

function renderCard(){
  if(state.idx>=state.deck.length){ renderEnd(); return; }
  state.revealed=false; state.answered=false;
  const c = state.deck[state.idx];
  main.innerHTML = `
    <div class="game-wrap">
    ${hudHTML()}
    <div class="strip">
      <div class="numbox"><div class="n">${c.n}</div><div class="lbl">carte</div></div>
      <div class="body">
        <div class="famtag">${esc(c.f)}${state.grp?" · 👥 "+esc(state.grp.name):""}</div>
        <div class="q">${esc(c.q)}</div>
        <div class="a hidden" id="answer"><span class="a-label">Réponse</span>${esc(c.a)}</div>
      </div>
    </div>
    <div id="ctrl"></div>
    <div id="verdict"></div>
    <div class="kbd-hint" id="kbdHint"></div>
    </div>`;
  bindHud();
  renderControls(c);
  window.scrollTo(0,0);
}
function hudHTML(){
  const total = state.deck.length;
  return `<div class="hud">
    <button class="back" id="quitBtn">Quitter</button>
    <div class="prog">Carte ${state.idx+1} / ${total}</div>
    <div class="score"><span class="ok">✓ ${state.ok}</span> · <span class="ko">✗ ${state.ko}</span></div>
  </div>`;
}
function bindHud(){ document.getElementById("quitBtn").addEventListener("click",renderSetup); }

function renderControls(c){
  const ctrl = document.getElementById("ctrl");
  if(!state.revealed){
    if(isVF(c)){
      ctrl.innerHTML = `<div class="controls two">
        <button class="btn vf" id="btnVrai">Vrai</button>
        <button class="btn vf" id="btnFaux">Faux</button></div>`;
      document.getElementById("btnVrai").addEventListener("click",()=>answerVF(c,true));
      document.getElementById("btnFaux").addEventListener("click",()=>answerVF(c,false));
    }else{
      ctrl.innerHTML = `<div class="controls">
        <button class="btn reveal" id="btnReveal">Voir la réponse</button></div>`;
      document.getElementById("btnReveal").addEventListener("click",()=>{
        state.revealed=true;
        document.getElementById("answer").classList.remove("hidden");
        renderControls(c);
      });
    }
  }else if(!state.answered){
    ctrl.innerHTML = `<div class="controls two">
      <button class="btn ok" id="btnOk">✓ Je savais</button>
      <button class="btn ko" id="btnKo">✗ Raté</button></div>`;
    document.getElementById("btnOk").addEventListener("click",()=>selfScore(true));
    document.getElementById("btnKo").addEventListener("click",()=>selfScore(false));
  }else{
    ctrl.innerHTML = `<div class="controls">
      <button class="btn next" id="btnNext">Carte suivante</button></div>`;
    document.getElementById("btnNext").addEventListener("click",()=>{state.idx++;renderCard();});
  }
  updateHint();
}
function answerVF(c, saidTrue){
  const good = saidTrue===vfTruth(c);
  good ? state.ok++ : state.ko++;
  state.revealed=true; state.answered=true;
  document.getElementById("answer").classList.remove("hidden");
  document.getElementById("verdict").innerHTML =
    `<div class="verdict ${good?"good":"bad"}">${good?"Bien vu !":"Et non…"}</div>`;
  refreshHud(); renderControls(c);
}
function selfScore(good){
  good ? state.ok++ : state.ko++;
  state.answered=true;
  refreshHud(); renderControls(state.deck[state.idx]);
}
function refreshHud(){
  document.querySelector(".hud .score").innerHTML =
    `<span class="ok">✓ ${state.ok}</span> · <span class="ko">✗ ${state.ko}</span>`;
}
function updateHint(){
  const el = document.getElementById("kbdHint");
  if(!el) return;
  const c = state.deck[state.idx];
  if(!c) return;
  if(!state.revealed && isVF(c))      el.innerHTML = `<kbd>V</kbd> vrai · <kbd>F</kbd> faux`;
  else if(!state.revealed)            el.innerHTML = `<kbd>Espace</kbd> voir la réponse`;
  else if(!state.answered)            el.innerHTML = `<kbd>1</kbd> je savais · <kbd>2</kbd> raté`;
  else                                el.innerHTML = `<kbd>Espace</kbd> carte suivante`;
}

/* ---------- fin + enregistrement (mode Défi uniquement) ---------- */
async function renderEnd(){
  state.playing=false;
  const total = state.ok+state.ko;
  const pct = total? state.ok/total : 0;
  const ranked = state.mode==="defi" && total>0;
  let msg;
  if(pct===1)       msg = "Incollable. Le phare, c'est toi.";
  else if(pct>=0.8) msg = "Solide. Aucune faille dans l'argumentation — ou presque.";
  else if(pct>=0.6) msg = "Bonne base. Un tour dans le Guide du Contrôleur et c'est réglé.";
  else if(pct>=0.4) msg = "Le corpus est dense : encore quelques vacations de révision.";
  else              msg = "Rare, massive… et à retenter. La ténacité paie !";
  main.innerHTML = `
    <div class="endcard">
      <div class="big">${state.ok}<span class="of"> / ${total}</span></div>
      <div class="msg">${msg}</div>
      <div class="sub" id="saveStatus">${ranked?"Enregistrement du score…":"Révision libre — partie non classée."}</div>
      <div class="end-actions">
        ${ranked?`<button class="btn next" id="lbBtn">🏆 ${state.grp?"Classement du groupe":"Voir le classement"}</button>`:""}
        ${ranked&&state.grp?'<button class="btn reveal" id="defyBtn">Défier les copains (partager)</button>':""}
        <button class="btn ${ranked?"reveal":"next"}" id="againBtn">Rejouer</button>
        <button class="btn reveal" id="setupBtn">Changer joueur / réglages</button>
      </div>
    </div>`;
  document.getElementById("againBtn").addEventListener("click",startGame);
  document.getElementById("setupBtn").addEventListener("click",renderSetup);
  const lbBtn = document.getElementById("lbBtn");
  if(lbBtn) lbBtn.addEventListener("click",()=>{ if(state.grp) lb.view="grp"; renderLeaderboard(); });
  const defy = document.getElementById("defyBtn");
  if(defy) defy.addEventListener("click",()=>{ if(navigator.share) shareNative(); else shareWA(); });
  window.scrollTo(0,0);
  if(ranked){
    const id = await saveResult({ name:state.name, centre:state.centre, score:state.ok,
      good:state.ok, total:total, game:GAME, grp:state.grp?state.grp.code:null });
    state.lastSavedId = id;
    const st = document.getElementById("saveStatus");
    if(st) st.textContent = id ? "Score enregistré ✓ · Par passion du métier. Par exigence pour l'avenir."
                               : "⚠️ Serveur injoignable — score non enregistré.";
  }
}

/* ---------- clavier ---------- */
document.addEventListener("keydown",(e)=>{
  if(!state.playing || state.idx>=state.deck.length) return;
  if(e.repeat) return;
  const c = state.deck[state.idx];
  const k = e.key.toLowerCase();
  if(k===" "||k==="enter"){
    e.preventDefault();
    if(!state.revealed && !isVF(c)) document.getElementById("btnReveal")?.click();
    else if(state.answered)         document.getElementById("btnNext")?.click();
  }else if(!state.revealed && isVF(c) && (k==="v"||k==="f")){
    (k==="v"?document.getElementById("btnVrai"):document.getElementById("btnFaux"))?.click();
  }else if(state.revealed && !state.answered && (k==="1"||k==="2")){
    (k==="1"?document.getElementById("btnOk"):document.getElementById("btnKo"))?.click();
  }else if(k==="escape"){ renderSetup(); }
});
startBtn.addEventListener("click",startGame);
renderSetup();
initGroupFromUrl(renderSetup);
</script>
</body>
</html>
