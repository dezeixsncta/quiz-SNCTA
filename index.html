function normalizeBank(raw){
 const src=Array.isArray(raw)?raw:DEFAULT_BANK;
 return src.map((q,idx)=>{
   let options=Array.isArray(q.options)?q.options:Array.isArray(q.answers)?q.answers.map((label,j)=>({label,value:String.fromCharCode(65+j)})):[];
   if(!options.length) options=[{label:"",value:"A"},{label:"",value:"B"},{label:"",value:"C"},{label:"",value:"D"}];
   let correct=q.correct;
   if(typeof correct==='number') correct=String.fromCharCode(65+correct);
   if(typeof correct!=='string') correct=options[0]?.value||'A';
   return {id:q.id??idx+1,question:q.question||"",options,correct,active:q.active!==false,time:q.time||20};
 });

function home(){
 load();
 render(`${siteHeader()}<div class="card home-card">
   <div class="section-label">Joueur</div>
   <label for="nick">Pseudo <span class="muted">(facultatif)</span></label>
   <input id="nick" maxlength="30" autocomplete="off" placeholder="Ton pseudo">
   <label for="center">Centre de contrôle</label>
   <input id="center" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="Code OACI à 4 lettres">
   <p class="muted home-note">Ton centre doit être renseigné sous la forme d’un code OACI à 4 lettres.</p>
   <button onclick="start()">Commencer</button>
   <button class="secondary home-admin" onclick="admin()">⚙️ Espace admin</button>
 </div>`)
}
function start(){
 load();
 let nick=document.getElementById("nick").value.trim();
 let center=document.getElementById("center").value.trim().toUpperCase();
 if(!nick){nick="Joueur "+String(Math.floor(1000+Math.random()*9000));}
 if(!/^[A-Z]{4}$/.test(center)){alert("Le centre doit comporter exactement 4 lettres (ex. LFFF).");return}
 let matchedCenter=centers.find(c=>c.code===center && c.active!==false);
 let group=matchedCenter?.group||"";
 let a=bank.filter(q=>q.active!==false);let n=Number(cfg.count)||1;
 if(n>a.length){alert("Le nombre de questions demandé dépasse le maximum de "+a.length+".");return}
 let qs=[...a].sort(()=>Math.random()-.5).slice(0,n);
 state={qs,i:0,score:0,sel:null,locked:false,profile:{nick,group,center}};
 question()
}
let state={};
function question(){
 let q=state.qs[state.i];state.sel=null;state.locked=false;
 render(`${siteHeader()}<div class="quiz-card">
 <div class="quiz-counter">Question ${state.i+1} / ${state.qs.length}</div>
 <div class="quiz-question">${esc(q.question)}</div>
 <div class="answers-grid">${q.options.map((o,j)=>`<button class="answer-square answer-${j}" onclick="choose(${j},this)"><span>${esc(o.label)}</span></button>`).join("")}</div>
 </div>`)
}
function choose(j,e){
 if(state.locked)return;
 state.locked=true;state.sel=j;
 document.querySelectorAll(".answer-square").forEach(x=>x.disabled=true);
 e.classList.add("selected");
 let q=state.qs[state.i];
 if(q.options[j].value===q.correct)state.score++;
 setTimeout(()=>{state.i++;state.i<state.qs.length?question():result()},350);
}
function result(){
 let pct=Math.round(state.score/state.qs.length*100);
 render(`<div class="card"><span class="badge">QUIZ TERMINÉ</span><h1 style="margin-top:10px">Bravo ${esc(state.profile.nick)} !</h1>
 <div class="grid"><div class="stat"><div class="muted">Score</div><div class="big">${state.score}/${state.qs.length}</div><b>${pct} % de bonnes réponses</b></div>
 <div class="stat"><div class="muted">Classement national</div><div class="big">27e</div></div>
 <div class="stat"><div class="muted">Classement SNA</div><div class="big">${state.profile.group?"4e":"—"}</div></div>
 <div class="stat"><div class="muted">Classement centre</div><div class="big">${state.profile.center?"2e":"—"}</div></div></div>
 <h2>Classement des SNA</h2><table><tr><th>#</th><th>SNA</th><th>%</th></tr>${GROUPS.slice(0,3).map((g,i)=>`<tr><td>${i+1}</td><td>${esc(g)}</td><td>${[87.4,85.9,84.7][i].toFixed(1).replace(".",",")}</td></tr>`).join("")}</table>
 <h2>Classement des centres</h2><table><tr><th>#</th><th>Centre</th><th>%</th></tr><tr><td>1</td><td>Brest</td><td>91,2</td></tr><tr><td>2</td><td>Bordeaux</td><td>89,6</td></tr><tr><td>3</td><td>Aix-en-Provence</td><td>87,8</td></tr></table>
 <button onclick="home()">Rejouer</button></div>`)
}
function admin(){load();renderAdmin()}
function renderAdmin(){
 let active=bank.filter(q=>q.active!==false).length;
 render(`<div class="card"><span class="badge">ADMIN — TEST</span><h1>Administration</h1>
 <label>Nombre de questions du quiz</label><input id="count" type="number" min="1" step="1" value="${cfg.count}">
 <p class="muted">Maximum actuel : <b>${active}</b> question${active>1?"s":""} actives.</p>
 <button onclick="saveCount()">Enregistrer</button>
 <button class="secondary" onclick="showQuestionBank()">📚 Banque de questions</button>
 <button class="secondary" onclick="showCenters()">📍 Centres & régions</button>
 <button class="secondary" onclick="home()">Retour au quiz</button></div>`)
}
function showQuestionBank(){
 let active=bank.filter(q=>q.active!==false).length;
 render(`<div class="card"><span class="badge">ADMIN</span><h1>Banque de questions</h1>
 <p class="muted">${bank.length} questions au total — ${active} actives.</p>
 <button onclick="editQ(-1)">➕ Ajouter une question</button>
 <button class="secondary" onclick="renderAdmin()">← Retour au menu admin</button></div>
 <div class="card"><div id="qlist">${bank.map((q,i)=>qCard(q,i)).join("")}</div></div>`)
}
function showCenters(){
 render(`<div class="card"><span class="badge">ADMIN</span><h1>Centres & SNA</h1>
 <p class="muted">Chaque centre est identifié par un code de 4 lettres et rattaché à un SNA.</p>
 <button onclick="editC(-1)">➕ Ajouter un centre</button>
 <button class="secondary" onclick="renderAdmin()">← Retour au menu admin</button></div>
 <div class="card"><h2>SNA</h2>${GROUPS.map(g=>`<span class="badge" style="margin:3px">${esc(g)}</span>`).join(" ")}</div>
 <div class="card"><div id="clist">${centers.map((c,i)=>cCard(c,i)).join("")}</div></div>`)
}
function saveCount(){let active=bank.filter(q=>q.active!==false).length,n=Math.floor(Number(document.getElementById("count").value));if(!n||n<1){alert("Entre un nombre entier supérieur à 0.");return}if(n>active){alert("Le maximum actuel est "+active+".");return}cfg.count=n;save();alert("Nombre enregistré : "+n);renderAdmin()}
function qCard(q,i){return `<div class="q ${q.active===false?"off":""}"><b>#${i+1}</b> — ${esc(q.question)}<br><span class="muted">Bonne réponse : ${esc((q.options.find(o=>o.value===q.correct)||{}).label||"—")}</span><br><button onclick="editQ(${i})">Modifier</button><button class="secondary" onclick="toggleQ(${i})">${q.active===false?"Réactiver":"Désactiver"}</button><button class="danger" onclick="delQ(${i})">Supprimer</button></div>`}
function editQ(i){let q=i>=0?bank[i]:{question:"",options:[{label:"",value:"A"},{label:"",value:"B"},{label:"",value:"C"},{label:"",value:"D"}],correct:"A",active:true};render(`<div class="card"><h1>${i<0?"Ajouter":"Modifier"} une question</h1><label>Question</label><textarea id="qq" rows="3">${esc(q.question)}</textarea>${q.options.map((o,j)=>`<label>Réponse ${String.fromCharCode(65+j)}</label><input id="o${j}" value="${esc(o.label)}">`).join("")}<label>Bonne réponse</label><select id="corr">${q.options.map((o,j)=>`<option value="${o.value}" ${o.value===q.correct?"selected":""}>${String.fromCharCode(65+j)}</option>`).join("")}</select><button onclick="saveQ(${i})">Enregistrer</button><button class="secondary" onclick="renderAdmin()">Annuler</button></div>`)}
function saveQ(i){let question=document.getElementById("qq").value.trim(),options=[0,1,2,3].map(j=>({label:document.getElementById("o"+j).value.trim(),value:String.fromCharCode(65+j)}));if(!question||options.some(o=>!o.label)){alert("Renseigne la question et les 4 réponses.");return}let q={question,options,correct:document.getElementById("corr").value,active:true};i<0?bank.push(q):bank[i]=q;save();renderAdmin()}
function toggleQ(i){const y=window.scrollY;bank[i].active=bank[i].active===false;save();showQuestionBank();requestAnimationFrame(()=>scrollTo(0,y))}
function delQ(i){if(confirm("Supprimer définitivement cette question ?")){bank.splice(i,1);save();renderAdmin()}}
function cCard(c,i){return `<div class="q ${c.active===false?"off":""}"><b>${esc(c.code||"????")} — ${esc(c.name||"")}</b><br><span class="badge">${esc(c.group||"Non affecté")}</span><br><button onclick="editC(${i})">Modifier</button><button class="secondary" onclick="toggleC(${i})">${c.active===false?"Réactiver":"Désactiver"}</button><button class="danger" onclick="delC(${i})">Supprimer</button></div>`}
function editC(i){let c=i>=0?centers[i]:{code:"",name:"",group:GROUPS[0],active:true};render(`<div class="card"><h1>${i<0?"Ajouter":"Modifier"} un centre</h1><label>Code centre (4 lettres)</label><input id="cc" maxlength="4" value="${esc(c.code||"")}" placeholder="Ex. LFFF"><label>Nom</label><input id="cn" value="${esc(c.name||"")}"><label>SNA</label><select id="cg">${GROUPS.map(g=>`<option value="${esc(g)}" ${g===c.group?"selected":""}>${esc(g)}</option>`).join("")}</select><button onclick="saveC(${i})">Enregistrer</button><button class="secondary" onclick="renderAdmin()">Annuler</button></div>`)}
function saveC(i){let code=document.getElementById("cc").value.trim().toUpperCase(),name=document.getElementById("cn").value.trim(),group=document.getElementById("cg").value;if(!/^[A-Z]{4}$/.test(code)){alert("Le code centre doit comporter exactement 4 lettres.");return}if(!name){alert("Le nom est obligatoire.");return}let c={code,name,group,active:true};i<0?centers.push(c):centers[i]=c;save();renderAdmin()}
function toggleC(i){const y=window.scrollY;centers[i].active=centers[i].active===false;save();showCenters();requestAnimationFrame(()=>scrollTo(0,y))}
function delC(i){if(confirm("Supprimer ce centre ?")){centers.splice(i,1);save();renderAdmin()}}
load();save();if(location.hash==="#admin")admin();else home();
</script></body></html>
