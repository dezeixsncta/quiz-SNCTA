fs"},{"n":409,"q":"Que deviennent les années de TSEEAC contrôleur pour la retraite ?","a":"Comptées pour la bonification du 5e, comme services actifs et pour l'ATC (ICNA d'ici 2034).","f":"Retraite & dispositifs"},{"n":410,"q":"Qui suis-je ? Je rehausse mécaniquement la pension sans négocier la retraite elle-même.","a":"La fin de carrière : grilles et échelons terminaux (HEB III).","f":"Retraite & dispositifs"},{"n":411,"q":"Quelle est la politique retraite du SNCTA ?","a":"Ligne rouge sur l'âge, revalorisation par la fin de carrière, solidarité, correction des injustices, transition choisie.","f":"Retraite & dispositifs"},{"n":412,"q":"Quand la pension revalorisée par le HEB III s'applique-t-elle ?","a":"Aux départs à compter du 1er janvier 2027.","f":"Retraite & dispositifs"},{"n":413,"q":"Que faut-il vérifier avant de poser sa date de départ ?","a":"Les 6 mois de HEB III et la date charnière du 1er janvier 2027 : la cellule Retraite fait le calcul.","f":"Retraite & dispositifs"},{"n":414,"q":"Pourquoi « les négociations ont été phénoménales » selon le SNCTA pour la retraite des ICNA grâce au Protocole 2023-2027 ?","a":"Âge préservé, pensions augmentées de plus de 175k€, injustices réparées.","f":"Retraite & dispositifs"},{"n":415,"q":"Quel dispositif la loi Fillon de 2003 avait-elle menacé ?","a":"Les retraites de la profession, déjà défendues pied à pied par le SNCTA.","f":"Retraite & dispositifs"},{"n":416,"q":"Combien d'années de « catégorie active » fonde la spécificité du corps des ICNA ?","a":"Celles du métier de contrôle comme catégorie super-active, justifiant l'âge limite de 59 ans.","f":"Retraite & dispositifs"},{"n":417,"q":"Qui suis-je ? Je pars 8 ans avant un sédentaire.","a":"Un ICNA.","f":"Retraite & dispositifs"},{"n":418,"q":"Quelle question un contrôleur de 45 ans devrait-il poser à la cellule Retraite ?","a":"Sa trajectoire CCA : combien de jours accumuler pour partir à 100 % l'année visée.","f":"Retraite & dispositifs"},{"n":419,"q":"Qu'apporte le CCA à la santé du contrôleur ?","a":"Une fin de carrière progressive, cohérente avec les exigences physiologiques du métier.","f":"Retraite & dispositifs"},{"n":420,"q":"Vrai ou faux : le CCA réduit la rémunération pendant la pré-retraite.","a":"Faux : 100 % maintenue.","f":"Retraite & dispositifs"},{"n":421,"q":"Qui a fait modifier le décret CIT récemment (un indice : celui qui l'a fait créer) ?","a":"Le SNCTA par vigilance juridique et équité.","f":"Retraite & dispositifs"},{"n":422,"q":"Quelle valeur du SNCTA la retraite illustre-t-elle le mieux ?","a":"La solidarité : inter-centres, intergénérationnelle, et envers les situations particulières.","f":"Retraite & dispositifs"},{"n":423,"q":"Quel gain sur 13 ans additionne HEB III et ATC ?","a":"+55 k€ (HEB III) et +112 k€ (ATC) — la retraite fait un énorme bond.","f":"Retraite & dispositifs"},{"n":424,"q":"Que doit faire un contrôleur proche du départ dès aujourd'hui ?","a":"Demander sa simulation personnalisée à la cellule Retraite car après 6 mois de retraite, cette dernière ne pourra plus se faire modifier par les services de l'État, même en cas d'erreur.","f":"Retraite & dispositifs"},{"n":425,"q":"Quel montant mensuel moyen la pension gagne-t-elle pendant 13 ans depuis le Protocole 2023-2027 ?","a":"+1000 € brut.","f":"Retraite & dispositifs"},{"n":426,"q":"Quel montant mensuel moyen la pension gagne-t-elle grâce au HEB III depuis le Protocole 2023-2027 ?","a":"+350 € brut mensuels, à vie.","f":"Retraite & dispositifs"},{"n":427,"q":"Vrai ou faux : les listes 10-11 n'auront jamais de CCA.","a":"Faux : prévu au 1er janvier 2027.","f":"Retraite & dispositifs"},{"n":428,"q":"Pourquoi la retraite est-elle un « bien commun du corps » ?","a":"Parce que ses dispositifs sont collectifs et identiques pour tous. Ce n'est pas une addition de cas individuels.","f":"Retraite & dispositifs"},{"n":429,"q":"Quel lien faire entre le vote de décembre 2026 et votre pension ?","a":"Le prochain protocole (validité : règle des 50 %) portera encore les prochaines avancées en matière de retraite.","f":"Retraite & dispositifs"},{"n":430,"q":"Qui contacter pour toute question retraite, adhérent ou non ?","a":"La cellule Retraite du SNCTA : elle est ouverte à tous.","f":"Retraite & dispositifs"},{"n":431,"q":"Quel combat le livre « L'Aventure du Contrôle Aérien » qualifie-t-il d'« historique et permanent » ?","a":"L'amélioration du montant de la pension concrétisée par le HEB III.","f":"Retraite & dispositifs"},{"n":432,"q":"4 actions, 4 hausses de salaires pour combattre l'inflation : citez-les.","a":"2022 : +4,5 % ; 2023 : +4,5 à +4,68 % des primes ; 2024 : Signature du Protocole ; 2025 : +2,1 %.","f":"Rémunérations & primes"},{"n":433,"q":"Qui suis-je ? J'ai été obtenue sans faire grève, en 2023.","a":"La hausse des primes de +4,5 à +4,68 % — par le seul dépôt d'un préavis pour lutter contre l'inflation.","f":"Rémunérations & primes"},{"n":434,"q":"Que voulait la DGAC pour les « petits » centres au Protocole 2023-2027 ?","a":"Ne pas les revaloriser : le SNCTA a imposé une hausse proportionnelle partout.","f":"Rémunérations & primes"},{"n":435,"q":"Qui suis-je ? Ancienne expérimentation RH ouverte qu'aux listes 1 devenue accessible à tous.","a":"L'option 1 — revalorisée de plus de 30 %.","f":"Rémunérations & primes"},{"n":436,"q":"Où les expérimentations RH ont-elles commencé ?","a":"À Reims en 2015, Roissy et Bordeaux dès 2016, puis dans d'autres CRNA et approches dès 2017.","f":"Rémunérations & primes"},{"n":437,"q":"Qui suis-je ? Je reconnais le choix existant entre une soirée ou une nuit en approches en cycles de 6 jours.","a":"L'option 2-bis, créée par le SNCTA.","f":"Rémunérations & primes"},{"n":438,"q":"Quelle option a gagné presque 70 % depuis la signature du Protocole 2023-2027 ?","a":"L'option 3-2 a été revalorisée deux ans après la signature du protocole.","f":"Rémunérations & primes"},{"n":439,"q":"Quel principe justifie la valorisation des options ?","a":"« Une valorisation à la hauteur des efforts demandés » : aucun effort sans contrepartie.","f":"Rémunérations & primes"},{"n":440,"q":"Qui décide d'adopter une option dans un organisme ?","a":"Les contrôleurs : consultation et/ou vote d'OS représentant au moins 50 %.","f":"Rémunérations & primes"},{"n":441,"q":"Citez des fonctions d'encadrement opérationnel revalorisées par le Protocole 2023-2027.","a":"Chefs de tour, chefs de l'approche, chefs de salle, superviseurs AFTCM, CCA, ACCA.","f":"Rémunérations & primes"},{"n":442,"q":"Qui touche 300 €/mois dès PC+4 au titre de la fidélisation ?","a":"Les contrôleurs du CRNA Nord, du CRNA Est et d'Orly ; prime de fidélisation augmentée de chèques à dates-clés.","f":"Rémunérations & primes"},{"n":443,"q":"Quel second volet complète les 300 €/mois dès PC+4 au titre de la fidélisation ?","a":"Un versement régulier de chèques de fidélisation.","f":"Rémunérations & primes"},{"n":444,"q":"Qu'obtient CDG en parallèle du mécanisme de fidélisation des centres du CRNA Nord, du CRNA Est et d'Orly ?","a":"La réévaluation de la prime spécifique PC+9 / 35 ans et la fin du non-cumul avec la NBI : un bon de +260€/mois minimum en fonction de sa part fonction.","f":"Rémunérations & primes"},{"n":445,"q":"Qui suis-je ? Je valorise une primo-affectation sur un terrain peu attractif ou inattractif depuis le Protocole 2023-2027.","a":"La « prime sortie d'école » de 105,05€/mois.","f":"Rémunérations & primes"},{"n":446,"q":"Citez 5 terrains ouvrant la prime sortie d'école.","a":"Par exemple : approches des SNA N, SNA NE, Le Bourget, Roissy, Orly (aussi Reims, Melun, Cayenne, Mayotte, Toussus).","f":"Rémunérations & primes"},{"n":447,"q":"Qui suis-je ? Je suis versée aux AVE mutant vers les terrains en tension.","a":"L'ITM : indemnité temporaire de mobilité (y compris Orly, Roissy, CRNA Nord et Est) d'une valeur de 10k€ max.","f":"Rémunérations & primes"},{"n":448,"q":"Que compense la somme de 1000 € par trimestre dans le Protocole 2023-2027 ?","a":"Le décalage d'une mutation régulée. Cela est plafonné à 6 mois.","f":"Rémunérations & primes"},{"n":449,"q":"Sur quels leviers simultanés le SNCTA négocie-t-il pour augmenter les salaires ?","a":"Grille indiciaire, échelons terminaux, primes et indemnités — des gains cumulés.","f":"Rémunérations & primes"},{"n":450,"q":"Que refuse le SNCTA en matière salariale entre centres ?","a":"Les revalorisations à deux vitesses.","f":"Rémunérations & primes"},{"n":451,"q":"Quelle mécanique protège le pouvoir d'achat chaque année ?","a":"La prime Performance des contrôleurs.","f":"Rémunérations & primes"},{"n":452,"q":"Qui suis-je ? +467 € brut/mois en fin de carrière.","a":"Les échelons HEB II et III.","f":"Rémunérations & primes"},{"n":453,"q":"Quel gain « part Licence » les 16 ans de MU verrouillent-ils ?","a":"Le niveau de MC ISQ perçu : il est alors conservé même en mutant sur un terrain avec MC ISQ inférieur.","f":"Rémunérations & primes"},{"n":454,"q":"Que maintient-on 12 mois au retour d'un congé parental ?","a":"Les primes : complément (valorisation) et majoration (géographique, fidélisation…) inclus.","f":"Rémunérations & primes"},{"n":455,"q":"Lors d'une inaptitude temporaire, combien de temps sont maintenues les primes ?","a":"12 mois, désormais avec complément et majoration de la part fonctions.","f":"Rémunérations & primes"},{"n":456,"q":"Qui suis-je ? Je conserve la rémunération d'un inapte définitif.","a":"L'indemnité différentielle, enrichie du complément et de la majoration.","f":"Rémunérations & primes"},{"n":457,"q":"Quel contexte rendait improbable la hausse des salaires en 2025 demandée au titre de l'inflation et lors d'un préavis de grève ?","a":"Un contexte politique défavorable mais obtenue quand même : +2,1 %.","f":"Rémunérations & primes"},{"n":458,"q":"Vrai ou faux : la revalorisation inflation 2022 ne concernait que les ICNA.","a":"Faux — ICNA, IESSA et TSEEAC.","f":"Rémunérations & primes"},{"n":459,"q":"Que révèle l'accumulation 2022-2023-2025 autour de la problématique inflation ?","a":"La constance : l'inflation n'a jamais entamé le salaire réel.","f":"Rémunérations & primes"},{"n":460,"q":"Où vérifier ses droits indemnitaires ?","a":"Dans le Guide du Contrôleur et auprès de la cellule ASAP.","f":"Rémunérations & primes"},{"n":461,"q":"Qui a fait créer les primes de fidélisation et d'attractivité ?","a":"Le SNCTA qui identifiait des manques et des incompréhensions, et a su créer les dispositifs, puis les faire progresser.","f":"Rémunérations & primes"},{"n":462,"q":"Que garantit le protocole à un contrôleur d'un petit organisme ?","a":"Une augmentation proportionnelle aussi forte que ce que touchaient les CRNA lors du Protocole signé en 2016.","f":"Rémunérations & primes"},{"n":463,"q":"Quel lien doit-on faire entre options et volontariat d'organisme ?","a":"Les efforts rémunérés ne s'appliquent que librement choisis par les contrôleurs.","f":"Rémunérations & primes"},{"n":464,"q":"Combien de temps la fidélisation CRNA N/E-Orly doit-elle retenir ?","a":"Au moins jusqu'à PC+15.","f":"Rémunérations & primes"},{"n":465,"q":"Qui perçoit l'ITM en mutation ?","a":"L'AVE muté vers les terrains listés, pour accompagner l'installation et son choix de se requalifier sur un terrain peu attractif.","f":"Rémunérations & primes"},{"n":466,"q":"Que devient une expérimentation RH qui fonctionne ?","a":"Une option nationale valorisée : c'est la méthode SNCTA d'institutionnalisation.","f":"Rémunérations & primes"},{"n":467,"q":"Quel fourchette de pourcentages d'augmentation des primes en 2023 compense l'inflation ?","a":"De +4,5 à +4,68 % selon les situations.","f":"Rémunérations & primes"},{"n":468,"q":"Quelle année a vu grève ET hausse de salaire la plus forte ?","a":"2022 : grève du 16 septembre, +4,5 %.","f":"Rémunérations & primes"},{"n":469,"q":"Vrai ou faux : la prime sortie d'école concerne les mutations internes.","a":"Faux — les primo-affectés en sortie d'école.","f":"Rémunérations & primes"},{"n":470,"q":"Que négocie le SNCTA quand un dispositif s'avère sous-évalué ?","a":"Sa revalorisation — comme l'option 3-2, +70 % deux ans après.","f":"Rémunérations & primes"},{"n":471,"q":"Quel montant illustre la protection des mobilités régulées ?","a":"1000 € par trimestre de décalage.","f":"Rémunérations & primes"},{"n":472,"q":"Quelle vote national donne le poids juridique nécessaire aux revalorisations protocolaires ?","a":"Le score en CAP ICNA crédibilise juridiquement tout accord pro-contrôleur.","f":"Rémunérations & primes"},{"n":473,"q":"Quelle question doit-on se poser avant de voter aux élections du 3 au 10 décembre 2026, côté salaires ?","a":"Qui a obtenu ces hausses pour moi ? Encore le SNCTA évidemment.","f":"Rémunérations & primes"},{"n":474,"q":"Depuis 2022, quelle situation rend les recrutements urgents ?","a":"Un tiers du corps qui part entre 2029 et 2035, sachant que former un contrôleur prend 5 ans et que le trafic augmente.","f":"Effectifs & mobilité"},{"n":475,"q":"Que suis-je ? Décision historique arrachée au Gouvernement après 2022.","a":"Une trajectoire pluriannuelle de recrutements ICNA, en dehors des protocoles et au-delà des schémas d'emploi.","f":"Effectifs & mobilité"},{"n":476,"q":"Quels recrutements sur concours CCINP sont actés par la négo post grève en septembre 2022 ?","a":"96 ICNA en 2023, 128 en 2024, 160 par an en 2025, 2026 et 2027.","f":"Effectifs & mobilité"},{"n":477,"q":"Comment compter 1000 ICNA recrutés ?","a":"En ouvrant toutes les voies de recrutements : concours CCINP, EP (Examen Pro : TSEEAC), SP (Sélection Pro : TSEEAC avec MU), CI (Concours Interne), RUE (contrôleurs européens ayant une licence de contrôle européenne, dont militaires français).","f":"Effectifs & mobilité"},{"n":478,"q":"Quel objectif la saturation de l'ÉNAC visait-elle dès 2022 avec 1000 recrutements actés ?","a":"Remplir la capacité maximale de formation de l'école.","f":"Effectifs & mobilité"},{"n":479,"q":"Comment l'ÉNAC s'est-elle adaptée aux 1000 recrutements actés en 2022 ?","a":"En passant de 32 à 40 élèves par promo, davantage d'ICA affectés, et de nouvelles modalités d'organisation (options 1 et 1+).","f":"Effectifs & mobilité"},{"n":480,"q":"Qui suis-je ? Créé en 2025, je donne aux contrôleurs les moyens de promouvoir leur métier.","a":"Le statut d'ambassadeur métier : ASA/Récup, ordres de mission, véhicules, supports. Un projet porté par le SNCTA qui comptait et compte toujours sur les cotisations des adhérents pour promouvoir la profession, et recruter des passionnés.","f":"Effectifs & mobilité"},{"n":481,"q":"Depuis quand le label « Devenir Contrôleur Aérien » existe-t-il ?","a":"Depuis 2017 : compte Instagram avec photos/vidéos/shorts, site internet, vidéos sur Youtube, participations aux forums des classes prépa et salons étudiants, visites de sites opérationnels pour les collégiens, lycéens et étudiants.","f":"Effectifs & mobilité"},{"n":482,"q":"À qui s'adresse le label « Devenir Contrôleur Aérien » ?","a":"Aux jeunes passionnés d'aéronautique, pour les inciter à embrasser une profession passionnante et d'intégrer la formation MCTA dans ce but.","f":"Effectifs & mobilité"},{"n":483,"q":"Quel est le site internet du label « Devenir Contrôleur Aérien » ?","a":"devenir.controleuraerien.fr, accessible aussi depuis sncta.fr.","f":"Effectifs & mobilité"},{"n":484,"q":"Qui suis-je ? Annexé au protocole, je garantis la répartition des effectifs sur 5 ans et une mobilité vers les centres attractifs.","a":"Le PPA : Plan Pluriannuel d'Affectation. C'est une garantie minimale d'affectations en sortie ÉNAC et AVE, donc une garantie aussi de mobilité dans une situation de sous-effectif généralisée.","f":"Effectifs & mobilité"},{"n":485,"q":"Quelle géographie le PPA équilibre-t-il ?","a":"Anticiper les départs à la retraite du « Sud » en remontant les effectifs de ces centres attractifs (Sud), et des centres moins attractifs du Nord.","f":"Effectifs & mobilité"},{"n":486,"q":"Que garantit le PPA côté mobilité ?","a":"Un volume minimal garanti de mobilité et d'AVE attractifs, supérieur à celui de 2024 qui était déjà exceptionnel.","f":"Effectifs & mobilité"},{"n":487,"q":"Que marquait déjà 2024 en matière d'AVE ?","a":"Une rupture avec les années COVID et les velléités de restriction de la DSNA de brider la mobilité.","f":"Effectifs & mobilité"},{"n":488,"q":"Un contrôleur voit sa mutation décalée de 2 trimestres au-delà d'un an depuis un centre dit « régulé » : que touche-t-il ?","a":"2000 € : 1000 € par trimestre, décalage plafonné à 6 mois.","f":"Effectifs & mobilité"},{"n":489,"q":"Quel est le prochain grand combat effectifs ?","a":"Un accord dédié hors protocole : au moins +1300 contrôleurs, soit porter les recrutements à plus de 220 recrutements/an sur 6 ans.","f":"Effectifs & mobilité"},{"n":490,"q":"Pourquoi acter les recrutements hors protocole ?","a":"Pour sanctuariser les effectifs indépendamment des négociations protocolaires. Les effectifs ne doivent pas être une mesure en contrepartie de demandes de l'administration.","f":"Effectifs & mobilité"},{"n":491,"q":"Quel est le rôle de la cellule Mobilité pour tous les contrôleurs lors des Campagnes de Mobilité ?","a":"S'assurer que les demandes de mutations sont correctement analysées par l'administration et éviter les erreurs … comme avant lors des CAP","f":"Effectifs & mobilité"},{"n":492,"q":"Où trouver les fiches de poste et communiqués de résultats de chaque Campagne de Mobilité ?","a":"Sur mobilite.sncta.fr — l'Espace mobilité du SNCTA.","f":"Effectifs & mobilité"},{"n":493,"q":"Comment le SNCTA peut t'accompagner pour un projet de mutation ?","a":"Par un accompagnement personnalisé de la cellule Mobilité.","f":"Effectifs & mobilité"},{"n":494,"q":"Qui suis-je ? Je facilite les venues sur CRNA N, CRNA E, Orly, Roissy ou encore Cayenne et Beauvais.","a":"L'ITM et les primes d'attractivité.","f":"Effectifs & mobilité"},{"n":495,"q":"Quelle grève a débloqué les 1000 recrutements au début 2020 ?","a":"Celle du 16 septembre 2022 — massivement suivie.","f":"Effectifs & mobilité"},{"n":496,"q":"Combien d'ICNA les protocoles des années 1990 avaient-ils déjà arrachés (effectifs qui d'ailleurs partent à la retraite dès la fin des années 2020) ?","a":"540 dès 1995, puis 270 entre 1998 et 2000 : l'histoire se répète.","f":"Effectifs & mobilité"},{"n":497,"q":"Pourquoi chaque année de retard coûte-t-elle 5 ans ?","a":"C'est le délai de formation/qualification : un déficit d'aujourd'hui est un trou garanti demain.","f":"Effectifs & mobilité"},{"n":498,"q":"Quelle politique défend le SNCTA en matière d'effectifs ?","a":"« Par des effectifs à la hauteur du service public. »","f":"Effectifs & mobilité"},{"n":499,"q":"Quelle voie de recrutement le corps unique ajoute-t-il ?","a":"La sélection au choix — TSEEAC rejoignant le corps ICNA.","f":"Effectifs & mobilité"},{"n":500,"q":"Que devient la promotion du métier avec l'ambassadeur ?","a":"Une action avec les moyens à sa disposition : le contrôleur promeut sa profession avec des moyens fournis et une reconnaissance.","f":"Effectifs & mobilité"},{"n":501,"q":"Qu'est-ce qui permet de faire remonter l'effectif des centres du « Nord » à horizon 2028-2029 ?","a":"Le PPA avec des affectations garanties de sorties ÉNAC et des AVE.","f":"Effectifs & mobilité"},{"n":502,"q":"Vrai ou faux : le PPA relève d'un simple engagement oral.","a":"Faux, il est annexé au protocole et est opposable.","f":"Effectifs & mobilité"},{"n":503,"q":"Vrai ou faux : la mobilité garantie date des années COVID.","a":"Faux. C'est le PPA qui la garantit, en rupture avec ces années. Pendant les années Covid, il s'agissait même de l'inverse.","f":"Effectifs & mobilité"},{"n":504,"q":"Quand a lieu la vague de départ à la retraite consécutive aux nombreux recrutements des années 90 ?","a":"2029-2035 — d'où l'urgence des recrutements.","f":"Effectifs & mobilité"},{"n":505,"q":"Comment former les promo de 40 élèves à l'ÉNAC depuis la signature du dernier Protocole ?","a":"Davantage d'ICA affectés obtenus simultanément à l'adaptation de l'école.","f":"Effectifs & mobilité"},{"n":506,"q":"Que marquent ou doivent marquer les années 1995, 2022 et 2027 ?","a":"À chaque génération, le SNCTA obtient les recrutements nécessaires des Pouvoirs publics.","f":"Effectifs & mobilité"},{"n":507,"q":"Que change l'accord effectifs de 2022 pour un stagiaire de 2027 ?","a":"Une école à pleine capacité, des AVE garantis, un centre dont les effectifs sont remontés.","f":"Effectifs & mobilité"},{"n":508,"q":"En une phrase : pourquoi +1300 ?","a":"Parce qu'un tiers du corps part, que former prend 5 ans, et que le service public mérite des effectifs à la hauteur des enjeux.","f":"Effectifs & mobilité"},{"n":509,"q":"Qui suis-je ? Fruit de plus de 5 ans de travaux internes au SNCTA, voire 10 pour les options.","a":"L'arrêté 2024 sur l'organisation du travail des contrôleurs.","f":"Organisation du travail"},{"n":510,"q":"Qui l'arrêté 2024 couvre-t-il ?","a":"Les contrôleurs des listes 1 à 11, de l'ÉNAC et les contrôleurs en formation.","f":"Organisation du travail"},{"n":511,"q":"Citez les trois garanties du droit à congés de l'arrêté 2024 ?","a":"25 % minimum tous les jours, 14 jours consécutifs garantis en juillet-août, davantage de congés grâce aux recyclages libres.","f":"Organisation du travail"},{"n":512,"q":"Que créent les recyclages libres dans l'arrêté 2024 ?","a":"Un droit à congé ou récupération supplémentaire.","f":"Organisation du travail"},{"n":513,"q":"Quels principes protecteurs sont réaffirmés par l'arrêté 2024 ?","a":"1420 h annuelles max, 32 h hebdo en moyenne, 1 jour sur 2 sur l'année, travail en équipe listes 1 à 5.","f":"Organisation du travail"},{"n":514,"q":"Une semaine chargée à 40 h : que doit le contrôleur ensuite ?","a":"Rien — toute heure ou jour en moins n'est ni dû, ni à rattraper (32 h en moyenne).","f":"Organisation du travail"},{"n":515,"q":"Quelle durée de pause est sacralisée en nuit ?","a":"2 h de pause consécutives.","f":"Organisation du travail"},{"n":516,"q":"Quelle est la durée de pause déjeuner en option 1 ?","a":"1 h — contre 45 min minimum en socle pour les équipes et les pôles.","f":"Organisation du travail"},{"n":517,"q":"Citez trois bornes fatigue de l'arrêté 2024 ?","a":"48 h max sur 7 jours glissants, vacations de jour £ 10 h, dépassement des 32 h £ 64 h/an.","f":"Organisation du travail"},{"n":518,"q":"Que suis-je ? Je permets aux contrôleurs de décider de leurs options d'organisation du travail.","a":"Le volontariat d'organisme : consultation et/ou vote des représentants d'au moins 50% des contrôleurs.","f":"Organisation du travail"},{"n":519,"q":"Quel engagement du SNCTA le volontariat d'organisme de l'arrêté 2024 prolonge-t-il ?","a":"« Le SNCTA a toujours laissé le choix aux contrôleurs de leur organisation du travail. »","f":"Organisation du travail"},{"n":520,"q":"Un jour de surcapacité (plus de contrôleurs que ne le demande le BC), à quoi sert une VIC ?","a":"Être chez soi, rappelable selon modalités ; la VIC est transformable en congé jusqu'à J-1.","f":"Organisation du travail"},{"n":521,"q":"Que normalise juridiquement la VIC ?","a":"Le cadre opérationnel de la surcapacité à la place d'une zone grise.","f":"Organisation du travail"},{"n":522,"q":"Qui gère les montées décalées et départs anticipés ?","a":"Les opérationnels — la gestion des salles et tours leur est rendue.","f":"Organisation du travail"},{"n":523,"q":"Quelles bornes encadrent les MDDA ?","a":"4 h de présence minimum sur site avec un traitement spécifique des nuits.","f":"Organisation du travail"},{"n":524,"q":"Comment VIC et MDDA comptent-elles dans le temps de travail ?","a":"Comme du temps de travail effectif, un élément protecteur pour contrôleurs et responsables de site.","f":"Organisation du travail"},{"n":525,"q":"Qui suis-je ? Je réduis le temps de travail par l'octroi de 18 récupérations.","a":"Les 28 h hebdomadaires : 18 récupérations en début d'année (6 hors-salle MU), sans impact sur les éventuels JRH.","f":"Organisation du travail"},{"n":526,"q":"Qui avait 27 et 32 jours de congés avant le Protocole 2023-2027 ?","a":"Les opérationnels (27) et les hors-salle avec MU (32) — désormais les congés sont de 28 et respectivement 39.","f":"Organisation du travail"},{"n":527,"q":"Sur quoi porte l'offensive juridique du SNCTA contre la biométrie ?","a":"Le passage en force de la DSNA, contraire au BEA, à la CNIL, aux consignes ministérielles et au dialogue social.","f":"Organisation du travail"},{"n":528,"q":"Qui vote la déclinaison d'une option localement ?","a":"Les contrôleurs de l'organisme et/ou leurs OS majoritaires (‡50 %).","f":"Organisation du travail"},{"n":529,"q":"De quoi protège la limite de 10 h de vacation ?","a":"D'un manque de vigilance et de la fatigue.","f":"Organisation du travail"},{"n":530,"q":"Vrai ou faux : l'arrêté 2024 a réaffirmé le 1 jour sur 2 comme principe fondateur.","a":"Vrai.","f":"Organisation du travail"},{"n":531,"q":"Que garantit le socle de l'arrêté 2024 même sans option ?","a":"25 % de congés, 14 jours consécutifs l'été, pauses, bornes fatigue.","f":"Organisation du travail"},{"n":532,"q":"Où trouver tous les détails de vos droits ?","a":"Dans le Guide du Contrôleur, disponible à l'achat sur sncta.fr.","f":"Organisation du travail"},{"n":533,"q":"Combien de récupérations obtient un hors-salle avec MU dans son CCA ?","a":"6 en début d'année — contre 18 pour les opérationnels.","f":"Organisation du travail"},{"n":534,"q":"Qui suis-je ? Je déplafonne le télétravail des contrôleurs.","a":"L'accord obtenu par le SNCTA à l'issue d'une réunion de conciliation : minimum 2 jours de bureau/semaine en moyenne mensuelle.","f":"Solidarité, PSC & accompagnement"},{"n":535,"q":"Le télétravail est-il accessible aux contrôleurs en salle ?","a":"Oui, le télétravail est permis pour les EAO d'anglais par ex.","f":"Solidarité, PSC & accompagnement"},{"n":536,"q":"Un congé de naissance impacte-t-il alpha ou beta ?","a":"Non, il n'est pas inclus dedans.","f":"Solidarité, PSC & accompagnement"},{"n":537,"q":"Que permet un congé de paternité fractionné et anticipé ?","a":"Au collègue d'être considéré comme sorti d'équipe, comme pour le congé maternité.","f":"Solidarité, PSC & accompagnement"},{"n":538,"q":"Quelles primes sont maintenues 12 mois au retour de congés familiaux ?","a":"Celles incluant complément et majoration de la part fonctions.","f":"Solidarité, PSC & accompagnement"},{"n":539,"q":"Pourquoi une PSC a été négociée au niveau DGAC et non au niveau ministériel ?","a":"Pour préserver les spécificités des contrôleurs, notamment la prévoyance.","f":"Solidarité, PSC & accompagnement"},{"n":540,"q":"Qu'a permis le report de la PSC au 1er mai 2026 ?","a":"Intégrer pleinement le risque prévoyance à l'appel d'offres, sans précipitation, aux bénéfices des contrôleurs.","f":"Solidarité, PSC & accompagnement"},{"n":541,"q":"Que garantit le niveau haut de l'accord PSC santé de la DGAC disponible depuis 2026 ?","a":"Au moins l'équivalent du niveau 3 MGAS, négocié lors du précédent référencement mutuel, avec de meilleurs remboursements dentaire et optique.","f":"Solidarité, PSC & accompagnement"},{"n":542,"q":"Combien y a-t-il de niveaux de garanties santé dans l'accord PSC de la DGAC disponible depuis 2026 ?","a":"3 niveaux maintenus.","f":"Solidarité, PSC & accompagnement"},{"n":543,"q":"Quel dispositif incitatif accompagne le dernier contrat Prévoyance de la MGAS disponible depuis 2026 ?","a":"6 mois sans questionnaire de santé, -50 % pour les moins de 30 ans.","f":"Solidarité, PSC & accompagnement"},{"n":544,"q":"Qui suis-je ? Dispositif de soutien par des pairs après un événement de sécurité.","a":"Le CISM — inscrit au plan d'action DO dès 2023 à l'initiative du SNCTA.","f":"Solidarité, PSC & accompagnement"},{"n":545,"q":"Que comprend la coordination nationale CISM ?","a":"Formation des pairs contrôleurs, contrats avec des psychologues dédiés, communication auprès des contrôleurs.","f":"Solidarité, PSC & accompagnement"},{"n":546,"q":"Qui a été l'instigateur du pôle CNA ?","a":"Le SNCTA, au milieu des années 2010.","f":"Solidarité, PSC & accompagnement"},{"n":547,"q":"Quels sujets les représentants SNCTA portent-ils en FS ?","a":"Baromètre social, LVSS, égalité femmes-hommes, action sociale (sport, restauration, voyages…), NBT et désagréments (fuites, amiante, radon, ascenseurs, température, lumière bleue…).","f":"Solidarité, PSC & accompagnement"},{"n":548,"q":"Que mesure le baromètre social de la DGAC depuis la sortie du Covid-19 ?","a":"Un décrochage à la DO et à la DSNA entre contrôleurs et encadrement national.","f":"Solidarité, PSC & accompagnement"},{"n":549,"q":"Que doit concilier la QVCT ?","a":"Amélioration des conditions de travail et performance globale des services.","f":"Solidarité, PSC & accompagnement"},{"n":550,"q":"Que garantit CÉSAME à celui qui la contacte ?","a":"Anonymat et confidentialité sur toute problématique médicale.","f":"Solidarité, PSC & accompagnement"},{"n":551,"q":"Comment contacter la cellule Mayday du SNCTA alors qu'une enquête de sécurité a ou va avoir lieu ?","a":"Via le formulaire dédié sur le site sncta.fr, accessible depuis l'accueil bouton en haut « Mayday ».","f":"Solidarité, PSC & accompagnement"},{"n":552,"q":"Qui dans le SNCTA accompagne un contrôleur convoqué par le BEA ou la GTA ?","a":"La cellule Mayday avec des pairs Mayday pour vous écouter et informer, en toute confidentialité.","f":"Solidarité, PSC & accompagnement"},{"n":553,"q":"Que finance la mutualisation des cotisations dans Mayday ?","a":"La mise en relation des adhérents avec un cabinet d'avocats pénalistes de tout premier plan.","f":"Solidarité, PSC & accompagnement"},{"n":554,"q":"Qui suis-je ? Créé en 2025 pour les contrôleurs ultramarins adhérents du SNCTA.","a":"Le conseil outre-mer pour aborder et résoudre toute question ou situation concernant des problématiques opérationnelles, techniques, d'affectations, d'éloignement, ou de déroulé de carrière.","f":"Solidarité, PSC & accompagnement"},{"n":555,"q":"Que conserve à vie, depuis le Protocole 2023-2027, un contrôleur d'une approche délocalisée sur un autre terrain ?","a":"Son maintien indemnitaire et son déroulé de carrière possible jusqu'au HEA III, sans contrainte de mutation professionnelle.","f":"Solidarité, PSC & accompagnement"},{"n":556,"q":"Combien de CDM de priorité permettent à un contrôleur d'une approche reprise de muter avec une priorité reconnue par la DGAC sur un poste opérationnel ouvert ?","a":"13 CDM","f":"Solidarité, PSC & accompagnement"},{"n":557,"q":"Outre les contrôleurs concernés localement par une reprise d'approche, à qui bénéficie la priorité 13 CDM indirectement ?","a":"Tout le corps : la mobilité générale est moins impactée par les restructurations.","f":"Solidarité, PSC & accompagnement"},{"n":558,"q":"Quelles primes du Protocole 2023-2027 accompagnent une fermeture de site pour un TSEEAC contrôleur ?","a":"Prime de Restructuration jusqu'à 30 k€, accompagnement du conjoint, et une prime créée par le Protocole de 20 k€.","f":"Solidarité, PSC & accompagnement"},{"n":559,"q":"Qui suis-je ? Je maintiens le salaire d'un inapte au contrôle définitif.","a":"L'indemnité différentielle.","f":"Solidarité, PSC & accompagnement"},{"n":560,"q":"Quelles nouveautés apporte le Protocole 2023-2027 à l'indemnité différentielle ?","a":"Le complément et la majoration de la part fonctions sont désormais maintenus (options, fidélisation) « dans l'esprit de sa construction historique ».","f":"Solidarité, PSC & accompagnement"},{"n":561,"q":"Qu'est-ce qui motive le SNCTA à améliorer le dispositif d'indemnité différentielle ?","a":"La solidarité : toute situation mérite accompagnement, surtout dans les coups durs.","f":"Solidarité, PSC & accompagnement"},{"n":562,"q":"Combien de bénévoles font vivre le SNCTA et sont à votre écoute ?","a":"Environ 200 experts et représentants.","f":"Solidarité, PSC & accompagnement"},{"n":563,"q":"Qui peut contacter les cellules du SNCTA ?","a":"Tous les contrôleurs : adhérents et non-adhérents","f":"Solidarité, PSC & accompagnement"},{"n":564,"q":"Quel délai moyen de réponse pour ASAP ?","a":"Moins de 15 jours : réponse 100 % individualisée.","f":"Solidarité, PSC & accompagnement"},{"n":565,"q":"Que types de newsletters envoie le SNCTA par mail ?","a":"Trois niveaux de communication : nationale, régionale et locale. Deux niveaux de distinction : publique (des contrôleurs aux Directeurs de la DGAC, en passant par les Pouvoirs Publics et journalistes) ou uniquement pour les adhérents. Au final, ce sont donc 6 formes de communication.","f":"Solidarité, PSC & accompagnement"},{"n":566,"q":"Quelle application prolonge le site internet sncta.fr ?","a":"L'appli mobile SNCTA (iOS et Android) — actualités et services.","f":"Solidarité, PSC & accompagnement"},{"n":567,"q":"Que traite la rubrique « Vous accompagner » du site internet du SNCTA ?","a":"Les cellules, l'aptitude médicale, la PSC et le Guide du Contrôleur.","f":"Solidarité, PSC & accompagnement"},{"n":568,"q":"Qui répond aux questions PSC des contrôleurs ?","a":"Une équipe dédiée du SNCTA : experts de l'action sociale, membres de la cellule CÉSAME et le Bureau national.","f":"Solidarité, PSC & accompagnement"},{"n":569,"q":"Quel changement apporte le Protocole 2023-2027 à un jeune papa ?","a":"Il est sorti d'équipe : c'est une organisation sereine et anticipée du congé fractionné, à l'instar du congé maternité.","f":"Solidarité, PSC & accompagnement"},{"n":570,"q":"Quelle avancée illustre l'attention aux aidants du Protocole 2023-2027 ?","a":"Un maintien de primes pendant 12 mois au retour d'un congé de proche aidant.","f":"Solidarité, PSC & accompagnement"},{"n":571,"q":"Quelle promesse la solidarité fait-elle aux ultramarins ?","a":"Un accompagnement de même qualité et une disponibilité du SNCTA à leurs horaires","f":"Solidarité, PSC & accompagnement"},{"n":572,"q":"Quel réflexe en cas de difficulté, quelle qu'elle soit ?","a":"Contacter la cellule compétente du SNCTA et son représentant local ou régional.","f":"Solidarité, PSC & accompagnement"},{"n":573,"q":"Combien de membres compte le comité national du SNCTA qui se réunit en moyenne tous les 2 mois en présentiel ?","a":"34 membres élus.","f":"Vie du syndicat & sections"},{"n":574,"q":"Comment se composent les 34 membres du comité national du SNCTA ?","a":"26 élus par le congrès, 2 élus par chaque conseil régional, 1 élu par le conseil TSEEAC, 1 élu par le conseil outre-mer.","f":"Vie du syndicat & sections"},{"n":575,"q":"Quand prend fin le mandat du comité national ?","a":"Au congrès suivant, le congrès se tient tous les 2 ans.","f":"Vie du syndicat & sections"},{"n":576,"q":"Quels sont les organismes directeurs du SNCTA, en charge de l'application de la politique votée par ses adhérents ?","a":"Les organismes directeurs du SNCTA sont : Bureau national, comité national, conseils régionaux, conseil TSEEAC, conseil outre-mer et commissions permanentes.","f":"Vie du syndicat & sections"},{"n":577,"q":"Qui élit le bureau national ?","a":"Le comité national.","f":"Vie du syndicat & sections"},{"n":578,"q":"Que fait un représentant local SNCTA quand une question dépasse son périmètre local ?","a":"Il contacte le bureau régional ou bureau Outre-mer dont il dépend (et son bureau TSEEAC si besoin), ou le bureau national.","f":"Vie du syndicat & sections"},{"n":579,"q":"Que trouve-t-on sous l'onglet « Progrès Social » du site internet du SNCTA ?","a":"« L'Aventure du Contrôle Aérien » : 300 pages qui détaillent chronologiquement les moments qui ont rythmé la vie syndicale et de la profession depuis la fin de la seconde guerre mondiale. Les grandes dates sont à retrouver dans les communications thématiques « Créateur de Progrès Social depuis 1965 ».","f":"Vie du syndicat & sections"},{"n":580,"q":"Quelle plateforme héberge l'Espace mobilité du SNCTA ?","a":"mobilite.sncta.fr, accessible aussi depuis la page d'accueil du SNCTA.","f":"Vie du syndicat & sections"},{"n":581,"q":"Que prouve la densité des flash infos locaux sur le site SNCTA ?","a":"Un maillage de sections actives partout : une vision nationale qui se décline localement.","f":"Vie du syndicat & sections"},{"n":582,"q":"Une section locale SNCTA a besoin d'un préavis de grève local pour faire aboutir des revendications légitimes, comment s'y prend-elle ?","a":"La section locale dépose son préavis conjointement avec le conseil régional ou le bureau national.","f":"Vie du syndicat & sections"},{"n":583,"q":"Que garantit la structure régionale du SNCTA ?","a":"Un relais entre le terrain et le national — conseils régionaux et outre-mer représentés au comité national.","f":"Vie du syndicat & sections"},{"n":584,"q":"Quelle instance représente spécifiquement les TSEEAC ?","a":"Le conseil TSEEAC — avec son bureau et son élu au comité national.","f":"Vie du syndicat & sections"},{"n":585,"q":"Pourquoi la vie des sections est-elle un argument de vote en faveur du SNCTA ?","a":"Voter au CSA DSNA (ou SEAC-PF, DAC-NC, ÉNAC), c'est donner du poids à ses représentants locaux SNCTA qui construiront son avenir local.","f":"Vie du syndicat & sections"},{"n":586,"q":"Quelle promesse fait le SNCTA aux contrôleurs ?","a":"D'avoir des représentants SNCTA qui proposeront toujours une alternative crédible.","f":"Vie du syndicat & sections"},{"n":587,"q":"Quelle brochure a précédé la création du syndicat dans les années 60 ?","a":"Celle des contrôleurs CFTC témoignant du déclassement des contrôleurs français face aux collègues anglo-saxons et de l'inadaptation des moyens — couverture radar très insuffisante.","f":"Histoire — Pionniers & années 1960"},{"n":588,"q":"Qu'ont risqué les auteurs de la brochure qui a précédé la création du syndicat dans les années 60 ?","a":"Des sanctions pour manquement au devoir de réserve.","f":"Histoire — Pionniers & années 1960"},{"n":589,"q":"Qui sont les trois premières femmes contrôleuses recrutées en 1966 ?","a":"Claudette Blanchot, Mireille Giraud et Christiane Vilain — promotion TNA-E 1966A.","f":"Histoire — Pionniers & années 1960"},{"n":590,"q":"Quel poste les femmes occupaient-elles avant 1966 ?","a":"Assistantes du contrôle dans un métier alors très masculin.","f":"Histoire — Pionniers & années 1960"},{"n":591,"q":"Comment le livre « L'Aventure du contrôle aérien » qualifie-t-il le recrutement de femmes permis les contrôleurs 1966 ?","a":"« C'est une révolution ».","f":"Histoire — Pionniers & années 1960"},{"n":592,"q":"Que compare la commission de 1968 autour de l'organisation du contrôle aérien ?","a":"Les administrations de l'aviation civile française et étrangères — le SOCCA y obtient une représentation.","f":"Histoire — Pionniers & années 1960"},{"n":593,"q":"Quelle conclusion est faite par la commission qui examine les conditions des contrôleurs anglais en 1968 ?","a":"« Ils jouissent d'un classement comparable à celui des hauts fonctionnaires ».","f":"Histoire — Pionniers & années 1960"},{"n":594,"q":"Pourquoi la commission de 1968 n'a-t-elle rien conclu suite à l'étude comparative des navigations aériennes dans d'autres pays ?","a":"Administration et autres syndicats voulaient préserver les privilèges de leurs corps, le SOCCA (futur SNCTA) la quittera au printemps 1969.","f":"Histoire — Pionniers & années 1960"},{"n":595,"q":"Quel est le score aux premières élections professionnelles du SOCCA (futur SNCTA) en 1968 ?","a":"50,4 % — face aux 49,6 % à une liste commune CGT-CFDT-FO.","f":"Histoire — Pionniers & années 1960"},{"n":596,"q":"Quelle est la consigne fondatrice de Daniel Gorin, fondateur du SNCTA, sur la méthode à appliquer ?","a":"« D'abord, nous organiser et nous documenter pour éviter les failles dans notre argumentation ».","f":"Histoire — Pionniers & années 1960"},{"n":597,"q":"Que promettait aux contrôleurs Daniel Gorin face à l'administration lors de la création du SNCTA ?","a":"« Dénoncer chaque fois qu'il le faudra, et avec la virulence nécessaire, l'immobilisme et l'incohérence de l'Administration ».","f":"Histoire — Pionniers & années 1960"},{"n":598,"q":"Que promettait aux contrôleurs Daniel Gorin concernant de futurs alliances lors de la création du SNCTA ?","a":"« Multiplier les contacts avec ceux qui peuvent nous aider et ceux qui bénéficient de notre activité ».","f":"Histoire — Pionniers & années 1960"},{"n":599,"q":"Quels corps le SNCTA a-t-il défendus ensemble ?","a":"Les OCCA devenus ICNA et les TAC devenus TSEEAC, jusqu'au corps unique de contrôleurs.","f":"Histoire — Pionniers & années 1960"},{"n":600,"q":"Depuis quand les contrôleurs exercent-ils sous licence européenne ?","a":"Depuis 2008.","f":"Histoire — Pionniers & années 1960"},{"n":601,"q":"Quelle citation de Michelle Obama le livre « L'Aventure du Contrôle Aérien » met-il en lumière de part son illustration des propos des créateurs du SNCTA dans les années 60 ?","a":"« Ne laissez personne parler pour vous et ne comptez pas sur les autres pour se battre pour vous ».","f":"Histoire — Pionniers & années 1960"},{"n":602,"q":"Pourquoi la loi ICNA traite-t-elle directement la retraite propre au corps ?","a":"Par nécessité de sécurité sous exercice d'une licence avec un volet médical exigeant.","f":"Histoire — Pionniers & années 1960"},{"n":603,"q":"À quoi le décret statutaire ICNA permet-il de déroger ?","a":"À l'organisation du travail de la Fonction publique et au droit du travail en général, notamment.","f":"Histoire — Pionniers & années 1960"},{"n":604,"q":"Qu'est-ce qui a financé les progrès indemnitaires de la profession ?","a":"La croissance du trafic et les redevances de contrôle payées par les compagnies pour le service rendu.","f":"Histoire — Pionniers & années 1960"},{"n":605,"q":"Le SNCTA participe-t-il à des mouvements intersyndicaux nationaux ?","a":"Rarement : les spécificités de la profession rendent cela peu opportun et peu audible pour la défense des intérêts des contrôleurs.","f":"Histoire — Pionniers & années 1960"},{"n":606,"q":"Quelle liberté politique ont les adhérents du SNCTA ?","a":"Totale : expression, adhésion à un parti, militantisme est possible pour les adhérents. Le syndicat, lui, reste apolitique.","f":"Histoire — Pionniers & années 1960"},{"n":607,"q":"D'où découle l'apolitisme du SNCTA ?","a":"De son caractère autonome et du caractère démocratique des institutions nationales.","f":"Histoire — Pionniers & années 1960"},{"n":608,"q":"Quelle interdiction pesait sur les OCCA dès leur création statutaire ?","a":"Celle de faire grève : loi n°64-650 du 2 juillet 1964.","f":"Histoire — Pionniers & années 1960"},{"n":609,"q":"Quel régime hiérarchique dénonçait Jean-Marie Lefranc, fondateur du SNCTA ?","a":"Un système hiérarchique pyramidal.","f":"Histoire — Pionniers & années 1960"},{"n":610,"q":"D'où venait l'esprit d'indépendance des premiers fondateurs du SNCTA ?","a":"De leur jeunesse dans la résistance et l'aviation lors de la fin de la guerre 39-45.","f":"Histoire — Pionniers & années 1960"},{"n":611,"q":"Que découvrait un jeune contrôleur des années 60 selon J.M Lefranc, fondateur du SNCTA ?","a":"« Un exercice d'autonomie de décision assez gratifiant ».","f":"Histoire — Pionniers & années 1960"},{"n":612,"q":"Quelle responsabilité bascule du pilote vers le contrôleur dans les années 60 ?","a":"L'anti-collision qui est transférée du commandant de bord aux contrôleurs avec l'arrivée massive d'avions à réaction et la forte densité du trafic.","f":"Histoire — Pionniers & années 1960"},{"n":613,"q":"Pourquoi le classement en catégorie B de 1947 était-il inadapté ?","a":"Il catégorisait un contrôleur comme un fournisseur de renseignements — d'où la catégorie B d'exécution.","f":"Histoire — Pionniers & années 1960"},{"n":614,"q":"Qu'appelait J.M. Lefranc, fondateur du SNCTA, un « bouillon de culture » ?","a":"Ce mélange d'autonomie réelle et de cadre règlementaire inadapté, générateur de conflits retentissants.","f":"Histoire — Pionniers & années 1960"},{"n":615,"q":"Comment J.M Lefranc lègue au SNCTA et à la profession, l'histoire d'une profession et de son syndicat ?","a":"Dans une interview de 1992, à l'occasion de son départ en retraite — Conflits Dans l'Air n°56.","f":"Histoire — Pionniers & années 1960"},{"n":616,"q":"Que célèbre la promotion TNA-E 1966A dans l'histoire du métier ?","a":"L'entrée des femmes dans le contrôle aérien français.","f":"Histoire — Pionniers & années 1960"},{"n":617,"q":"Que révèle le premier score du SNCTA aux élections de 1968 (50,4 %) ?","a":"Que le SNCTA est majoritaire chez les contrôleurs quasiment depuis sa naissance.","f":"Histoire — Pionniers & années 1960"},{"n":618,"q":"Quelle constante retrouve-t-on au SNCTA depuis 1965 et jusqu'en 2026 ?","a":"Un syndicat de contrôleurs, pour des contrôleurs.","f":"Histoire — Pionniers & années 1960"},{"n":619,"q":"Que doit faire un représentant SNCTA pour ses collègues selon Daniel Gorin, fondateur du SNCTA ?","a":"Défendre correctement chacun, sur les problèmes généraux comme individuels.","f":"Histoire — Pionniers & années 1960"},{"n":620,"q":"Quelle place l'ATCEUC occupe-t-elle dans les travaux du SNCTA ?","a":"Le SNCTA en assure sa présidence. Cette confédération européenne des syndicats de contrôleurs est l'interlocutrice des institutions européennes pour les questions professionnelles en lien avec le contrôle aérien.","f":"Histoire — Pionniers & années 1960"},{"n":621,"q":"En une phrase : que doivent les contrôleurs de 2026 aux pionniers ?","a":"Un syndicat crédible dans ses actions, autonome et professionnel, au service d'une profession reconnue dans ses missions aux yeux des Pouvoirs publics.","f":"Histoire — Pionniers & années 1960"},{"n":622,"q":"Quel texte reste en vigueur au début des années 1980 et qui revêt un caractère dangereux pour la sécurité du trafic aérien ?","a":"Le plan Clément Marot — « texte réglementaire d'un autre temps » que le ministre refuse d'abroger qui permet de remplacer les contrôleurs aériens civils par des militaires.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":623,"q":"Qu'évoque le ministre en bilatérale de juillet 1982 pour encadrer le futur droit de grève des contrôleurs aériens ?","a":"Un service minimum, première apparition de l'idée.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":624,"q":"Qu'envoie le SNCTA aux parlementaires le 19 janvier 1983 ?","a":"Cinq questions sur le droit de grève et le « service minimum », à chaque député et sénateur.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":625,"q":"Combien de réponses reçoit-il ?","a":"84 — l'opposition approuve le droit de grève, la majorité répond évasivement.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":626,"q":"Où est déposé le premier préavis de grève totale du 25 janvier 1983 ?","a":"À Clermont-Ferrand — la première grève totale depuis 1973.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":627,"q":"Quel centre ouvre le 23 février 1983 ?","a":"Le CRNA de Reims.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":628,"q":"Quelle action démarre à Aix le 11 mai 1983 ?","a":"Une régulation syndicale à 10 avions par secteur — étendue ensuite à d'autres centres avec arrêts de décollages.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":629,"q":"Contre quoi proteste seul le SNCTA face au ministre le 23 juin 1983 ?","a":"Les sanctions pécuniaires infligées à des contrôleurs de Marignane, Aix et Toulouse.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":630,"q":"Que répond le ministre au SNCTA qui proteste contre les sanctions pécuniaires infligées à des contrôleurs de Marignane, Aix et Toulouse ?","a":"« Ces sanctions ne seront pas appliquées » — et le DG, assis à sa droite, « se décompose ».","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":631,"q":"Qu'est-ce que le « groupe de sages » créé en 1983 ?","a":"Un groupe extérieur à l'administration et aux syndicats, chargé d'étudier l'évolution de la Navigation Aérienne.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":632,"q":"Quelle vieille revendication de sécurité aboutit en 1983 ?","a":"Une procédure de recueil et d'analyse des dysfonctionnements du système de contrôle.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":633,"q":"Quelle très vieille revendication indemnitaire aboutit au 1er juillet 1983 ?","a":"Le PC Approche : arrêtés contresignés par le Budget et la Fonction publique.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":634,"q":"Que refuse l'administration en 1983 malgré tout ?","a":"L'intégration des primes dans la retraite, les 32 heures dans les tours, la fin de la mixité civil-militaire.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":635,"q":"Pourquoi l'administration refuse-t-elle depuis 1983 d'intégrer les primes dans la retraite (et qui amènera à la création par le SNCTA de l'ATC) ?","a":"Par crainte de la contagion à d'autres corps de la Fonction publique.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":636,"q":"Que fait le Conseil des ministres le 9 novembre 1983 ?","a":"Il adopte le projet de loi de service minimum en cas de grève des contrôleurs aériens.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":637,"q":"Que décide l'AG du CCR Nord le 16 février 1984 ?","a":"La reprise des arrêts de décollages.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":638,"q":"Quelles réactions de l'administration font suite à la reprise des arrêts de décollages au CCR Nord dès le 16 février 1984 ?","a":"Des sanctions apparaissent dès le 23 février contre les contrôleurs qui n'arment pas les SIV. Le conflit s'étend alors, l'ampleur est inégalée depuis 1979.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":639,"q":"Que valide la Commission des lois le 19 avril 1984 ?","a":"Le projet de loi sur le service minimum.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":640,"q":"Quel double héritage l'année 1984 laisse-t-elle aux contrôleurs ?","a":"Le droit de grève enfin obtenu, assorti de la première version du service minimum.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":641,"q":"Les élections en CAP de 1984 sont annoncées dans un temps très court, quel est le timing de cette information ?","a":"Le 6 avril, pour des élections en juin.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":642,"q":"Quelle méthode parlementaire le SNCTA inaugure-t-il en 1983 ?","a":"Le questionnement direct et systématique des élus, 40 ans avant la loi de 2023.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":643,"q":"Quel parallèle peut-on faire entre 1983 et 2023 concernant le droit de grève ?","a":"Dans les deux cas, le service minimum arrive par la loi mais en 2023, le SNCTA en négocie le niveau à la baisse.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":644,"q":"Quelle revendication de 1983 évoluera en 2024 ?","a":"Les 32 heures, refusées dans les tours en 1983, arriveront bien plus tard et seront renégociées à un équivalent de 28 h par les 18 récupérations dans le CCA.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":645,"q":"Quel outil d'analyse de sécurité naît en 1983 ?","a":"Le recueil des dysfonctionnements : ancêtre de la culture du retour d'expérience.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":646,"q":"Que signifie « armer les SIV » dans le conflit de 1984 ?","a":"Tenir les secteurs d'information de vol ; le refus de les armer fut sanctionné, déclenchant l'extension du conflit.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":647,"q":"Quel centre est inauguré en 1983 ?","a":"Le CRNA de Reims.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":648,"q":"Qui lança les régulations à « 10 avions par secteur » au siècle passé ?","a":"Les contrôleurs d'Aix avant l'extension nationale.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":649,"q":"Quelle leçon le SNCTA tire-t-il des années 1980-1985 ?","a":"La ténacité paie : chaque acquis (PC Approche, droit de grève) a demandé des années de pression continue.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":650,"q":"Que devient le plan Clément Marot après 1984 ?","a":"Caduc de fait : le droit de grève encadré remplace la réquisition militaire.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":651,"q":"Quand voit le jour le titre de PC en Approche ?","a":"Le 1er juillet 1983.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":652,"q":"Quelle instance le SNCTA rencontre-t-il « en intersyndicale » en 1983 ?","a":"Le ministre, cas rare à l'époque, le SNCTA privilégiant l'action autonome.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":653,"q":"Quels ministères contresignent les arrêtés PC Approche dès les années 80 ?","a":"Le Budget et la Fonction publique.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":654,"q":"Quel enseignement ne faut-il pas oublier concernant notre droit de grève d'aujourd'hui ?","a":"Le droit de grève s'est conquis en 20 ans. Il faut le protéger par une utilisation efficace pour faire aboutir les revendications légitimes des contrôleurs aériens.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":655,"q":"En une phrase : que doit-on à 1984 pour le droit de grève des contrôleurs aériens ?","a":"Le droit de faire grève redevient une disposition légale : la loi de 1964 l'avait retiré, 2023-2025 vient le rendre à nouveau pleinement efficace.","f":"Histoire — La conquête du droit de grève (1980–1985)"},{"n":656,"q":"Qui a créé et écrit le statut ICNA ?","a":"Le SNCTA et ses adhérents.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":657,"q":"Qui était contre le statut ICNA à l'époque ?","a":"La CGT qui prédisait « la sortie de la Fonction publique assurée ».","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":658,"q":"Quelle peur agite souvent la CGT concernant les propositions du SNCTA ?","a":"Statut ICNA, rémunérations à la hausse, créations de Primes, expés RH dès 2015 : la CGT prédit à chaque fois la sortie de la Fonction Publique.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":659,"q":"Quel chantier suit la création du statut ICNA au début des années 1990 ?","a":"Sa consolidation par la rédaction et la négociation des textes d'application indispensables.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":660,"q":"Quand et comment les textes réglementaires sont-ils enfin mis à jour du nouveau statut ICNA ?","a":"Dans la foulée du Protocole 1991-1994, sous la vigilance du SNCTA.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":661,"q":"Quels dossiers accompagnent le protocole 1997-2000 ?","a":"RH, RVSM et 8.33, premières adaptations aux normes européennes.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":662,"q":"Quel but poursuivent les travaux sur le RVSM dès la fin des années 90 ?","a":"La réduction des espacements verticaux.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":663,"q":"Quelle grève précède le Protocole 1991-1994 ?","a":"La première grève nationale depuis 1987 — face à des négociations « très décevantes ».","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":664,"q":"Que garantit le Protocole 2000 aux contrôleurs ?","a":"Son avancement de carrière à vie.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":665,"q":"Que rapportent les protocoles des années 1990 en effectifs ?","a":"540 ICNA supplémentaires dès 1995, puis 270 entre 1998 et 2000.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":666,"q":"Quel principe de négociation s'installe définitivement dès les années 80 ?","a":"La logique protocolaire : « inventée il y a plus de 40 ans », et qui était alors « révolutionnaire comme façon de faire en France ».","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":667,"q":"Que célèbre-t-on fin des années 2000 ?","a":"Le 2000e ICNA diplômé de la nouvelle formation.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":668,"q":"Quel enchaînement mène au refus de signer le protocole de 2013 ?","a":"Démissions d'adhérents fin années 2000 suite à des problèmes de fond sur la stratégie MOSAIC, effondrement du SNCTA sous 50 % en CAP ICNA, puis un protocole « clairement anti-contrôleurs » en 2013 porté par la CGT.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":669,"q":"Quel qualificatif peut-on appliquer au Protocole 2013 ?","a":"« Clairement anti-contrôleurs », d'où le seul refus de signature protocolaire du SNCTA : pas de recrutement, fermetures de terrains, pas d'accompagnement social.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":670,"q":"Que garantissait déjà le contrat MNAM-ATC dès les années 2000 ?","a":"Une prime d'assurance privée en cas de perte d'aptitude médicale — « inventé grâce au SNCTA », avec son équivalent MGAS.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":671,"q":"Qu'apportent les « expés » du SNCTA dès 2015 ?","a":"Une organisation du travail adaptée à la fatigue (des journées passant de 11 h à 8 h 30 maximum) et le refus des vacations complémentaires.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":672,"q":"Quelle continuité relie expés et options (hors Option 2-bis qui concerne toutes les approches) ?","a":"2015 : Reims entre en XP ; 2026 : 5 CRNA, Roissy, Orly, ÉNAC, Nice, Marseille, Montpellier, Toulouse, Martinique, Guadeloupe, Tahiti, Ajaccio, Calvi, Figari.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":673,"q":"Quand est inauguré le nouveau CRNA d'Aix ?","a":"En 1999.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":674,"q":"Que percute la « loi Fillon » de 2003 ?","a":"Les négociations du Protocole 2003, qui s'éternisent sur fond de réforme des retraites.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":675,"q":"À quelle échéance le corps unique de contrôleurs sera totalement mis en œuvre ?","a":"Vers 2040 : il n'y aura plus que des contrôleurs aériens sous statut ICNA. Jusqu'à cette date et sous conditions, un TSEEAC contrôleur pourra faire le choix de poursuivre sa carrière de contrôleur sous ce statut.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":676,"q":"Qu'acte le Protocole 2023-2027 en matière de révolution statutaire ?","a":"Il acte la création du corps unique de contrôleurs sous statut ICNA.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":677,"q":"Quelle leçon des années 1990 pour aujourd'hui ?","a":"Un statut ne vaut que par ses textes d'application — d'où la vigilance actuelle sur chaque décret.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":678,"q":"Comment résumer des décennies de combats pour obtenir un droit de grève légal et efficace ?","a":"Arriver à la grève, c'est un échec des négociations dans le cadre de dialogue social classique. Mais elle peut être un moyen utile pour préparer l'avenir et rouvrir des discussions sur des sujets légitimes.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":679,"q":"Quelle crainte administrative bloquait déjà les primes-retraite en 1983 ?","a":"La contagion aux autres corps. C'est la même crainte qui freine chaque avancée statutaire et à laquelle le SNCTA trouve des mécanismes pour que le cadre de la Fonction publique ne les bloque pas.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":680,"q":"Comment l'ATC contourne-t-elle la crainte du politique de voir les primes des autres fonctionnaires intégrées à leur retraite ?","a":"En compensant hors pension le faible taux de remplacement par la création par le SNCTA d'une prime financée par les actifs et/ou par la loi.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":681,"q":"Quand le SNCTA passe-t-il sous les 50 % en CAP ICNA ?","a":"À la fin des années 2000 : l'électrochoc qui prépare le renouveau du syndicat apprenant de ses erreurs.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":682,"q":"Que redevient le SNCTA aux élections de 2018 ?","a":"Il repasse la barre des 50% aux élections et redevient majoritaire absolu chez les ICNA et 1er syndicat de la DSNA.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":683,"q":"Quelle décennie marque la consolidation de la navigation aérienne française après des décennies de dialogue social conflictuel ?","a":"Les années 1990 : statut ICNA, textes réglementaires, protocoles équilibrés, recrutements.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":684,"q":"Quel fil relie le statut des contrôleurs au HEB III ?","a":"Quarante ans de construction statutaire : du corps créé en 1964 aux échelons sommitaux de 2025.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":685,"q":"Que doit un jeune ICNA aux combats statutaires ?","a":"Son grade, sa rémunération, sa licence, son statut, sa retraite spécifique, et son poste via les combats sur les effectifs.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":686,"q":"Quel réflexe le SNCTA a-t-il gardé des décennies de conflits (des années 60 aux années 90) ?","a":"Négocier chaque texte d'application pour écrire son cadre d'application.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":687,"q":"Quelle promesse porte l'horizon 2040 ?","a":"Une profession enfin unifiée sous un seul statut, l'aboutissement du combat commencé en 1965.","f":"Histoire — Statut ICNA & années 1990-2000"},{"n":688,"q":"Quelle conséquence assument les représentants du SNCTA lors de leurs travaux ?","a":"Vivre au quotidien les conséquences de leurs actions pour la profession.","f":"Communication & renouveau (2018)"},{"n":689,"q":"Comment le SNCTA définit-il le syndicalisme professionnel ?","a":"La voix des contrôleurs et une force de contre-pouvoir indispensable.","f":"Communication & renouveau (2018)"},{"n":690,"q":"Que symbolise le monogramme du SNCTA : la combinaison du C et de la comète ?","a":"Un œil ouvert : celui du contrôleur qui veille sur le Ciel, et celui du SNCTA qui veille sur lui.","f":"Communication & renouveau (2018)"},{"n":691,"q":"Que symbolise le C plus imposant que les autres lettres du logo SNCTA ?","a":"« L'alpha et l'oméga de l'action du SNCTA est le contrôleur : tout part de lui, tout est pour lui ».","f":"Communication & renouveau (2018)"},{"n":692,"q":"Que crée le SNCTA côté promotion du métier ?","a":"Le label Contrôleur Aérien : site controleuraerien.fr et compte Instagram gérés par des bénévoles.","f":"Communication & renouveau (2018)"},{"n":693,"q":"Quelles présences médiatiques le SNCTA assume-t-il ?","a":"TV, radio, presse écrite nationale et internationale : actions souvent complexes pour défendre la profession attaquée.","f":"Communication & renouveau (2018)"},{"n":694,"q":"Quel triple traumatisme motivait ce retour aux sources : défendre les contrôleurs, les écouter, les aider ?","a":"Les démissions de la fin des années 2000, l'effondrement sous 50 % en CAP ICNA, le protocole 2013. Le SNCTA a appris de ses erreurs.","f":"Communication & renouveau (2018)"},{"n":695,"q":"Comment le SNCTA s'adresse-t-il aux contrôleurs ?","a":"Des revendications courtes, un parler concret et quotidien. Le SNCTA annonce faire ce qu'il dit et dire ce qu'il fait.","f":"Communication & renouveau (2018)"},{"n":696,"q":"Quel politique rythme le SNCTA sur tout sujet ?","a":"Quand on s'oppose, c'est forcément argumenté. Il n'y a jamais de refus de principe, c'est dans notre politique : « pas a priori contre ».","f":"Communication & renouveau (2018)"},{"n":697,"q":"Quelle ambition affiche le SNCTA pour la profession ?","a":"« Prouver la valeur des contrôleurs » auprès de tous les interlocuteurs : des passionnés, professionnels, attachés à rendre un service public du mieux qu'ils le peuvent, avec les outils à leur disposition.","f":"Communication & renouveau (2018)"},{"n":698,"q":"Que souhaite le SNCTA pour chaque contrôleur dans ses missions ?","a":"« Que tous soient fiers d'exercer ce métier ».","f":"Communication & renouveau (2018)"},{"n":699,"q":"Quel argument sur l'administration implique le travail du SNCTA dans tous les domaines au quotidien ?","a":"« Si nous ne sommes pas tout le temps derrière son dos, elle choisit ce qui l'arrange ».","f":"Communication & renouveau (2018)"},{"n":700,"q":"Quelle définition des instances légitime de donner confiance à ses représentants SNCTA ?","a":"CSA, FS, action sociale, GT : « énormément de sujets d'importance sur ta vie quotidienne se décident avec tes représentants ».","f":"Communication & renouveau (2018)"},{"n":701,"q":"Que gèrent les bénévoles du SNCTA du label Contrôleur Aérien, sans prosélytisme ?","a":"Le site controleuraerien.fr et le compte Instagram @controleuraerien.","f":"Communication & renouveau (2018)"},{"n":702,"q":"Quelle phrase peut illustrer la motivation des adhérents SNCTA à s'investir bénévolement ?","a":"« On préfère préparer le changement que le subir ».","f":"Communication & renouveau (2018)"},{"n":703,"q":"Quelle « ère » technique a permis à la France de rayonner en matière d'outils des contrôleurs aériens ?","a":"L'ère du CAUTRA : le système français historique de traitement du trafic, était une référence mondiale dans les années 80-90.","f":"Technique & modernisation"},{"n":704,"q":"Quel programme succède au CAUTRA ?","a":"Le couple Coflight – 4-Flight.","f":"Technique & modernisation"},{"n":705,"q":"À combien chiffre-t-il le programme 4F-Coflight ?","a":"« La somme vertigineuse de 1,2 milliard d'euros ».","f":"Technique & modernisation"},{"n":706,"q":"Quelle instance s'est demandé s'il fallait poursuivre 4-Flight fin des années 2010 ?","a":"Le CGEDD : Conseil général de l'environnement et du développement durable.","f":"Technique & modernisation"},{"n":707,"q":"Quel accord industriel encadre le « groupe 1 » fin 2017 ?","a":"L'accord-cadre DSNA – consortium Saab-CS, après une passation de marché rocambolesque.","f":"Technique & modernisation"},{"n":708,"q":"Comment 4-Flight arrive-t-il enfin à Reims ?","a":"À la suite d'une motion d'assemblée générale : les contrôleurs rémois acteurs de leur modernisation.","f":"Technique & modernisation"},{"n":709,"q":"Qu'obtient le SNCTA pour accompagner la transfo 4-Flight à Reims ?","a":"Un accord spécifique rémois d'organisation du travail.","f":"Technique & modernisation"},{"n":710,"q":"Quand 4-Flight est-il inauguré à Reims, centre pionnier du programme ?","a":"En décembre 2022.","f":"Technique & modernisation"},{"n":711,"q":"Quelle condition d'accompagnement en salle de Reims le SNCTA a-t-il posée pour préserver la sécurité lors de la MESO 4-Flight ?","a":"L'assistance des équipes 4-Flight en salle, des capa adaptées, sans pression sur les contrôleurs : la sécurité prévaut.","f":"Technique & modernisation"},{"n":712,"q":"À quoi sert l'alliance SNCTA-SNIESSA-SNPL en CSA Ministériel aux élections 2026 ?","a":"À donner voix aux opérationnels au plus haut niveau, sans rompre l'autonomie de chacun des syndicats qui avancent pour un syndicalisme professionnel.","f":"Technique & modernisation"},{"n":713,"q":"Que devra faire la DSNA face à l'alliance SNCTA-SNIESSA-SNPL en CSA Ministériel aux élections 2026 ?","a":"Remettre l'opérationnel au cœur d'une vision partagée — ne plus subir les choix politiques et industriels.","f":"Technique & modernisation"},{"n":714,"q":"Quel équipement des contrôleurs aériens apparu en 1968 manquait cruellement auparavant ?","a":"La couverture radar — « très insuffisante » selon la brochure fondatrice.","f":"Technique & modernisation"},{"n":715,"q":"Que montre l'inauguration de 4-Flight à Reims en décembre 2022 ?","a":"Qu'une modernisation réussie est possible — quand elle est accompagnée et portée par les contrôleurs.","f":"Technique & modernisation"},{"n":716,"q":"Quelles applications mobiles le SNCTA propose-t-il pour suivre toute l'actualité nationale ou locale et pour contacter ses cellules ?","a":"L'appli SNCTA sur iOS et Android — référencée en tête du site.","f":"Le SNCTA au quotidien (site & services)"},{"n":717,"q":"Les statuts et la politique du SNCTA sont-ils publics ?","a":"Oui, on retrouve tout sur le site du SNCTA : rien n'est caché, tout est public et transparent. sncta.fr -> politique -> voir les statuts et la politique du SNCTA.","f":"Le SNCTA au quotidien (site & services)"},{"n":718,"q":"Que regroupe la rubrique « Progrès Social » sur le site sncta.fr ?","a":"Le livre « L'Aventure du Contrôle Aérien » et sa mise en lumière des moments clés dans des tracts : « Créateur de Progrès Social depuis 1965 ».","f":"Le SNCTA au quotidien (site & services)"},{"n":719,"q":"Comment saisir Mayday en ligne ?","a":"Le formulaire sncta.fr/forms/mayday — bouton d'accès direct sur le site.","f":"Le SNCTA au quotidien (site & services)"},{"n":720,"q":"Où se procurer le livre « L'Aventure du Contrôle Aérien » si je ne suis pas adhérent (il est offert aux adhérents du SNCTA) ?","a":"Sur le site internet sncta.fr","f":"Le SNCTA au quotidien (site & services)"},{"n":721,"q":"Quelle plateforme dédiée gère la mobilité au SNCTA pour les contrôleurs : AVE, fiches de postes, classement de ses vœux, réponses ?","a":"mobilite.sncta.fr","f":"Le SNCTA au quotidien (site & services)"},{"n":722,"q":"Que publie l'Espace Mobilité du SNCTA pour chaque campagne ?","a":"Dates d'ouverture et de clôture, résultats, communiqués et fiches de poste.","f":"Le SNCTA au quotidien (site & services)"},{"n":723,"q":"Que propose l'Espace mobilité au-delà de l'information ?","a":"Conseil et accompagnement personnalisé — « je contacte le SNCTA » pour être représenté.","f":"Le SNCTA au quotidien (site & services)"},{"n":724,"q":"Quel réflexe dois-je avoir avant une CAP d'avancement ?","a":"Contacter ASAP via le site pour un mandat et conseil personnalisé.","f":"Le SNCTA au quotidien (site & services)"},{"n":725,"q":"Quel réflexe dois-je avoir avant une campagne AVE ?","a":"Vérifier les dates sur mobilite.sncta.fr et se faire accompagner.","f":"Le SNCTA au quotidien (site & services)"},{"n":726,"q":"Quel réflexe dois-je avoir après un é /* ===== validation des prénoms ===== */
function stripAcc(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
const NAME_RE = /^[\p{L}]+(?:[-'’][\p{L}]+){0,2}$/u;
const BLOCK_EXACT = ["fo","cgt","pd","fdp","ntm","con","cul","zob","usac","fsu","sud"];
const BLOCK_SUB = ["sncta","unsa","cfdt","cgt","snna","spac","usac","connard","connasse","encul","salop","salaud","batard","pute","putain","merd","niqu","facho","nazi","hitler","bite","couill","chatte","enfoir","ordure","crevur","bouffon","abruti","debile"];
function validateName(raw){
  const s = raw.trim();
  if(s.length<2 || s.length>20) return {ok:false,msg:"Prénom : 2 à 20 caractères."};
  if(!NAME_RE.test(s)) return {ok:false,msg:"Prénom uniquement — lettres, tiret ou apostrophe."};
  const n = stripAcc(s.toLowerCase()).replace(/[-'’]/g,"");
  if(!/[aeiouy]/.test(n)) return {ok:false,msg:"Ce prénom ne semble pas valide."};
  if(BLOCK_EXACT.includes(n) || BLOCK_SUB.some(b=>n.includes(b)))
    return {ok:false,msg:"Ce prénom n'est pas accepté ici 😉"};
  return {ok:true,msg:""};
}

/* ===== centres ===== */
function centreLabel(c){ return c.name ? c.code+" — "+c.name : c.code; }
function resolveCentre(txt){
  const t = txt.trim().toUpperCase();
  if(!t) return null;
  let hit = CENTRES.find(c=>c.code===t);
  if(hit) return hit;
  hit = CENTRES.find(c=>centreLabel(c).toUpperCase()===t);
  if(hit) return hit;
  const byName = CENTRES.filter(c=>c.name && c.name.toUpperCase()===t.replace(/^.*—/,"").trim());
  return byName.length===1 ? byName[0] : null;
}

/* ===== aléatoire déterministe (défis de groupe : mêmes cartes pour tous) ===== */
function hashStr(s){let h=1779033703;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function seededShuffle(arr,seed){const r=mulberry32(seed);const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const lb = { view:"all", centre:"", len:0, cache:null };
async function renderLeaderboard(refresh=true){
  startBar.classList.add("hidden");
  state.playing=false; if(state.timerId) clearInterval(state.timerId);
  main.innerHTML = `<div class="lb-wrap">
    <div class="hud"><button class="back" id="backBtn">Retour</button><div class="prog">Classement</div><div></div></div>
    <div class="lb-loading">Chargement des scores…</div></div>`;
  document.getElementById("backBtn").addEventListener("click",renderSetup);
  if(refresh || !lb.cache) lb.cache = await loadResults();
  drawLeaderboard();
}
function drawLeaderboard(){
  const all = lb.cache || [];
  const centres = [...new Set(all.map(r=>r.centre))].sort();
  let rows = [...all];
  if(lb.view==="today"){ const t=todayKey(); rows = rows.filter(r=>todayKey(r.date)===t); }
  if(lb.view==="centre" && lb.centre){ rows = rows.filter(r=>r.centre===lb.centre); }
  if(lb.view==="grp" && state.grp){ rows = rows.filter(r=>r.grp===state.grp.code); }
  if(GAME==="kahoot" && lb.len){ rows = rows.filter(r=>r.total===lb.len); }
  rows.sort((a,b)=>b.score-a.score || (a.date<b.date?-1:1));
  rows = rows.slice(0,100);
  const tabs = `
    <div class="lb-tabs">
      ${state.grp?`<button class="lb-tab${lb.view==="grp"?" sel":""}" data-v="grp">👥 ${esc(state.grp.name)}</button>`:""}
      <button class="lb-tab${lb.view==="all"?" sel":""}" data-v="all">Tous les résultats</button>
      <button class="lb-tab${lb.view==="today"?" sel":""}" data-v="today">Aujourd'hui</button>
      <button class="lb-tab${lb.view==="centre"?" sel":""}" data-v="centre">Par centre</button>
    </div>`;
  const centreFilter = lb.view==="centre" ? `
    <div class="lb-filters">${centres.length? centres.map(c=>
      `<button class="fam${lb.centre===c?" sel":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")
      : '<span class="lb-meta">Aucun centre enregistré pour le moment.</span>'}</div>` : "";
  const lenFilter = GAME==="kahoot" ? `
    <div class="lb-filters">
      ${[0,10,25,50,100].map(n=>`<button class="fam${lb.len===n?" sel":""}" data-len="${n}">${n===0?"Toutes longueurs":n+" q."}</button>`).join("")}
    </div>` : "";
  const list = rows.length ? rows.map((r,i)=>{
    const cls = i===0?"gold":i===1?"silver":i===2?"bronze":"";
    const me = r.id && r.id===state.lastSavedId ? " me":"";
    const d = new Date(r.date);
    const when = d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    const scoreTxt = GAME==="kahoot" ? r.score : r.score+"/"+r.total;
    return `<div class="lb-row${me}">
      <div class="lb-rank ${cls}">${i<3?["🥇","🥈","🥉"][i]:i+1}</div>
      <div class="lb-who"><div class="lb-name">${esc(r.name)}</div>
        <div class="lb-meta">${GAME==="kahoot"?r.good+"/"+r.total+" bonnes · ":""}${when}</div></div>
      <div class="lb-centre">${esc(r.centre)}</div>
      <div class="lb-score">${scoreTxt}</div>
    </div>`;
  }).join("") : `<div class="lb-empty">Aucun score ici pour l'instant.<br>Lance une partie et ouvre le bal !</div>`;
  main.innerHTML = `<div class="lb-wrap">
    <div class="hud">
      <button class="back" id="backBtn">Retour</button>
      <div class="prog">Classement</div>
      <button class="back" id="reloadBtn">↻ Actualiser</button>
    </div>
    ${tabs}${centreFilter}${lenFilter}
    <div class="lb-list">${list}</div>
    <div class="lb-note">${API_OK?(GAME==="kahoot"?"Scores partagés entre tous les joueurs. Filtre par longueur pour comparer à armes égales.":"Seules les parties en mode Défi 10 cartes sont classées — la révision libre reste un entraînement."):"⚠️ Serveur injoignable — le classement n'a pas pu être chargé."}</div>
  </div>`;
  document.getElementById("backBtn").addEventListener("click",renderSetup);
  document.getElementById("reloadBtn").addEventListener("click",()=>renderLeaderboard(true));
  main.querySelectorAll(".lb-tab").forEach(b=>b.addEventListener("click",()=>{
    lb.view=b.dataset.v;
    if(lb.view==="centre" && !lb.centre){
      const cs=[...new Set((lb.cache||[]).map(r=>r.centre))].sort();
      lb.centre = cs.includes(state.centre)?state.centre:(cs[0]||"");
    }
    drawLeaderboard();
  }));
  main.querySelectorAll(".lb-filters .fam[data-c]").forEach(b=>b.addEventListener("click",()=>{lb.centre=b.dataset.c;drawLeaderboard();}));
  main.querySelectorAll(".lb-filters .fam[data-len]").forEach(b=>b.addEventListener("click",()=>{lb.len=+b.dataset.len;drawLeaderboard();}));
  window.scrollTo(0,0);
}
