let bank=[],centers=[],cfg={count:40};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function load(){
 try{bank=JSON.parse(localStorage.getItem("sncta_bank"))||DEFAULT_BANK}catch(e){bank=DEFAULT_BANK}
 try{centers=JSON.parse(localStorage.getItem("sncta_centers"))||DEFAULT_CENTERS}catch(e){centers=DEFAULT_CENTERS}
 try{cfg=JSON.parse(localStorage.getItem("sncta_cfg"))||{count:40}}catch(e){cfg={count:40}}
}
function save(){localStorage.setItem("sncta_bank",JSON.stringify(bank));localStorage.setItem("sncta_centers",JSON.stringify(centers));localStorage.setItem("sncta_cfg",JSON.stringify(cfg))}
function render(x){document.getElementById("app").innerHTML=x;scrollTo(0,0)}
function home(){
 load();let active=bank.filter(q=>q.active!==false).length;
 render(`<div class="card"><img class="logo" src="${LOGO}"><span class="badge">VERSION MOBILE — TEST</span>
 <h1 style="margin-top:10px">Grand Quiz SNCTA</h1><p class="muted">Banque active : ${active} questions. Nombre actuel du quiz : ${cfg.count}.</p>
 <label>Pseudo</label><input id="nick" maxlength="30" placeholder="Ex. Simon">
 <label>Région <span class="muted">(facultatif)</span></label><select id="region"><option value="">Je ne souhaite pas répondre</option><option>Bretagne</option><option>Île-de-France</option><option>Grand Est</option><option>Provence-Alpes-Côte d’Azur</option><option>Nouvelle-Aquitaine</option></select>
 <label>Centre <span class="muted">(facultatif)</span></label><select id="center"><option value="">Je ne souhaite pas répondre</option>${centers.filter(c=>c.active!==false).map(c=>`<option>${esc(c.name)}</option>`).join("")}</select>
 <button onclick="start()">Commencer</button><button class="secondary" onclick="admin()">⚙️ Espace admin</button></div>`)
}
function start(){
 load();let nick=document.getElementById("nick").value.trim();if(!nick){alert("Choisis un pseudo.");return}
 let a=bank.filter(q=>q.active!==false);let n=Number(cfg.count)||1;if(n>a.length){alert("Le nombre de questions demandé dépasse le maximum de "+a.length+".");return}
 let qs=[...a].sort(()=>Math.random()-.5).slice(0,n);state={qs,i:0,score:0,sel:null,profile:{nick,region:document.getElementById("region").value,center:document.getElementById("center").value}};question()
}
let state={};
function question(){
 let q=state.qs[state.i];state.sel=null;
 render(`<div class="card"><div class="top"><span>Question ${state.i+1} / ${state.qs.length}</span><span>${state.score} pt${state.score>1?"s":""}</span></div>
 <div class="progress"><div class="bar" style="width:${state.i/state.qs.length*100}%"></div></div><h2>${esc(q.question)}</h2>
 ${q.options.map((o,j)=>`<button class="option" onclick="choose(${j},this)">${String.fromCharCode(65+j)}. ${esc(o.label)}</button>`).join("")}
 <button id="next" class="secondary hidden" onclick="next()">Valider</button></div>`)
}
function choose(j,e){document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));e.classList.add("selected");state.sel=j;document.getElementById("next").classList.remove("hidden")}
function next(){if(state.sel===null)return;let q=state.qs[state.i];if(q.options[state.sel].value===q.correct)state.score++;state.i++;state.i<state.qs.length?question():result()}
function result(){
 let pct=Math.round(state.score/state.qs.length*100);
 render(`<div class="card"><span class="badge">QUIZ TERMINÉ</span><h1 style="margin-top:10px">Bravo ${esc(state.profile.nick)} !</h1>
 <div class="grid"><div class="stat"><div class="muted">Score</div><div class="big">${state.score}/${state.qs.length}</div><b>${pct} % de bonnes réponses</b></div>
 <div class="stat"><div class="muted">Classement national</div><div class="big">27e</div></div>
 <div class="stat"><div class="muted">Classement région</div><div class="big">${state.profile.region?"4e":"—"}</div></div>
 <div class="stat"><div class="muted">Classement centre</div><div class="big">${state.profile.center?"2e":"—"}</div></div></div>
 <h2>Classement des régions</h2><table><tr><th>#</th><th>Région</th><th>%</th></tr><tr><td>1</td><td>Ouest</td><td>87,4</td></tr><tr><td>2</td><td>Sud-Ouest</td><td>85,9</td></tr><tr><td>3</td><td>Sud-Est</td><td>84,7</td></tr></table>
 <h2>Classement des centres</h2><table><tr><th>#</th><th>Centre</th><th>%</th></tr><tr><td>1</td><td>Brest</td><td>91,2</td></tr><tr><td>2</td><td>Bordeaux</td><td>89,6</td></tr><tr><td>3</td><td>Aix-en-Provence</td><td>87,8</td></tr></table>
 <button onclick="home()">Rejouer</button></div>`)
}
function admin(){load();renderAdmin()}
function renderAdmin(){
 let active=bank.filter(q=>q.active!==false).length;
 render(`<div class="card"><span class="badge">ADMIN — TEST</span><h1>Administration</h1>
 <label>Nombre de questions du quiz</label><input id="count" type="number" min="1" step="1" value="${cfg.count}">
 <p class="muted">Maximum actuel : <b>${active}</b> question${active>1?"s":""} actives. Le nombre saisi ne pourra pas dépasser ce maximum.</p>
 <button onclick="saveCount()">Enregistrer</button><button class="secondary" onclick="home()">Retour au quiz</button></div>
 <div class="card"><h2>Banque de questions</h2><p class="muted">${bank.length} au total — ${active} actives.</p><button onclick="editQ(-1)">➕ Ajouter une question</button><div id="qlist">${bank.map((q,i)=>qCard(q,i)).join("")}</div></div>
 <div class="card"><h2>Centres</h2><p class="muted">Base actuelle : 5 CRNA. Ajout, retrait et modification disponibles.</p><button onclick="editC(-1)">➕ Ajouter un centre</button><div id="clist">${centers.map((c,i)=>cCard(c,i)).join("")}</div></div>`)
}
function saveCount(){let active=bank.filter(q=>q.active!==false).length,n=Math.floor(Number(document.getElementById("count").value));if(!n||n<1){alert("Entre un nombre entier supérieur à 0.");return}if(n>active){alert("Le maximum actuel est "+active+".");return}cfg.count=n;save();alert("Nombre enregistré : "+n);renderAdmin()}
function qCard(q,i){return `<div class="q ${q.active===false?"off":""}"><b>#${i+1}</b> — ${esc(q.question)}<br><span class="muted">Bonne réponse : ${esc((q.options.find(o=>o.value===q.correct)||{}).label||"—")}</span><br><button onclick="editQ(${i})">Modifier</button><button class="secondary" onclick="toggleQ(${i})">${q.active===false?"Réactiver":"Désactiver"}</button><button class="danger" onclick="delQ(${i})">Supprimer</button></div>`}
function editQ(i){let q=i>=0?bank[i]:{question:"",options:[{label:"",value:"A"},{label:"",value:"B"},{label:"",value:"C"},{label:"",value:"D"}],correct:"A",active:true};render(`<div class="card"><h1>${i<0?"Ajouter":"Modifier"} une question</h1><label>Question</label><textarea id="qq" rows="3">${esc(q.question)}</textarea>${q.options.map((o,j)=>`<label>Réponse ${String.fromCharCode(65+j)}</label><input id="o${j}" value="${esc(o.label)}">`).join("")}<label>Bonne réponse</label><select id="corr">${q.options.map((o,j)=>`<option value="${o.value}" ${o.value===q.correct?"selected":""}>${String.fromCharCode(65+j)}</option>`).join("")}</select><button onclick="saveQ(${i})">Enregistrer</button><button class="secondary" onclick="renderAdmin()">Annuler</button></div>`)}
function saveQ(i){let question=document.getElementById("qq").value.trim(),options=[0,1,2,3].map(j=>({label:document.getElementById("o"+j).value.trim(),value:String.fromCharCode(65+j)}));if(!question||options.some(o=>!o.label)){alert("Renseigne la question et les 4 réponses.");return}let q={question,options,correct:document.getElementById("corr").value,active:true};i<0?bank.push(q):bank[i]=q;save();renderAdmin()}
function toggleQ(i){bank[i].active=bank[i].active===false;save();renderAdmin()}
function delQ(i){if(confirm("Supprimer définitivement cette question ?")){bank.splice(i,1);save();renderAdmin()}}
function cCard(c,i){return `<div class="q ${c.active===false?"off":""}"><b>${esc(c.name)}</b><br><span class="muted">${esc(c.dept||"")} — ${esc(c.region||"")}</span><br><button onclick="editC(${i})">Modifier</button><button class="secondary" onclick="toggleC(${i})">${c.active===false?"Réactiver":"Désactiver"}</button><button class="danger" onclick="delC(${i})">Supprimer</button></div>`}
function editC(i){let c=i>=0?centers[i]:{name:"",type:"Centre",dept:"",region:"",active:true};render(`<div class="card"><h1>${i<0?"Ajouter":"Modifier"} un centre</h1><label>Nom</label><input id="cn" value="${esc(c.name)}"><label>Type</label><input id="ct" value="${esc(c.type)}"><label>Département</label><input id="cd" value="${esc(c.dept)}"><label>Région</label><input id="cr" value="${esc(c.region)}"><button onclick="saveC(${i})">Enregistrer</button><button class="secondary" onclick="renderAdmin()">Annuler</button></div>`)}
function saveC(i){let c={name:document.getElementById("cn").value.trim(),type:document.getElementById("ct").value.trim()||"Centre",dept:document.getElementById("cd").value.trim(),region:document.getElementById("cr").value.trim(),active:true};if(!c.name){alert("Le nom est obligatoire.");return}i<0?centers.push(c):centers[i]=c;save();renderAdmin()}
function toggleC(i){centers[i].active=centers[i].active===false;save();renderAdmin()}
function delC(i){if(confirm("Supprimer ce centre ?")){centers.splice(i,1);save();renderAdmin()}}
load();home();
</script></body></html>
