<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Les Incollables du Contrôle Aérien — SNCTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Si le SNCTA dispose d'une licence Adobe Fonts pour Houschka Rounded,
     coller ici la ligne du kit, ex. :
     <link rel="stylesheet" href="https://use.typekit.net/XXXXXXX.css">
     Sinon, Quicksand/Nunito (arrondies, libres) servent de repli. -->
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#002a73;
  --navy2:#003a9c;
  --panel:#0043b4;
  --line:#2e64cf;
  --amber:#70ffd6;
  --amber-dk:#0d9a78;
  --ink:#f2f6fa;
  --muted:#9db8e8;
  --ok:#70ffd6;
  --ko:#e85d5d;
  --strip:#f4f7fd;
  --strip-ink:#12233f;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Houschka Rounded','houschka-rounded','Nunito',sans-serif;
  background:
    radial-gradient(1200px 600px at 50% -200px, #1a5ad0 0%, transparent 60%),
    var(--navy);
  color:var(--ink);
  min-height:100dvh;
  display:flex;flex-direction:column;
}
/* scan sweep background */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;
  background:repeating-linear-gradient(0deg,transparent 0 3px,#8fd9ff 3px 4px);
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

header{
  padding:18px 16px 12px;text-align:center;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(0,58,156,.92),rgba(0,58,156,.45));
}
.brand{
  font-family:'Houschka Rounded','houschka-rounded','Quicksand','Nunito',sans-serif;font-weight:800;letter-spacing:.06em;
  font-size:clamp(26px,7vw,40px);line-height:.95;text-transform:uppercase;
}
.brand em{font-style:normal;color:var(--amber)}
.tagline{margin-top:6px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.tagline b{color:var(--amber);font-weight:600}

main{flex:1;width:100%;max-width:680px;margin:0 auto;padding:16px 14px 90px}

/* ---------- setup screen ---------- */
.section-label{
  font-family:'Houschka Rounded','houschka-rounded','Quicksand','Nunito',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.14em;font-size:13px;color:var(--amber);
  display:flex;align-items:center;gap:10px;margin:18px 0 10px;
}
.section-label::after{content:"";flex:1;height:1px;background:var(--line)}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-btn{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px 12px;color:var(--ink);cursor:pointer;text-align:left;
  transition:border-color .15s, transform .1s;
}
.mode-btn:active{transform:scale(.98)}
.mode-btn.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.mode-btn h3{font-family:'Houschka Rounded','houschka-rounded','Quicksand','Nunito',sans-serif;font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.mode-btn p{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}

.fam-tools{display:flex;gap:8px;margin-bottom:10px}
.chip-action{
  font-size:12px;font-weight:600;color:var(--muted);background:none;
  border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;
}
.chip-action:active{color:var(--ink)}
.fams{display:flex;flex-wrap:wrap;gap:7px}
.fam{
  border:1px solid var(--line);background:var(--navy2);color:var(--muted);
  border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:500;
  cursor:pointer;transition:all .12s;line-height:1.2;
}
.fam.sel{background:var(--amber);border-color:var(--amber);color:#00331f;font-weight:700}
.fam .count{opacity:.6;font-size:11px}

.start-bar{
  position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,var(--navy) 40%);
  display:flex;justify-content:center;
}
.btn-primary{
  width:100%;max-width:652px;
  font-family:'Houschka Rounded','houschka-rounded','Quicksand','Nunito',sans-serif;font-weight:800;font-size:22px;letter-spacing:.08em;
  text-transform:uppercase;color:#00331f;background:var(--amber);
  border:none;border-radius:10px;padding:14px;cursor:pointer;
  box-shadow:0 4px 20px rgba(112,255,214,.3);
  transition:transform .1s;
}
.btn-primary:active{transform:scale(.985)}
.btn-primary:disabled{background:#28479a;color:#7d97cd;box-shadow:none}

/* ---------- game screen ---------- */
.hud{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:14px;font-family:'Houschka Rounded','houschka-rounded','Quicksand','Nunito',sans-serif;
}
.hud .back{
  background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;
  padding:6px 12px;font-family:'Houschka Rounded','houschka-rounded','Quicksand','Nunito',sans-serif;font-weight:600;font-size:15px;
  letter-spacing:.05em;cursor:pointer;text-transform:uppercase;
}
.hud .prog{font-weight:600;font-size:16px;letter-spacing:.06em;color:var(--muted)}
.hud .score{font-weight:800;font-size:18px;letter-spacing:.04em}
.hud .score .ok{color:var(--ok)} .hud .score .ko{color:var(--ko)}

/* the flight-strip card */
.strip{
  background:var(--strip);color:var(--strip-ink);border-radius:6px;
  display:grid;grid-template-columns:64px 1fr;overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.15) inset;
  animation:dealIn .28s ease-out;
  position:relative;
}
@keyframes dealIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.strip::before{ /* perforation edge */
  content:"";position:absolute;left:64px;top:0;bottom:0;width:0;
  border-left:2px dashed rgba(18,35,63,.25);
}
.strip .numbox{
  background:#dfe7f6;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:10px 4px;
}
.strip .numbox .n{font-family:'Houschka Rounded','houschka-rounded','Quicksand','Nunito',sans-serif;font-weight:800;font-size:26px;line-height:1}
.strip .numbox .lbl{font-size:9px;letter-spacing:.12em;color:#5a6d94;text-transform:uppercase}
.strip .body{padding:14px 16px 16px;min-height:150px;display:flex;flex-direction:column}
.strip .famtag{
  font-family:'Houschka Rounded','houschka-rounded','Quicksand','Nunito',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--amber-dk);margin-bottom:8px;
}
.strip .q{font-size:17.5px;font-weight:600;line-height:1.35}
.strip .a{
  margin-top:12px;padding-top:12px;border-top:1px solid rgba(18,35,63,.15);
  font-size:16px;line-height:1.45;animation:fadeUp .25s ease-out;
}
.strip .a .a-label{
  font-family:'Houschka Rounded','houschka-rounded','Quicksand','Nunito',sans-serif;font-weight:700;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--amber-dk);display:block;margin-bottom:4px;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.controls{margin-top:16px;display:grid;gap:10px}
.controls.two{grid-template-columns:1fr 1fr}
.btn{
  font-family:'Houschka Rounded','houschka-rounded','Quicksand','Nunito',sans-serif;font-weight:700;font-size:19px;letter-spacing:.06em;
  text-transform:uppercase;border-radius:10px;padding:13px;cursor:pointer;border:none;
  transition:transform .1s;
}
.btn:active{transform:scale(.98)}
.btn.reveal{background:var(--panel);border:1px solid var(--amber);color:var(--amber)}
.btn.ok{background:rgba(112,255,214,.14);border:1px solid var(--ok);color:var(--ok)}
.btn.ko{background:rgba(232,93,93,.12);border:1px solid var(--ko);color:var(--ko)}
.btn.vf{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:21px}
.btn.vf:active{border-color:var(--amber)}
.btn.next{background:var(--amber);color:#241a04}

.verdict{
  margin-top:14px;text-align:center;font-family:'Houschka Rounded','houschka-rounded','Quicksand','Nunito',sans-serif;font-weight:800;
  font-size:22px;letter-spacing:.06em;text-transform:uppercase;animation:fadeUp .2s;
}
.verdict.good{color:var(--ok)} .verdict.bad{color:var(--ko)}

/* ---------- end screen ---------- */
.endcard{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:26px 20px;text-align:center;animation:dealIn .3s;
}
.endcard .big{
  font-family:'Houschka Rounded','houschka-rounded','Quicksand','Nunito',sans-serif;font-weight:800;font-size:64px;line-height:1;color:var(--amber);
}
.endcard .of{font-family:'Houschka Rounded','houschka-rounded','Quicksand','Nunito',sans-serif;font-size:20px;color:var(--muted);letter-spacing:.08em}
.endcard .msg{margin:14px 0 4px;font-size:16px;line-height:1.45}
.endcard .sub{font-size:12.5px;color:var(--muted)}
.end-actions{margin-top:18px;display:grid;gap:10px}

footer{
  text-align:center;padding:14px 16px 18px;
}
.footer-logo{width:min(200px,55%);height:auto;opacity:.9}

:root{--acc:var(--amber)}
/* profil joueur */
.player-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:4px}
.field{margin-bottom:12px}
.field label{display:block;font-family:'Houschka Rounded','houschka-rounded','Quicksand','Nunito',sans-serif;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-bottom:5px}
.field input{width:100%;background:var(--navy2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:inherit;font-weight:600;font-size:16px;padding:10px 12px;outline:none}
.field input:focus{border-color:var(--amber)}
.field input::placeholder{color:#5f7ab8;font-weight:400}
.centre-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.centre-chips .fam{padding:4px 10px;font-size:11.5px}
.centre-hint{font-size:12px;margin-top:5px;min-height:15px;font-weight:700}
.centre-hint.ok{color:var(--amber)}
.centre-hint.ko{color:#ffd370}
.privacy-note{font-size:11px;color:var(--muted);line-height:1.4;margin-top:2px}
/* classement */
.lb-wrap{max-width:720px;margin:0 auto}
.lb-tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.lb-tab{border:1px solid var(--line);background:var(--navy2);color:var(--muted);border-radius:99px;padding:7px 14px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
.lb-tab.sel{background:var(--amber);border-color:var(--amber);color:#00331f}
.lb-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.lb-list{display:grid;gap:7px}
.lb-row{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 13px;animation:dealIn .2s}
.lb-row.me{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.lb-rank{flex:0 0 36px;text-align:center;font-family:'Houschka Rounded','houschka-rounded','Quicksand',sans-serif;font-weight:800;font-size:17px;color:var(--muted)}
.lb-rank.gold{color:#ffd370}.lb-rank.silver{color:#cfd8e6}.lb-rank.bronze{color:#e0a06a}
.lb-who{flex:1;min-width:0}
.lb-name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-meta{font-size:11.5px;color:var(--muted)}
.lb-centre{font-family:'Houschka Rounded','houschka-rounded','Quicksand',sans-serif;font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--amber);background:rgba(112,255,214,.1);border:1px solid rgba(112,255,214,.3);border-radius:6px;padding:2px 8px}
.lb-score{font-family:'Houschka Rounded','houschka-rounded','Quicksand',sans-serif;font-weight:800;font-size:18px;color:var(--amber);min-width:56px;text-align:right}
.lb-empty{text-align:center;color:var(--muted);font-size:14px;padding:26px 10px;line-height:1.5;background:var(--panel);border:1px dashed var(--line);border-radius:10px}
.lb-note{font-size:11px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.4}
.lb-loading{text-align:center;color:var(--muted);padding:24px;font-weight:700}
.fairplay{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}

/* ---------- défi entre amis / partage ---------- */
.defi-banner{
  display:flex;align-items:center;gap:10px;margin-bottom:12px;
  background:rgba(255,211,112,.08);border:1px solid #ffd370;border-radius:10px;
  padding:10px 13px;font-size:13.5px;line-height:1.35;
}
.defi-banner .ico{font-size:20px}
.defi-banner b{color:#ffd370}
.share-card{
  background:var(--panel);border:1px solid var(--acc);border-radius:12px;
  padding:22px 18px;text-align:center;animation:dealIn .25s;
}
.share-card .sc-title{
  font-family:'Houschka Rounded','houschka-rounded','Quicksand','Nunito',sans-serif;
  font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.06em;
}
.share-card .sc-sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.code-big{
  font-family:'Houschka Rounded','houschka-rounded','Quicksand',sans-serif;
  font-weight:800;font-size:40px;letter-spacing:.28em;color:var(--acc);
  margin:14px 0 4px;text-indent:.28em;
}
.share-btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.share-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line);background:var(--navy2);color:var(--ink);
  border-radius:10px;padding:12px 8px;font-family:inherit;font-weight:700;font-size:14px;
  cursor:pointer;transition:transform .1s;
}
.share-btn:active{transform:scale(.97)}
.share-btn .si{font-size:17px}
.share-btn.full{grid-column:1/-1}
.copy-ok{color:var(--acc)}
@media (hover:hover){ .share-btn:hover{border-color:var(--acc)} }
@media (min-width:900px){
  .share-card{max-width:520px;margin:20px auto 0;padding:28px 26px}
  .share-btns{grid-template-columns:repeat(4,1fr)}
  .share-btn.full{grid-column:auto}
}


/* ---------- desktop ---------- */
@media (hover:hover){
  .mode-btn:hover{border-color:var(--amber)}
  .fam:hover{border-color:var(--amber);color:var(--ink)}
  .fam.sel:hover{color:#00331f}
  .btn:hover{filter:brightness(1.08)}
  .chip-action:hover,.hud .back:hover{color:var(--ink);border-color:var(--amber)}
}
.kbd-hint{display:none}
@media (min-width:900px){
  header{padding:26px 24px 18px}
  .brand{font-size:46px}
  .brand br{display:none}
  .tagline{font-size:13.5px;margin-top:8px}
  main{max-width:1060px;padding:26px 28px 110px}
  /* écran réglages en deux colonnes */
  .setup-grid{display:grid;grid-template-columns:340px 1fr;gap:34px;align-items:start}
  .setup-grid .section-label:first-child{margin-top:0}
  .col-right .section-label:first-child{margin-top:0}
  .modes{grid-template-columns:1fr}
  .mode-btn{padding:18px 16px}
  .mode-btn h3{font-size:21px}
  .mode-btn p{font-size:13.5px}
  .fam{font-size:13.5px;padding:7px 14px}
  /* écran de jeu centré */
  .game-wrap{max-width:760px;margin:0 auto}
  .strip{grid-template-columns:84px 1fr}
  .strip::before{left:84px}
  .strip .numbox .n{font-size:34px}
  .strip .body{padding:22px 26px 24px;min-height:190px}
  .strip .q{font-size:21px}
  .strip .a{font-size:18px}
  .strip .body::after{width:230px;height:259px;right:-30px;bottom:-40px}
  .btn{font-size:21px;padding:15px}
  .kbd-hint{
    display:block;text-align:center;margin-top:14px;font-size:12.5px;color:var(--muted);
  }
  .kbd-hint kbd{
    display:inline-block;border:1px solid var(--line);border-radius:5px;padding:1px 7px;
    font-family:inherit;font-size:11.5px;background:var(--navy2);margin:0 2px;
  }
  .endcard{max-width:560px;margin:40px auto 0;padding:36px 30px}
  .endcard .big{font-size:80px}
  .footer-logo{width:170px}
}

.grp-row{display:flex;gap:8px;margin-top:9px}
.grp-row input{flex:1;background:var(--navy2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:inherit;font-weight:600;font-size:14.5px;padding:10px 12px;outline:none;min-width:0}
.grp-row input:focus{border-color:var(--green)}
.grp-row input::placeholder{color:#5f7ab8;font-weight:400}
.btn.mini{font-size:14px;padding:10px 14px;letter-spacing:.04em}
.grp-msg{font-size:12px;margin-top:7px;min-height:14px;color:var(--muted);font-weight:600}
.grp-banner{display:flex;align-items:center;gap:12px;justify-content:space-between}
.grp-name{font-weight:800;font-size:16px}
.grp-sub{font-size:11.5px;color:var(--muted)}
.grp-code{font-family:'Houschka Rounded','houschka-rounded','Quicksand','Nunito',sans-serif;font-weight:800;font-size:17px;letter-spacing:.18em;background:var(--navy2);border:1px solid var(--green);color:var(--green);padding:5px 10px;border-radius:8px}
.share-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.share-btn{border:1px solid var(--line);background:var(--navy2);color:var(--ink);border-radius:8px;padding:9px 13px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
@media (hover:hover){ .share-btn:hover{border-color:var(--green);color:var(--green)} }

</style>
</head>

<script>
const GAME = "incollables";
const GAME_TITLE = "les Incollables du Contrôle Aérien";
const CARDS = [{"n":1,"q":"Quelle loi a créé le corps des OCCA, ancêtres des ICNA ?","a":"La loi n°64-650 du 2 juillet 1964 — qui leur interdisait aussi de faire grève.","f":"Histoire — Les fondations (1964–1990)"},{"n":2,"q":"Que signifiait OCCA ?","a":"Officier Contrôleur de la Circulation Aérienne.","f":"Histoire — Les fondations (1964–1990)"},{"n":3,"q":"Quel droit la loi de 1964 retirait-elle aux contrôleurs ?","a":"Le droit de grève.","f":"Histoire — Les fondations (1964–1990)"},{"n":4,"q":"Quand le SNCTA est-il né ?","a":"Le 27 février 1965","f":"Histoire — Les fondations (1964–1990)"},{"n":5,"q":"Quel était le premier nom du syndicat ?","a":"Le SOCCA-CFTC : Syndicat des Officiers Contrôleurs de la Circulation Aérienne.","f":"Histoire — Les fondations (1964–1990)"},{"n":6,"q":"De quel syndicat le SOCCA est-il issu ?","a":"Du SGAC-CFTC, le Syndicat Général de l'Aviation Civile affilié à la CFTC.","f":"Histoire — Les fondations (1964–1990)"},{"n":7,"q":"Quels syndicats représentaient l'aviation civile avant 1965 ?","a":"L'USAC-CGT et le SGAC-CFTC (futur SOCCA-CFTC puis futur SNCTA).","f":"Histoire — Les fondations (1964–1990)"},{"n":8,"q":"Pourquoi les contrôleurs voulaient-ils leur propre syndicat dans les années 60 ?","a":"Ils voulaient une « Troupes de choc dans les conflits et absents des négociations », ils revendiquaient le droit de parler eux-mêmes de leurs spécificités.","f":"Histoire — Les fondations (1964–1990)"},{"n":9,"q":"Quel co-fondateur du SOCCA a raconté la création du syndicat en 1992 ?","a":"Jean-Marie Lefranc, à l'occasion de son départ en retraite.","f":"Histoire — Les fondations (1964–1990)"},{"n":10,"q":"Qu'est-ce qui attirait les fondateurs vers la CFTC plutôt que la CGT ?","a":"Le caractère réformiste, étranger à l'USAC-CGT de tendance révolutionnaire ; le caractère chrétien était déjà secondaire.","f":"Histoire — Les fondations (1964–1990)"},{"n":11,"q":"En quelle catégorie les contrôleurs étaient-ils classés depuis 1947 ?","a":"En catégorie B, dite d'exécution — le contrôleur ne fournissait alors que des renseignements.","f":"Histoire — Les fondations (1964–1990)"},{"n":12,"q":"Quel transfert de responsabilité a motivé la revalorisation du métier ?","a":"Le transfert de l'anti-collision du commandant de bord vers le contrôleur, avec les avions à réaction et avec une forte densité du trafic.","f":"Histoire — Les fondations (1964–1990)"},{"n":13,"q":"Quand le SOCCA-CFTC est-il devenu le SNCTA-CFTC ?","a":"En février 1970, en congrès, pour représenter tous les corps exerçant le métier de contrôleur.","f":"Histoire — Les fondations (1964–1990)"},{"n":14,"q":"Quelle charte le syndicat adopte-t-il en 1970 ?","a":"La charte de Bordeaux.","f":"Histoire — Les fondations (1964–1990)"},{"n":15,"q":"Quand le premier Protocole a-t-il été proposé ?","a":"En juillet 1970, par le ministre des Transports.","f":"Histoire — Les fondations (1964–1990)"},{"n":16,"q":"Qu'ont fait les syndicats signataires du Protocole de 1970 en 1973 ?","a":"Ils l'ont dénoncé — mais l'administration a décidé de le reconduire tel quel.","f":"Histoire — Les fondations (1964–1990)"},{"n":17,"q":"Comment le livre « L'Aventure du Contrôle aérien » qualifie-t-il l'année 1973 ?","a":"« 28 jours de grève — Année noire », retrouvez y un lien vers une vidéo.","f":"Histoire — Les fondations (1964–1990)"},{"n":18,"q":"Qu'a lancé le SNCTA le 10 février 1973 ?","a":"un appel à la grève totale de quatre jours — préavis rejeté par le ministère au nom de la loi de 1964 qui les en interdisait le droit.","f":"Histoire — Les fondations (1964–1990)"},{"n":19,"q":"Quels étaient les deux objectifs de la grève de 1973 ?","a":"Le rétablissement des libertés syndicales des OCCA et le reclassement indiciaire de la profession.","f":"Histoire — Les fondations (1964–1990)"},{"n":20,"q":"Comment le ministre des Transports a-t-il qualifié les contrôleurs à la télévision en 1973 ?","a":"De « hors-la-loi » — en annonçant le déclenchement du plan Clément Marot.","f":"Histoire — Les fondations (1964–1990)"},{"n":21,"q":"Qu'était le plan Clément Marot ?","a":"La reprise du contrôle aérien par les militaires en cas de grève des contrôleurs civils.","f":"Histoire — Les fondations (1964–1990)"},{"n":22,"q":"Qui a désamorcé le plan Clément Marot en direct à la télévision ?","a":"Le président du SNPL, en uniforme : les pilotes refuseraient de voler sous contrôle militaire.","f":"Histoire — Les fondations (1964–1990)"},{"n":23,"q":"Quelle fédération internationale a soutenu les contrôleurs en 1973 ?","a":"L'IFALPA, la fédération internationale des pilotes de ligne.","f":"Histoire — Les fondations (1964–1990)"},{"n":24,"q":"Comment le SNCTA a-t-il démontré le manque de compétence du contrôle militaire en 1973 ?","a":"En faisant fuiter des enregistrements de fréquences auprès de radios limitrophes, RMC et RTL.","f":"Histoire — Les fondations (1964–1990)"},{"n":25,"q":"Quelle catastrophe s'est produite le 5 mars 1973 ?","a":"Une collision en plein vol au-dessus de La Planche, près de Nantes : 68 morts, alors que le service était rendu par l'armée.","f":"Histoire — Les fondations (1964–1990)"},{"n":26,"q":"Quelle attitude ont eu les confédérations pendant la grève de 1973 ?","a":"Elles ne se sont pas associées au mouvement : la CGT a appelé à la reprise, la CFTC s'est montrée tiède.","f":"Histoire — Les fondations (1964–1990)"},{"n":27,"q":"Qui était secrétaire national du SNCTA en 1973 ?","a":"Daniel Gorin — son interview sur l'année noire est disponible en vidéo (Chaine Youtube SNCTA).","f":"Histoire — Les fondations (1964–1990)"},{"n":28,"q":"Quelle conséquence a laissée 1973 dans le paysage syndical ?","a":"Des tensions durables entre contrôleurs des différentes obédiences — et l'acte fondateur de la solidarité du SNCTA envers les collègues frappés.","f":"Histoire — Les fondations (1964–1990)"},{"n":29,"q":"Que s'est-il passé au VIIIe congrès, un 30 janvier 1978 ?","a":"Le SNCTA s'est désaffilié de la CFTC, après des débats très tendus de quatre jours.","f":"Histoire — Les fondations (1964–1990)"},{"n":30,"q":"Quel score a obtenu le premier vote de désaffiliation de la CFTC au sein du SNCTA dans les années 70 ?","a":"54 % pour, 42 % contre — insuffisant face à la majorité qualifiée de 75 % exigée par les statuts.","f":"Histoire — Les fondations (1964–1990)"},{"n":31,"q":"Pourquoi la majorité qualifiée était-elle fixée à 75 % pour se désaffilier de la CFTC dans les statuts du SOCCA-CFTC (futur SNCTA) ?","a":"Par peur d'entrisme d'autres syndicats.","f":"Histoire — Les fondations (1964–1990)"},{"n":32,"q":"Comment la CFTC a-t-elle réagi à la désaffiliation du SNCTA en 1978 ?","a":"Elle a radié le SNCTA avant même la notification officielle, et refusé toute liste commune aux élections suivantes.","f":"Histoire — Les fondations (1964–1990)"},{"n":33,"q":"Quel score électoral a fait le SNCTA après la désaffiliation de la CFTC ?","a":"37,45 % (contre 51,96 % en 1975) : l'une des rares fois où le syndicat est passé sous les 50 %, comme après la scission de l'UNSA ICNA en 2009.","f":"Histoire — Les fondations (1964–1990)"},{"n":34,"q":"Que marquent les années 1975-1979 selon le livre « L'Aventure du Contrôle Aérien » ?","a":"Tensions civils/militaires, désaffiliation de la CFTC, revendications sociales et régulations à 8 avions.","f":"Histoire — Les fondations (1964–1990)"},{"n":35,"q":"Quand les contrôleurs ont-ils obtenu le droit de grève ?","a":"En 1984 : un meilleur encadrement réglementaire des conflits sociaux.","f":"Histoire — Les fondations (1964–1990)"},{"n":36,"q":"Quels facteurs ont apaisé le dialogue social à partir des années 1990 ?","a":"L'accès des contrôleurs à la catégorie A (portes de l'encadrement) et la satisfaction de revendications indiciaires, indemnitaires et de retraite (ATC).","f":"Histoire — Les fondations (1964–1990)"},{"n":37,"q":"À quoi sert historiquement l'ATC ?","a":"À compenser temporairement le faible taux de remplacement des pensions de la profession dû à ses fortes primes.","f":"Histoire — Les fondations (1964–1990)"},{"n":38,"q":"Quand le Centre de Contrôle Régional d'Orly a-t-il été créé ?","a":"En 1951.","f":"Histoire — Les fondations (1964–1990)"},{"n":39,"q":"Où le contrôle en-route s'est-il installé en 1962 ?","a":"À Athis-Mons (CCR).","f":"Histoire — Les fondations (1964–1990)"},{"n":40,"q":"En quelle année le CRNA d'Aix-en-Provence apparaît-il en photo dans le livre « L'Aventure du Contrôle Aérien » ?","a":"En 1966 — puis le nouveau CRNA d'Aix en 1999.","f":"Histoire — Les fondations (1964–1990)"},{"n":41,"q":"Que montre la photo de 1972 dans le livre ?","a":"La vigie d'Orly — l'année du congrès SNCTA-CFTC d'avril 1972.","f":"Histoire — Les fondations (1964–1990)"},{"n":42,"q":"Quel type d'actions marquait les 30 premières années de relations sociales ?","a":"Grèves, régulations « sauvages », arrêts des décollages parfois durement sanctionnés par l'administration.","f":"Histoire — Les fondations (1964–1990)"},{"n":43,"q":"Pourquoi les contrôleurs se sentaient-ils mal représentés dans les confédérations ?","a":"Leurs représentants jouaient « plus le rôle de filtre que celui de relais ».","f":"Histoire — Les fondations (1964–1990)"},{"n":44,"q":"Quand Jean-Marie Lefranc, fondateur du SNCTA, a-t-il commencé l'action syndicale ?","a":"Dès l'obtention de sa qualification maximale de contrôle, début 1962.","f":"Histoire — Les fondations (1964–1990)"},{"n":45,"q":"Qu'est-ce qui a « fâché » J.M. Lefranc, fondateur du SNCTA, avec les systèmes hiérarchisés ?","a":"Ses vingt-huit mois de service militaire, achevés en octobre 1960.","f":"Histoire — Les fondations (1964–1990)"},{"n":46,"q":"D'où venaient les formateurs des premiers contrôleurs ?","a":"Des milieux de l'aviation de la fin de la guerre 1939-45, marqués très jeunes par la résistance.","f":"Histoire — Les fondations (1964–1990)"},{"n":47,"q":"Comment J.M. Lefranc, fondateur du SNCTA, décrivait-il la réglementation ?","a":"« Vague et obsolète » : une autogestion ignorée et emprisonnée, un « bouillon de culture » à conflits.","f":"Histoire — Les fondations (1964–1990)"},{"n":48,"q":"Quel paradoxe de 1960 relève J.M Lefranc ?","a":"Un espace d'autonomie « en théorie réduit et en pratique très vaste », faute d'organisation adaptée.","f":"Histoire — Les fondations (1964–1990)"},{"n":49,"q":"Que déclenche l'échec des négociations du Protocole 1991 ?","a":"La première grève nationale depuis 1987.","f":"Histoire — La construction (1990–2026)"},{"n":50,"q":"Comment qualifier il le Protocole 1991-1994 ?","a":"Un protocole « équilibré », aboutissement des mobilisations du SNCTA.","f":"Histoire — La construction (1990–2026)"},{"n":51,"q":"Combien d'ICNA supplémentaires recrutés à partir de 1995 ?","a":"540 ICNA supplémentaires.","f":"Histoire — La construction (1990–2026)"},{"n":52,"q":"Quel protocole a suivi celui de 1991-1994 ?","a":"Le protocole 1997-2000.","f":"Histoire — La construction (1990–2026)"},{"n":53,"q":"Combien d'ICNA supplémentaires entre 1998 et 2000 ?","a":"270.","f":"Histoire — La construction (1990–2026)"},{"n":54,"q":"Qu'est-il arrivé aux négociations du Protocole 2003 ?","a":"Elles ont débuté mais se sont éternisées — sur fond de loi Fillon de 2003 sur les retraites.","f":"Histoire — La construction (1990–2026)"},{"n":55,"q":"Quand le Protocole 2007-2009 a-t-il été signé ?","a":"Le 26 octobre — il a permis de relancer les recrutements.","f":"Histoire — La construction (1990–2026)"},{"n":56,"q":"Quel jalon symbolique de formation a été célébré à cette période ?","a":"La remise de diplôme au 2000e ICNA issu de la nouvelle formation.","f":"Histoire — La construction (1990–2026)"},{"n":57,"q":"Quel dispositif de sécurité issu du protocole 2007-2009 a été déclenché ?","a":"Le dispositif de prévention des conflits, pour alerter sur des problèmes de sécurité.","f":"Histoire — La construction (1990–2026)"},{"n":58,"q":"Comment est décrit le Protocole 2010 ?","a":"Il offrait peu de perspectives de progrès — et fut vidé d'une partie de ses engagements par la DGAC.","f":"Histoire — La construction (1990–2026)"},{"n":59,"q":"Comment est décrit le congrès de 2011 ?","a":"« Un village coloré, mais un congrès morose », après la création de l'UNSA-ICNA","f":"Histoire — La construction (1990–2026)"},{"n":60,"q":"Quel fait exceptionnel marque 2013 ?","a":"Le SNCTA ne signe pas le Protocole 2013 — le seul de son histoire — jugé clairement anti-contrôleurs.","f":"Histoire — La construction (1990–2026)"},{"n":61,"q":"Que garantissait à vie le Protocole 2000 aux contrôleurs ?","a":"Son avancement de carrière.","f":"Histoire — La construction (1990–2026)"},{"n":62,"q":"Quelle méthode de démocratie directe le SNCTA emploie-t-il dès 2015 ?","a":"Des consultations directes des contrôleurs — avant l'arrêté sur l'organisation du travail de 2024.","f":"Histoire — La construction (1990–2026)"},{"n":63,"q":"Quel accord industriel majeur est signé fin 2017 ?","a":"L'accord-cadre du groupe 1 SYSAT entre la DSNA et le consortium Saab-CS, après une passation de marché rocambolesque.","f":"Histoire — La construction (1990–2026)"},{"n":64,"q":"Quelle expérimentation RH démarre en 2016-2017 ?","a":"Les expérimentations menées à Nice, Roissy et Bordeaux dès 2016, appelées aujourd'hui options.","f":"Histoire — La construction (1990–2026)"},{"n":65,"q":"Quelle durée de protocole le SNCTA revendiquait-il en 2019 ?","a":"Un Protocole 2020-2023 — premier point de désaccord avec l'administration.","f":"Histoire — La construction (1990–2026)"},{"n":66,"q":"Quelle négociation protocolaire a finalement été avortée à cause de la Covid-19 ?","a":"Celle du Protocole 2020-2025.","f":"Histoire — La construction (1990–2026)"},{"n":67,"q":"Où et quand s'est tenu le congrès « tous masqués » pendant la période Covid-19 ?","a":"À Toulouse en octobre 2021, reporté depuis mars 2021.","f":"Histoire — La construction (1990–2026)"},{"n":68,"q":"Quelle date de grève 2022 le livre « L'Aventure du Contrôle Aérien » met-il en image ?","a":"Le 16 septembre 2022 — la grève massivement suivie qui a arraché recrutements et +4,5 %.","f":"Histoire — La construction (1990–2026)"},{"n":69,"q":"Que font l'USAC-CGT et l'UNSA-ICNA début 2023 ?","a":"Des grèves en janvier, février et mars 2023 contre la réforme des retraites— un « tournant » car le droit de grève des contrôleurs est gravement menacé.","f":"Histoire — La construction (1990–2026)"},{"n":70,"q":"Quel geste rare aux yeux d'autres OS, le SNCTA accomplit-il en 2025 ?","a":"Lever un préavis de grève après avoir obtenu satisfaction — fait rare dans le paysage syndical, mais une réussite pour le SNCTA.","f":"Histoire — La construction (1990–2026)"},{"n":71,"q":"Quelle mesure statutaire forte pour la profession le Protocole 2027 acte-t-il ?","a":"La création du corps unique — avec un achèvement à horizon 2040.","f":"Histoire — La construction (1990–2026)"},{"n":72,"q":"Quel principe de négociation le SNCTA privilégie-t-il ?","a":"La logique protocolaire : accords gagnant-gagnant respectueux d'une vision nationale équilibrée.","f":"Histoire — La construction (1990–2026)"},{"n":73,"q":"Quelle grève récente illustre l'impact du SNCTA pour recruter 1000 contrôleurs ?","a":"Celle du 16 septembre 2022 : son impact sur le trafic est indéniable.","f":"Histoire — La construction (1990–2026)"},{"n":74,"q":"Quel impact a la grève de 2022 sur les effectifs ?","a":"Elle a contraint les Pouvoirs publics à accorder la trajectoire pluriannuelle : 96, 128 puis 160 MCTA/an.","f":"Histoire — La construction (1990–2026)"},{"n":75,"q":"Quel anniversaire le livre « L'Aventure du Contrôle Aérien » célèbre-t-il ?","a":"Les 60 ans du SNCTA (1965-2025).","f":"Histoire — La construction (1990–2026)"},{"n":76,"q":"Quel contrôleur de 1965 incarne le professionnalisme du SNCTA ?","a":"Daniel Gorin : s'organiser, se documenter, ne laisser aucune faille dans l'argumentation.","f":"Histoire — La construction (1990–2026)"},{"n":77,"q":"Combien de temps ont duré les relations sociales conflictuelles dures ?","a":"Une trentaine d'années, jusqu'au tournant des années 1990.","f":"Histoire — La construction (1990–2026)"},{"n":78,"q":"Quelle signature du SNCTA suit la grève de 2022 ?","a":"Celle du Protocole social 2023-2027 — la « revalorisation historique ».","f":"Histoire — La construction (1990–2026)"},{"n":79,"q":"Quel préavis 2023 complète la mécanique salariale ?","a":"Le préavis de septembre 2023 pour lutter contre l'inflation : +4,5 à +4,68 % des primes et un rendez-vous en septembre 2024.","f":"Histoire — La construction (1990–2026)"},{"n":80,"q":"Quel mouvement 2025 clôt la séquence inflation ?","a":"Le préavis de septembre 2025, reporté en octobre : +2,1 %, à hauteur de l'inflation.","f":"Histoire — La construction (1990–2026)"},{"n":81,"q":"Quelle constante traverse toute l'histoire des protocoles SNCTA ?","a":"Le SNCTA les a tous signés sauf celui de 2013 — et il a installé la logique protocolaire dans les années 1980.","f":"Histoire — La construction (1990–2026)"},{"n":82,"q":"Que pointe la période 2004-2016 côté conflictualité européenne ?","a":"Une part disproportionnée des grèves européennes attribuée à la France — que la réforme du droit de grève vient corriger.","f":"Histoire — La construction (1990–2026)"},{"n":83,"q":"Quelle est la le slogan actuel du SNCTA ?","a":"« Veiller sur vous qui veillez sur le Ciel ».","f":"Valeurs & identité"},{"n":84,"q":"Citez les 6 caractéristiques du SNCTA.","a":"Professionnel, apolitique, autonome, réformiste, démocratique, solidaire.","f":"Valeurs & identité"},{"n":85,"q":"Pourquoi « professionnel » se présente-il avant tout comme un syndicat professionnel ?","a":"Le SNCTA est le syndicat d'une profession, il met ses moyens d'actions uniquement pour la protéger et protéger les contrôleurs.","f":"Valeurs & identité"},{"n":86,"q":"Qu'implique le professionnalisme des représentants ?","a":"Même bénévole, la représentation s'exerce avec méthode : s'organiser, se documenter, ne laisser aucune faille.","f":"Valeurs & identité"},{"n":87,"q":"L'apolitisme du SNCTA est-il de l'indifférence ?","a":"Non : pas de procès d'intention aux gouvernements élus, mais mobilisation garantie si nécessaire.","f":"Valeurs & identité"},{"n":88,"q":"Les adhérents du SNCTA peuvent-ils s'engager en politique ?","a":"Oui, ils restent parfaitement libres de leur expression et de leur engagement politiques.","f":"Valeurs & identité"},{"n":89,"q":"Que signifie l'autonomie du SNCTA ?","a":"Aucune confédération : « ne laissez personne parler pour vous » — les dossiers de la profession sont portés par des contrôleurs.","f":"Valeurs & identité"},{"n":90,"q":"Comment le SNCTA est-il présent en Europe ?","a":"Via l'ATCEUC, la coordination des syndicats autonomes de contrôleurs européens. Il en assure en 2026 sa présidence.","f":"Valeurs & identité"},{"n":91,"q":"Quelle décision de congrès résume le réformisme ?","a":"« Le SNCTA n'est pas a priori contre ».","f":"Valeurs & identité"},{"n":92,"q":"Quelle est la place du droit de grève dans la méthode SNCTA ?","a":"L'arme ultime, une arme de persuasion, jamais une posture ; il doit servir à faire aboutir des revendications légitimes.","f":"Valeurs & identité"},{"n":93,"q":"Comment s'exprime la démocratie interne du SNCTA ?","a":"La politique est votée par les adhérents en Congrès tous les 2 ans, la défense est assurée par des représentants élus.","f":"Valeurs & identité"},{"n":94,"q":"Quelle est LA valeur fondamentale du SNCTA ?","a":"La solidarité.","f":"Valeurs & identité"},{"n":95,"q":"Quel événement fonde la solidarité du SNCTA ?","a":"Le soutien aux collègues frappés par l'administration après 1973 (accident aérien alors que les contrôleurs militaires remplacent les civils, 7 révoqués de la Fonction publique)","f":"Valeurs & identité"},{"n":96,"q":"Comment la solidarité s'incarne-t-elle aujourd'hui ?","a":"Environ 200 experts et représentants bénévoles au service de tous, adhérents ou non.","f":"Valeurs & identité"},{"n":97,"q":"Quelle citation peut illustrer l'esprit collectif du SNCTA ?","a":"« Aucun de nous, en agissant seul, ne peut atteindre le succès ».","f":"Valeurs & identité"},{"n":98,"q":"Quelle est la position du SNCTA sur le service public ?","a":"Un service public performant est un service public inattaquable.","f":"Valeurs & identité"},{"n":99,"q":"La performance est-elle un « gros mot » pour le SNCTA ?","a":"Non : c'est la meilleure protection du service public — le rendre inattaquable par son efficacité.","f":"Valeurs & identité"},{"n":100,"q":"Que signifie « Plus forts ensemble », le slogan post signature protocolaire en 2024 ?","a":"Plus qu'un slogan, c'est une stratégie : un corps unique, uni, donc fort.","f":"Valeurs & identité"},{"n":101,"q":"Comment le SNCTA conçoit-il le rapport de force ?","a":"Proportionné, crédible, débouchant toujours sur un résultat concret et mesurable.","f":"Valeurs & identité"},{"n":102,"q":"Qu'est-ce que le « donnant-donnant maîtrisé » ?","a":"Accepter des contreparties encadrées quand elles permettent d'obtenir mieux en retour.","f":"Valeurs & identité"},{"n":103,"q":"Qui décide de l'organisation du travail dans un organisme selon les options de l'arrêté 2024 ?","a":"Les contrôleurs eux-mêmes : options adoptées ou refusées localement, volontariat d'organisme.","f":"Valeurs & identité"},{"n":104,"q":"Quel principe unique dans la Fonction publique le volontariat d'organisme illustre-t-il ?","a":"Pouvoir accepter ou refuser un pacte de productivité rémunéré, sans heure ni jour en plus.","f":"Valeurs & identité"},{"n":105,"q":"Pourquoi le travail en équipe est-il « sacralisé » dans certains centres ?","a":"Parce que le collectif est source de sécurité et de performance. C'est un principe fondateur, pas une variable d'ajustement.","f":"Valeurs & identité"},{"n":106,"q":"Qu'est-ce que le travail en pôle ?","a":"Une alternative aux horaires individualisés dans les approches à effectif intermédiaire, qui renforce l'esprit du collectif.","f":"Valeurs & identité"},{"n":107,"q":"Quel est le rôle du Guide du contrôleur ?","a":"Rassembler le cadre réglementaire, de la loi à la note de service, que le SNCTA a contribué à faire émerger ou écrire.","f":"Valeurs & identité"},{"n":108,"q":"Que défend le SNCTA dans les médias ?","a":"L'image de la profession, face aux attaques et aux instrumentalisations.","f":"Valeurs & identité"},{"n":109,"q":"Comment le SNCTA suscite-t-il les vocations ?","a":"Marque Devenir Contrôleur Aérien : réseaux sociaux, forums, visites de sites, création des ambassadeurs métier.","f":"Valeurs & identité"},{"n":110,"q":"Que dit le SNCTA de la fierté du métier ?","a":"Un métier reconnu et attractif est un service public qui dure.","f":"Valeurs & identité"},{"n":111,"q":"Quelle image le SNCTA revendique-t-il dans la campagne 2026 ?","a":"Celle d'un phare : un repère fixe qui éclaire, protège et ne s'éteint jamais…en pleine tempête comme par beau temps.","f":"Valeurs & identité"},{"n":112,"q":"À qui s'adressent les cellules du SNCTA ?","a":"À tous les contrôleurs : adhérents et non-adhérents.","f":"Valeurs & identité"},{"n":113,"q":"Pourquoi le SNCTA refuse-t-il les automatismes dans ses cellules ?","a":"Chaque situation est unique : 100 % de réponses individualisées, par des pairs experts.","f":"Valeurs & identité"},{"n":114,"q":"Qu'est-ce que la mutualisation rend possible ?","a":"L'excellence pour chacun — comme la défense par un grand cabinet d'avocats — grâce aux cotisations de tous.","f":"Valeurs & identité"},{"n":115,"q":"Quelle exigence le SNCTA s'impose-t-il dans ses revendications ?","a":"Qu'elles soient fondées, légitimes et crédibles : l'exigence n'est pas la surenchère.","f":"Valeurs & identité"},{"n":116,"q":"Quelle attitude le SNCTA refuse-t-il ?","a":"Les attaques et le dénigrement.","f":"Valeurs & identité"},{"n":117,"q":"Quelle est la première phrase du slogan 2026 ?","a":"« Par passion du métier. » — elle ne change jamais : c'est l'identité.","f":"Valeurs & identité"},{"n":118,"q":"Quelle est la seconde phrase du slogan 2026 ?","a":"« Par exigence pour l'avenir. » — déclinable selon les thèmes.","f":"Valeurs & identité"},{"n":119,"q":"Que répond le slogan des élections 2026 à la question « pourquoi font-ils tout ce travail ? »","a":"Par passion — pas par calcul, pas par ambition d'appareil, pas par posture.","f":"Valeurs & identité"},{"n":120,"q":"Quelle est la signature institutionnelle associée au slogan des élections 2026 ?","a":"« Par passion du métier. Par exigence pour l'avenir. »","f":"Valeurs & identité"},{"n":121,"q":"Quelle exigence envers les interlocuteurs porte le slogan ?","a":"Les engagements pris doivent être tenus.","f":"Valeurs & identité"},{"n":122,"q":"Comment comprendre le slogan des élections 2026 « Par passion du métier. Par engagement pour l'avenir. »","a":"Par passion, pas par posture. Avec exigence, car la profession mérite mieux que des promesses. Pour l'avenir, car un syndicat sérieux construit la suite.","f":"Valeurs & identité"},{"n":123,"q":"Quel est l'objectif de transmission du SNCTA ?","a":"Léguer aux générations futures un service public et une profession en meilleur état qu'on ne les a reçus.","f":"Valeurs & identité"},{"n":124,"q":"Que garantit le SNCTA à ses mandants selon la note de 1965 ?","a":"Défendre correctement chaque mandant, sur ses problématiques individuelles comme collectives.","f":"Valeurs & identité"},{"n":125,"q":"Quelle transparence le SNCTA revendique-t-il ?","a":"La franchise en toute circonstance : une seule et même voix, quel que soit l'interlocuteur.","f":"Valeurs & identité"},{"n":126,"q":"Pourquoi voter est-il un acte de valeurs ?","a":"Parce que chaque voix donne au SNCTA les moyens financiers, le poids (instances) et la légitimité (représentativité) de les faire vivre.","f":"Valeurs & identité"},{"n":127,"q":"OCCA ?","a":"Officier Contrôleur de la Circulation Aérienne — l'ancêtre de l'ICNA (loi de 1964).","f":"Sigles & vocabulaire"},{"n":128,"q":"SOCCA ?","a":"Syndicat des Officiers Contrôleurs de la Circulation Aérienne — premier nom du SNCTA (1965).","f":"Sigles & vocabulaire"},{"n":129,"q":"DSNA ?","a":"Direction des Services de la Navigation Aérienne.","f":"Sigles & vocabulaire"},{"n":130,"q":"DO ?","a":"Direction des Opérations.","f":"Sigles & vocabulaire"},{"n":131,"q":"SNA ?","a":"Service de la Navigation Aérienne.","f":"Sigles & vocabulaire"},{"n":132,"q":"ÉNAC ?","a":"École Nationale de l'Aviation Civile.","f":"Sigles & vocabulaire"},{"n":133,"q":"MCTA ?","a":"La voie de formation des élèves contrôleurs à l'ÉNAC (96 recrutés en 2023, 128 en 2024, 160/an ensuite), grade MASTER","f":"Sigles & vocabulaire"},{"n":134,"q":"MU ?","a":"Mention d'Unité, sa détention totale déclenche le titre de PC.","f":"Sigles & vocabulaire"},{"n":135,"q":"PC ?","a":"Premier Contrôleur, titre désormais attribué dès la MU totale et maintenu à vie.","f":"Sigles & vocabulaire"},{"n":136,"q":"ZZ ?","a":"La qualification dont 16 ans d'exercice garantissent le maintien du plus haut couple ISQ/CISQ.","f":"Sigles & vocabulaire"},{"n":137,"q":"ISQ / CISQ ?","a":"Les indemnités liées à la qualification, dont le plus haut niveau atteint est conservé après 16 ans de ZZ.","f":"Sigles & vocabulaire"},{"n":138,"q":"MCISQ ?","a":"La majoration de CISQ, prime de la part Licence conservée après 16 ans d'exercice d'une MU.","f":"Sigles & vocabulaire"},{"n":139,"q":"HEB / HEA ?","a":"Les échelons sommitaux « hors échelle » : HEA III pour le grade Divisionnaire, HEB III pour le grade en-Chef.","f":"Sigles & vocabulaire"},{"n":140,"q":"NBI ?","a":"Nouvelle Bonification Indiciaire de 55 points.","f":"Sigles & vocabulaire"},{"n":141,"q":"ATC ?","a":"L'allocation temporaire complémentaire : dispositif de solidarité pour la retraite, revalorisé de 112 k€ sur 13 ans.","f":"Sigles & vocabulaire"},{"n":142,"q":"CIT ?","a":"Le complément individuel temporaire pour combler les dispositifs Retraite de la Fonction publique inapplicables aux ICNA.","f":"Sigles & vocabulaire"},{"n":143,"q":"CCA (le compte) ?","a":"Le Compte de la Circulation Aérienne : 6 à 12 jours par an pour anticiper la retraite à 100 % du salaire.","f":"Sigles & vocabulaire"},{"n":144,"q":"PQH ?","a":"Un des acquis préservés dans le reclassement du corps ICNA des TSEEAC","f":"Sigles & vocabulaire"},{"n":145,"q":"AVE ?","a":"AVis de vacance d'Emploi, le support des mutations.","f":"Sigles & vocabulaire"},{"n":146,"q":"CDM ?","a":"La campagne de mutation, 13 CDM de priorité pour les approches reprises.","f":"Sigles & vocabulaire"},{"n":147,"q":"PPA ?","a":"Plan Pluriannuel d'Affectation : la répartition minimale des effectifs garantie sur 5 ans, annexée au protocole.","f":"Sigles & vocabulaire"},{"n":148,"q":"ITM ?","a":"Indemnité Temporaire de Mobilité, versée aux AVE vers les terrains peu attractifs et les grands centres du Nord.","f":"Sigles & vocabulaire"},{"n":149,"q":"VIC ?","a":"Vacation d'Intervention de Contrôle : rester chez soi rappelable en cas de surcapacité, transformable en congé jusqu'à J-1.","f":"Sigles & vocabulaire"},{"n":150,"q":"MDDA ?","a":"Montées Décalées / Départs Anticipés : la gestion des salles rendue aux opérationnels, 4 h de présence minimum.","f":"Sigles & vocabulaire"},{"n":151,"q":"TDS ?","a":"Tour De Service, arrêté à 18h l'avant-veille un jour de grève.","f":"Sigles & vocabulaire"},{"n":152,"q":"JRH ?","a":"Les jours de repos que les 18 récupérations des 28 h hebdomadaires n'impactent pas.","f":"Sigles & vocabulaire"},{"n":153,"q":"RS, RPT, RMT ?","a":"Les typologies de récupérations associées au CCA, valables jusqu'au 31/12 de l'année suivant leur obtention.","f":"Sigles & vocabulaire"},{"n":154,"q":"EAO ?","a":"Les entraînements d'anglais, désormais possibles en télétravail pour les contrôleurs en salle.","f":"Sigles & vocabulaire"},{"n":155,"q":"PSC ?","a":"Protection Sociale Complémentaire, négociée au niveau DGAC, mise en place le 1er mai 2026.","f":"Sigles & vocabulaire"},{"n":156,"q":"MGAS ?","a":"La mutuelle de référence : niveau haut de la PSC au moins équivalent a q":"Chiffre mystère : 25 %","a":"Le taux de congés minimum garanti chaque jour — et le taux de pause sur position.","f":"Chiffre mystère"},{"n":243,"q":"Chiffre mystère : 14","a":"Les jours de congés garantis pour tous en juillet-août.","f":"Chiffre mystère"},{"n":244,"q":"Chiffre mystère : 1420","a":"Le plafond annuel d'heures des contrôleurs.","f":"Chiffre mystère"},{"n":245,"q":"Chiffre mystère : 32","a":"Les heures hebdomadaires moyennes réaffirmées par l'arrêté 2024.","f":"Chiffre mystère"},{"n":246,"q":"Chiffre mystère : 48","a":"Les heures maximum sur 7 jours glissants.","f":"Chiffre mystère"},{"n":247,"q":"Chiffre mystère : 64","a":"Les heures annuelles maximum de dépassement des 32 h hebdomadaires.","f":"Chiffre mystère"},{"n":248,"q":"Chiffre mystère : 10","a":"Les heures maximum d'une vacation de contrôle de jour.","f":"Chiffre mystère"},{"n":249,"q":"Chiffre mystère : 45","a":"Les minutes de pause déjeuner minimale obligatoire en équipes et pôles.","f":"Chiffre mystère"},{"n":250,"q":"Chiffre mystère : 28 (bis)","a":"Le temps hebdomadaire obtenu par le SNCTA, matérialisé par 18 récupérations annuelles.","f":"Chiffre mystère"},{"n":251,"q":"Chiffre mystère : 18","a":"Les récupérations octroyées en début d'année aux opérationnels (6 pour les hors-salle avec MU) dans le CCA.","f":"Chiffre mystère"},{"n":252,"q":"Chiffre mystère : 4","a":"Les heures de présence minimum avec les MDDA — et les scrutins de décembre 2026.","f":"Chiffre mystère"},{"n":253,"q":"Chiffre mystère : +4,5 %","a":"L'augmentation arrachée par la grève de septembre 2022.","f":"Chiffre mystère"},{"n":254,"q":"Chiffre mystère : +2,1 %","a":"L'augmentation 2025, à hauteur de l'inflation.","f":"Chiffre mystère"},{"n":255,"q":"Chiffre mystère : 70 %","a":"La revalorisation de l'option 3-2, deux ans après la signature du protocole.","f":"Chiffre mystère"},{"n":256,"q":"Chiffre mystère : 300","a":"En euros mensuels : la prime de fidélisation dès PC+4 (CRNA Nord, CRNA Est, Orly).","f":"Chiffre mystère"},{"n":257,"q":"Chiffre mystère : 1000 €","a":"La compensation par trimestre de décalage d'une mutation régulée (6 mois max).","f":"Chiffre mystère"},{"n":258,"q":"Chiffre mystère : 30 000","a":"En euros : le plafond des primes de restructuration de service du Protocole signé en 2024.","f":"Chiffre mystère"},{"n":259,"q":"Chiffre mystère : 1850","a":"Les pages de réponses produites chaque année par la cellule ASAP.","f":"Chiffre mystère"},{"n":260,"q":"Chiffre mystère : 180","a":"Les mandats portés par ASAP dans les campagnes d'avancement de grade chaque année.","f":"Chiffre mystère"},{"n":261,"q":"Chiffre mystère : 2500","a":"Les heures de travail annuelles des spécialistes de la cellule ASAP.","f":"Chiffre mystère"},{"n":262,"q":"Chiffre mystère : 15","a":"Le délai moyen de réponse d'ASAP, en jours — et les raisons de voter SNCTA du dossier de campagne.","f":"Chiffre mystère"},{"n":263,"q":"Chiffre mystère : 200","a":"Les bénévoles experts et représentants du SNCTA.","f":"Chiffre mystère"},{"n":264,"q":"Chiffre mystère : 76 000","a":"Les agents du périmètre du CSA Ministériel — dont 4000 contrôleurs.","f":"Chiffre mystère"},{"n":265,"q":"Chiffre mystère : 50 %","a":"Le seuil de suffrages requis pour qu'un accord collectif soit juridiquement valide — et pour valider une option en organisme.","f":"Chiffre mystère"},{"n":266,"q":"Chiffre mystère : 51 %","a":"Le score du SNIESSA chez les IESSA.","f":"Chiffre mystère"},{"n":267,"q":"Chiffre mystère : 2040","a":"L'horizon d'achèvement du corps unique, dont la création est actée à l'horizon du Protocole 2027.","f":"Chiffre mystère"},{"n":268,"q":"Chiffre mystère : 3 → 10","a":"Décembre 2026 : les dates du vote électronique. VOTE SNCTA !","f":"Chiffre mystère"},{"n":269,"q":"Quand vote-t-on aux élections professionnelles ?","a":"Du 3 au 10 décembre 2026, par vote électronique.","f":"Élections & campagne"},{"n":270,"q":"Quels sont les 3 scrutins ?","a":"CSA Ministériel, CSA DSNA (et proximité), CAP ICNA (ou CAP TSEEAC).","f":"Élections & campagne"},{"n":271,"q":"Que finance concrètement le vote au CSA Ministériel ?","a":"Les moyens financiers et le crédit de temps syndical — le carburant des 200 bénévoles et des cellules.","f":"Élections & campagne"},{"n":272,"q":"Pourquoi le CSA Ministériel est-il éloigné du terrain ?","a":"Il couvre 76 000 agents dont 4000 contrôleurs ; l'opérationnel se négocie au niveau DGAC.","f":"Élections & campagne"},{"n":273,"q":"Que détermine le scrutin CSA DSNA ?","a":"Les voix délibératives en CSA locaux, DO, DSNA et DGAC, et les représentativités FS et action sociale.","f":"Élections & campagne"},{"n":274,"q":"Où le SNCTA présente-t-il d'autres listes de proximité ?","a":"CSA ÉNAC, CSA SEAC Polynésie française, CSA DAC Nouvelle-Calédonie.","f":"Élections & campagne"},{"n":275,"q":"Que mesure la CAP ICNA ?","a":"La représentativité des syndicats chez les ICNA — le paysage syndical national et local du corps, son poids politique.","f":"Élections & campagne"},{"n":276,"q":"Que mesure la CAP TSEEAC ?","a":"La représentativité chez les TSEEAC contrôleurs et la Vigie Trafic de CDG.","f":"Élections & campagne"},{"n":277,"q":"D'où vient la règle des 50 % pour valider un accord social dans la Fonction publique ?","a":"De la loi de transformation de la Fonction publique (2019) et de l'ordonnance du 17 février 2021.","f":"Élections & campagne"},{"n":278,"q":"Quelle alliance porte la liste ministérielle ?","a":"SNCTA – SNIESSA – SNPL : l'alliance des opérationnels.","f":"Élections & campagne"},{"n":279,"q":"Quand l'alliance SNCTA-SNIESSA a-t-elle été annoncée ?","a":"Par communiqué intersyndical le 18 mai 2026.","f":"Élections & campagne"},{"n":280,"q":"Que veut mettre fin l'alliance côté technique ?","a":"À vingt ans d'échecs de modernisation des outils du contrôle aérien.","f":"Élections & campagne"},{"n":281,"q":"Que revendique l'alliance pour la DSNA ?","a":"Une DSNA forte, dotée des ressources humaines et budgétaires.","f":"Élections & campagne"},{"n":282,"q":"L'alliance remet-elle en cause l'autonomie du SNCTA ?","a":"Non : ni fusion ni confédération — chacun garde congrès, politique, cotisations et liberté d'action.","f":"Élections & campagne"},{"n":283,"q":"Que démontre l'alliance SNCTA-SNIESSA-SNPL pour le CSA Ministériel ?","a":"Que le syndicalisme autonome et professionnel fonctionne : il fait école et rassemble sans diluer.","f":"Élections & campagne"},{"n":284,"q":"Quel est le slogan de campagne ?","a":"« Par passion du métier. Par exigence pour l'avenir. »","f":"Élections & campagne"},{"n":285,"q":"Pourquoi le vote CSA DSNA compte-t-il pour la QVCT ?","a":"Il fonde les représentativités des FS et de l'action sociale — locaux, conditions de travail, cadre de vie.","f":"Élections & campagne"},{"n":286,"q":"Pourquoi voter SNCTA en CAP ?","a":"« Donner tout le poids politique nécessaire au SNCTA pour bâtir la profession de demain ».","f":"Élections & campagne"},{"n":287,"q":"Pourquoi voter SNCTA en CSA Ministériel ?","a":"« Donner les moyens aux cellules de fonctionner quotidiennement ».","f":"Élections & campagne"},{"n":288,"q":"Pourquoi voter SNCTA en CSA DSNA ?","a":"« Élire tes représentants locaux qui te proposeront toujours une alternative crédible ».","f":"Élections & campagne"},{"n":289,"q":"Quel enjeu spécifique porte la CAP TSEEAC en 2026 ?","a":"Garantir que le corps unique se bâtira avec et pour les TSEEAC contrôleurs, et parce que le SNCTA accompagnera tous les contrôleurs sans laissés-pour-compte.","f":"Élections & campagne"},{"n":290,"q":"Quels chantiers rendent ces élections décisives ?","a":"Modernisation, effectifs, rémunération, performance du service public, nouveaux textes fondateurs ou amendement de l'existant.","f":"Élections & campagne"},{"n":291,"q":"Quelle méthode la campagne oppose le SNCTA à la démagogie ?","a":"Le sérieux et le travail — dans les gènes du SNCTA depuis 1965.","f":"Élections & campagne"},{"n":292,"q":"Quel objectif effectifs le vote doit-il rendre possible ?","a":"L'accord autour d'un Protocole Social DGAC, ou d'accords locaux et nationaux","f":"Élections & campagne"},{"n":293,"q":"Quelles valeurs les candidats SNCTA portent-ils ?","a":"Défense d'un service public de qualité, des intérêts individuels et collectifs, promotion de la profession.","f":"Élections & campagne"},{"n":294,"q":"Quelles méthodes emploieront-ils ?","a":"Ouverture d'esprit, travail et détermination en négociation, mobilisation et unité dans le conflit, accords gagnant-gagnant.","f":"Élections & campagne"},{"n":295,"q":"Avec qui le SNCTA était-il déjà associé aux scrutins ÉNAC et ministériel ?","a":"La section DGAC du SNPL, syndicat indépendant et professionnel.","f":"Élections & campagne"},{"n":296,"q":"Que devient une voix dispersée vers un syndicat qui ne signe pas ?","a":"Elle fragilise juridiquement tout ce qui sera négocié pour la profession.","f":"Élections & campagne"},{"n":297,"q":"Combien de protocoles l'UNSA-ICNA a-t-elle signés depuis sa création ?","a":"Aucun — tout en bénéficiant des acquis négociés par d'autres.","f":"Élections & campagne"},{"n":298,"q":"Que porte la CGT en négociation protocolaire depuis 2020 ?","a":"La réduction du trafic aérien, une DSNA réduite et le report vers le train.","f":"Élections & campagne"},{"n":299,"q":"Quel jeu accompagne la campagne ?","a":"Celui que tu as entre les doigts et Kahoot, pour redécouvrir les acquis en jouant.","f":"Élections & campagne"},{"n":300,"q":"Quelle est la promesse finale de la campagne ?","a":"Écrire l'avenir de la profession avec les contrôleurs.","f":"Élections & campagne"},{"n":301,"q":"Que faire du 3 au 10 décembre 2026 ?","a":"VOTER SNCTA — par passion du métier, par exigence pour l'avenir.","f":"Élections & campagne"},{"n":302,"q":"Pourquoi chaque voix compte-t-elle, même dans un centre « acquis » ?","a":"Parce que moyens, poids et validité juridique des accords se calculent sur les voix nationales : aucune n'est superflue.","f":"Élections & campagne"},{"n":303,"q":"Complétez : « Seuls les contrôleurs inscrits au ... doivent se déclarer grévistes. »","a":"Au tour de service, quel que soit le centre de contrôle.","f":"Droit de grève & conflits"},{"n":304,"q":"Un contrôleur veut faire grève jeudi. Quand doit-il se déclarer au plus tard ?","a":"Mardi à midi, la règle : midi l'avant-veille.","f":"Droit de grève & conflits"},{"n":305,"q":"Qui suis-je ? Je suis décidé à 18h l'avant-veille pour toute la journée de grève.","a":"Le tour de service (TDS) : un service minimum avec astreintes ou nominal éventuellement dégradé.","f":"Droit de grève & conflits"},{"n":306,"q":"Que risquait une grève peu suivie avant la déclaration préalable ?","a":"De générer quand même d'importants abattements et retards, et de menacer notre droit de grève.","f":"Droit de grève & conflits"},{"n":307,"q":"Qui a été « exaspéré » au point de créer la déclaration préalable ?","a":"Le Parlement, avec une loi promulguée fin 2023 après les événements de février 2022 à Orly et Aix-en-Provence.","f":"Droit de grève & conflits"},{"n":308,"q":"Quel double dispositif la loi n°2023-1289 institue-t-elle ?","a":"La déclaration préalable et un nouveau service minimum.","f":"Droit de grève & conflits"},{"n":309,"q":"Pourquoi le décret d'application de la loi n°2023-1289 (DP et SM) a-t-il tardé jusqu'à juin 2025 ?","a":"De multiples rebondissements liés à l'instabilité gouvernementale, finalement publié par le Conseil d'État.","f":"Droit de grève & conflits"},{"n":310,"q":"Que concrétise le décret de la loi n°2023-1289 (DP et SM) selon le SNCTA ?","a":"Les engagements pris par l'État auprès du SNCTA et devant le Parlement après les événements à Orly et LFMM en février 2023.","f":"Droit de grève & conflits"},{"n":311,"q":"Sur quoi le niveau du service minimum est-il désormais indexé ?","a":"Sur rien : il est fixé par décret et sécurisé, indépendant de la productivité, des effectifs ou du trafic.","f":"Droit de grève & conflits"},{"n":312,"q":"Quel principe la réforme du droit de grève en 2023 établit-elle enfin ?","a":"L'adéquation entre le nombre de grévistes et l'ampleur de la grève.","f":"Droit de grève & conflits"},{"n":313,"q":"Que sécurise la déclaration préalable en cas de conflit mineur ?","a":"L'écoulement du trafic : le nouveau service minimum n'impacte fort que les conflits mobilisateurs.","f":"Droit de grève & conflits"},{"n":314,"q":"Qui dénonçait « l'instrumentalisation abusive » de la loi de 1984 ?","a":"Le SNCTA, contre des syndicats de la DGAC qui agaçaient toute la classe politique par des grèves sans grévistes notamment depuis les années 2010.","f":"Droit de grève & conflits"},{"n":315,"q":"Vrai ou faux : la liste des centres à service minimum n'avait pas changé depuis 40 ans.","a":"Vrai, elle était devenue inadéquate au trafic d'aujourd'hui","f":"Droit de grève & conflits"},{"n":316,"q":"Sur quoi un préavis local peut-il porter selon les statuts du SNCTA ?","a":"Uniquement sur des problèmes strictement locaux particulièrement aigus.","f":"Droit de grève & conflits"},{"n":317,"q":"Qui dépose conjointement un préavis local ?","a":"La section concernée avec le conseil régional concerné ou le bureau national.","f":"Droit de grève & conflits"},{"n":318,"q":"Quelle action du SNCTA en 2022 illustre la stratégie du SNCTA pour faire aboutir ses revendications ?","a":"Grève du 16 septembre 2022 → +4,5 % sur salaires (inflation) et trajectoire de recrutements.","f":"Droit de grève & conflits"},{"n":319,"q":"Quelle action du SNCTA en 2023 illustre la stratégie du SNCTA pour faire aboutir ses revendications ?","a":"Préavis de septembre 2023 → +4,5 à +4,68 % des primes, sans grève, plus une revoyure en 2024 (ça sera le Protocole).","f":"Droit de grève & conflits"},{"n":320,"q":"Quelle action du SNCTA en 2025 illustre la stratégie du SNCTA pour faire aboutir ses revendications ?","a":"Préavis de septembre reporté en octobre → +2,1 %, à hauteur de l'inflation.","f":"Droit de grève & conflits"},{"n":321,"q":"Comment se termine le préavis de grève 2025 déposé par le Bureau national du SNCTA ?","a":"Par la levée du préavis après satisfaction des revendications : la preuve que le préavis est un outil, pas une posture.","f":"Droit de grève & conflits"},{"n":322,"q":"Quelle grève de 1973 fonde le récit du droit de grève ?","a":"L'appel du SNCTA, seul, à la grève totale de quatre jours ; préavis rejeté au nom de la loi de 1964.","f":"Droit de grève & conflits"},{"n":323,"q":"Qui a dit « Le Plan Clément Marot est à ranger au rayon des accessoires » ?","a":"Le président du SNPL, en uniforme, au journal télévisé de 1973.","f":"Droit de grève & conflits"},{"n":324,"q":"Quelle leçon de 1973 nourrit encore la doctrine SNCTA ?","a":"La grève est une prise de risque : elle doit être rare, massive et déboucher sur des résultats.","f":"Droit de grève & conflits"},{"n":325,"q":"Quelle année sépare 1973 de la première grève nationale autorisée par la loi ?","a":"1987 puis celle liée aux négociations décevantes du Protocole 1991.","f":"Droit de grève & conflits"},{"n":326,"q":"Que déclenche l'absence d'adéquation grévistes/impact selon le SNCTA ?","a":"Un questionnement politique permanent sur le bien-fondé du droit de grève des contrôleurs.","f":"Droit de grève & conflits"},{"n":327,"q":"Que protège in fine la réforme du droit de grève selon la campagne ?","a":"Le droit de grève lui-même, « rendu aux contrôleurs » par une réforme historique et responsable.","f":"Droit de grève & conflits"},{"n":328,"q":"Quelle formule résume la doctrine SNCTA du conflit ?","a":"Mobilisation et unité dans le conflit pour faire aboutir des revendications légitimes.","f":"Droit de grève & conflits"},{"n":329,"q":"Complétez : « la grève est une arme de ..., pas un ... »","a":"De persuasion ultime, pas un fonds de commerce.","f":"Droit de grève & conflits"},{"n":330,"q":"Qui décide en AG de la poursuite d'une grève, comme en 1973 ?","a":"Les contrôleurs eux-mêmes, en assemblées générales.","f":"Droit de grève & conflits"},{"n":331,"q":"Quelle instance SNCTA encadre les grèves à portée nationale selon les statuts ?","a":"Le Bureau national, garant de la cohérence des mots d'ordre.","f":"Droit de grève & conflits"},{"n":332,"q":"Quelles instances SNCTA encadrent les grèves à portée locale selon les statuts ?","a":"Le Bureau régional (ou le Bureau national) et la section locale.","f":"Droit de grève & conflits"},{"n":333,"q":"Quel effet la déclaration préalable a-t-elle sur les mouvements de grève sans gréviste ?","a":"Elle met fin à l'exagération de leurs conséquences.","f":"Droit de grève & conflits"},{"n":334,"q":"Quelles étaient les « régulations sauvages » des années 1970-80, lorsque le droit de grève n'était pas légal ?","a":"Arrêts des décollages, régulations non déclarées : parfois durement sanctionnés (mutations d'office, pertes d'échelons, de primes…)","f":"Droit de grève & conflits"},{"n":335,"q":"Quel soutien international a pesé en 1973 ?","a":"L'IFALPA qui avait déjà protesté contre le plan Clément Marot en 1968.","f":"Droit de grève & conflits"},{"n":336,"q":"Quelle instance a validé le décret service minimum ?","a":"Le Conseil d'État.","f":"Droit de grève & conflits"},{"n":337,"q":"Que doit faire un jour de grève un contrôleur non inscrit au TDS (ex : en formation, stagiaire, en GT local…) ?","a":"Il n'a pas à se déclarer, la déclaration ne concerne que les inscrits au tour de service.","f":"Droit de grève & conflits"},{"n":338,"q":"Quelle communication accompagne chaque préavis SNCTA ?","a":"Des revendications précises, publiques, fondées, chiffrées, accessibles et légitimes.","f":"Droit de grève & conflits"},{"n":339,"q":"Pourquoi la France pèse-t-elle si lourd dans les grèves ATC européennes ?","a":"Une part disproportionnée des grèves européennes lui était attribuée sur 2004-2016 dites « grèves de solidarité », corrigée par la loi en 2023 (DP/SM).","f":"Droit de grève & conflits"},{"n":340,"q":"Quel média le SNCTA a-t-il utilisé en 1973 pour prouver l'incompétence militaire ?","a":"Les radios RMC et RTL, avec des enregistrements de fréquences.","f":"Droit de grève & conflits"},{"n":341,"q":"Quelle grève a « contraint les Pouvoirs publics à recruter 1000 ICNA » ?","a":"Celle de septembre 2022, fortement suivie.","f":"Droit de grève & conflits"},{"n":342,"q":"Que met en place le service à 18h l'avant-veille d'une grève en cas de nombreuses DP ?","a":"Des capacités adaptées à la journée considérée, voire une fermeture de service pour les organismes sans service minimum.","f":"Droit de grève & conflits"},{"n":343,"q":"Quelle est la condition pour qu'une grève impacte vraiment le trafic depuis 2023 ?","a":"Qu'elle mobilise vraiment les contrôleurs, avec un grand nombre de DP : le but est de faire aboutir des revendications légitimes.","f":"Droit de grève & conflits"},{"n":344,"q":"Quelle est la seule chose que la déclaration préalable révèle ?","a":"Le nombre réel de grévistes : la vérité du rapport de force.","f":"Droit de grève & conflits"},{"n":345,"q":"Quels sont les deux items illustrant le nouveau droit de grève acquis en 2023 ?","a":"DP : se déclarer avant midi l'avant-veille ; SM : un niveau abaissé fixé par décret.","f":"Droit de grève & conflits"},{"n":346,"q":"Un ICNA ab initio passe en-Chef combien d'années plus tôt qu'avant grâce au Protocole 2023-2027 ?","a":"2 ans, grâce aux 16 ans désormais comptés en services publics et non plus de titularisation.","f":"Carrière & grilles"},{"n":347,"q":"Qui suis-je ? Je suis attribué dès la MU totale et je ne me perds plus jamais.","a":"Le titre de PC : maintenu à vie contre 9 ans auparavant.","f":"Carrière & grilles"},{"n":348,"q":"Un contrôleur hors-salle sans MU mute sur un poste de PC : qu'advient-il de sa part Licence ?","a":"Elle sera maintenue 36 mois — les conditions de « retour en salle » sont corrigées grâce aux travaux des cellules ASAP et Mobilité et l'essai se transforme dans le Protocole 2023-2027.","f":"Carrière & grilles"},{"n":349,"q":"Quelles cellules ont fait remonter l'iniquité du retour en salle ?","a":"Les cellules ASAP et Mobilité vers le BN qui corrige ce point grâce aux textes mis à jour après signature du Protocole 2023-2027.","f":"Carrière & grilles"},{"n":350,"q":"Qui suis-je ? Je protège l'élève ÉNAC en cas d'arrêt de formation.","a":"Le reclassement IESSA ou IEEAC, y compris pour les RUE. Une évolution rassurante, issue du Protocole 2023-2027 sous l'impulsion du SNCTA.","f":"Carrière & grilles"},{"n":351,"q":"Dans quels textes le multi-rating est-il désormais gravé ?","a":"Dans les textes statutaires du corps des ICNA.","f":"Carrière & grilles"},{"n":352,"q":"Pourquoi le SNCTA tenait-il tant au multi-rating ?","a":"Pour maintenir un haut degré d'expertise tout en permettant des évolutions de carrière.","f":"Carrière & grilles"},{"n":353,"q":"Quelles listes couvrent l'attribution du PC à la MU totale ?","a":"Les listes de classement des Organismes de contrôle : de 1 à 11.","f":"Carrière & grilles"},{"n":354,"q":"Deux nouvelles fonctions déclenchent désormais la promotion au grade ICNA en-Chef : lesquelles ?","a":"Examinateur des compétences pratiques (approche/CRNA) et ICA-référent à l'ÉNAC.","f":"Carrière & grilles"},{"n":355,"q":"À qui profite le fait qu'EXA en APP/CRN soit déclenchant pour l'ICNA en-Chef ?","a":"Aux centres où des ICNA attendaient l'accès à une fonction déclenchante.","f":"Carrière & grilles"},{"n":356,"q":"Après 16 ans d'une ZZ, que conserve le contrôleur quelque soit sa carrière ?","a":"Le plus haut niveau du couple ISQ/CISQ atteint dans sa carrière.","f":"Carrière & grilles"},{"n":357,"q":"Après 16 ans d'une MU dans un centre, que conserve un contrôleur ?","a":"Le niveau de MCISQ perçu — même en mutant vers un centre à MCISQ plus faible.","f":"Carrière & grilles"},{"n":358,"q":"Qui suis-je ? Nouvelle prime de la part Licence aux contours définis par le SNCTA.","a":"La MCISQ, intégrée au régime indemnitaire par le Protocole 2023-2027 et votée en Congrès par les adhérents SNCTA quelques années plus tôt.","f":"Carrière & grilles"},{"n":359,"q":"Que procure à un chargé d'affaires ou de mission le dernier Protocole 2023-2027 ?","a":"Le maintien de la part Licence et le déclenchement du grade en-Chef, c'est une harmonisation des fonctions d'encadrement.","f":"Carrière & grilles"},{"n":360,"q":"Quels échelons ont été créés au grade en-Chef ?","a":"Les HEB II et HEB III par le Protocole 2023-2027, grâce au Corps Unique de Contrôleurs voulu par le SNCTA.","f":"Carrière & grilles"},{"n":361,"q":"Combien de salaire apporte in fine l'accès au HEB III ?","a":"467 € brut mensuels en fin de carrière.","f":"Carrière & grilles"},{"n":362,"q":"Quel indice terminal reçoit le grade Divisionnaire ?","a":"Le HEA III, accessible avec une simple qualification ZZ. C'est le HEA pour tous.","f":"Carrière & grilles"},{"n":363,"q":"Depuis quand est effective la grille indiciaire ICNA avec les échelons HEBIII pour le En-chef et le HEA III pour les Div. ?","a":"Depuis le 1er juillet 2025.","f":"Carrière & grilles"},{"n":364,"q":"Comment bénéficier de +350 € de pension depuis le dernier Protocole ?","a":"En ayant passé au moins 6 mois au HEB III ; possible pour les premiers retraités, dès le 1er janvier 2027.","f":"Carrière & grilles"},{"n":365,"q":"Pourquoi l'accès HEB est-il qualifié d'« historique » ?","a":"C'est la concrétisation du combat pour faire reconnaître la haute expertise des contrôleurs, comme peu y accèdent dans la Fonction publique.","f":"Carrière & grilles"},{"n":366,"q":"Quelles voies de recrutement profitent/profiteront de la promotion au grade ICNA en-Chef facilitée ou du HEA III comme échelon max du grade divisionnaire ?","a":"EP, SP, CI, RUE, SPS et sélection au choix.","f":"Carrière & grilles"},{"n":367,"q":"Un contrôleur inapte temporaire garde ses options combien de temps ?","a":"12 mois.","f":"Carrière & grilles"},{"n":368,"q":"Un contrôleur revient d'un congé de proche aidant : qu'en est-il de ses primes ?","a":"Elles sont désormais maintenues 12 mois, textes indemnitaires ont été modifiés par le SNCTA dans le cadre du Protocole 2023-2027.","f":"Carrière & grilles"},{"n":369,"q":"Sur quel site trouver de l'accompagnement lors des campagnes d'avancement ?","a":"Sur sncta.fr via la cellule ASAP et son formulaire dédié : 180 mandats sont portés en moyenne chaque année.","f":"Carrière & grilles"},{"n":370,"q":"Que suis-je ? Je permets à un contrôleur d'aérodrome devenu ICNA d'aller en approche ou CRNA.","a":"Le multirating dispensé à l'ÉNAC pour tous les ICNA, notamment après avoir été retenu en CDM.","f":"Carrière & grilles"},{"n":371,"q":"Quelles portes le multirating ouvre-t-il ensuite ?","a":"Le grade ICNA en-Chef et le HEB III.","f":"Carrière & grilles"},{"n":372,"q":"Que conserve un TSEEAC reclassé ICNA côté indice ?","a":"Un indice supérieur ou égal, jamais de perte au reclassement y compris en quittant un emploi fonctionnel TSEEAC.","f":"Carrière & grilles"},{"n":373,"q":"Que conserve un TSEEAC reclassé ICNA côté part expérience ?","a":"Elle est maintenue avec la part Licence augmentée.","f":"Carrière & grilles"},{"n":374,"q":"Quelle est la caractéristique de la grille indiciaire ICNA grâce corps unique depuis le Protocole 2023-2027 ?","a":"Des échelons plus courts et plus hauts : HEA III en Divisionnaire, HEB III en en-Chef.","f":"Carrière & grilles"},{"n":375,"q":"Quelle cotisation est compensée pour les TSEEAC devenant ICNA ?","a":"Les 24,6% d'ISQ au nom de l'abondement au fond ATC.","f":"Carrière & grilles"},{"n":376,"q":"Vrai ou faux : un déclassement fait perdre le titre de PC.","a":"Faux, il est maintenu à vie, même en cas de déclassement.","f":"Carrière & grilles"},{"n":377,"q":"Que change « 16 ans de services publics » pour un CI ou un RUE ?","a":"Un accès plus facile et plus tôt au grade en-Chef, leurs années antérieures comptent désormais depuis le dernier Protocole 2023-2027.","f":"Carrière & grilles"},{"n":378,"q":"Quelle fin de carrière attend un ICNA passé en-Chef 2 ans plus tôt ?","a":"2 ans de plus au HEB III : pour beaucoup c'est environ 30 k€ de salaire supérieur sur une carrière (5x12x467) et une pension revalorisée à vie de 350 euros.","f":"Carrière & grilles"},{"n":379,"q":"Qui suis-je ? Document SNCTA compilant tous ses droits de carrière.","a":"Le Guide du Contrôleur — accessible à l'achat sur sncta.fr et offert à tous les adhérents.","f":"Carrière & grilles"},{"n":380,"q":"Que faire avant d'accepter un poste hors-salle ?","a":"Consulter la cellule ASAP ou Mobilité : les mécanismes de maintien indemnitaires ont des conditions précises.","f":"Carrière & grilles"},{"n":381,"q":"Quel réflexe pour s'assurer que son dossier d'avancement de grade est correctement traité par l'administration ?","a":"Solliciter ASAP : conseil individualisé et mandat porté en campagne.","f":"Carrière & grilles"},{"n":382,"q":"Quelle promesse la sécurisation du PC adresse-t-elle aux jeunes ?","a":"Le titre arrive plus tôt (MU totale) et ne se perd plus jamais.","f":"Carrière & grilles"},{"n":383,"q":"Quelle logique relie tous les acquis sociaux au fur et à mesure de la carrière ?","a":"Aucune situation sans filet : formation, inaptitude, maternité, hors-salle, reclassement. On est protégé en toutes circonstances.","f":"Carrière & grilles"},{"n":384,"q":"Complétez : « Le titre de PC est nécessaire pour le ... indemnitaire »","a":"Le maintien indemnitaire.","f":"Carrière & grilles"},{"n":385,"q":"Quelle double reconnaissance vise la politique carrière du SNCTA ?","a":"L'expertise (multi-rating, HEB) et la protection (maintiens, reclassements).","f":"Carrière & grilles"},{"n":386,"q":"Qui valide in fine les règles statutaires de carrière ?","a":"Les textes officiels publiés au Journal Officiel de la République mais que le SNCTA négocie, amende et fait publier.","f":"Carrière & grilles"},{"n":387,"q":"Qui suis-je ? Je reste à 59 ans malgré toutes les réformes.","a":"L'âge limite du corps des ICNA.","f":"Retraite & dispositifs"},{"n":388,"q":"Que devient l'âge d'ouverture des droits ?","a":"Il passe de 52 à 54 ans, seule concession de ICNA lors de la réforme des retraites de la Fonction publique en 2023.","f":"Retraite & dispositifs"},{"n":389,"q":"Comment le SNCTA a-t-il cantonné la réforme des retraites en 2023 ?","a":"En sanctuarisant l'âge limite : la réforme s'est limitée à décaler l'ouverture des droits, cela a été préparé par le SNCTA dès 2022.","f":"Retraite & dispositifs"},{"n":390,"q":"Un contrôleur part le 1er février 2027 avec 7 mois de HEB III, qu'en est-il de sa pension ?","a":"+350 € brut mensuels à vie car toutes les conditions sont remplies (départ ‡ 1er janvier 2027, ‡ 6 mois au HEB III).","f":"Retraite & dispositifs"},{"n":391,"q":"Que représentent ces +350 € sur 13 ans (période d'obtention en parallèle de l'ATC) ?","a":"Environ +55 000 €.","f":"Retraite & dispositifs"},{"n":392,"q":"Qui suis-je ? Dispositif de solidarité inter-centres et intergénérationnel.","a":"L'ATC : même montant pour tous, calculé sur l'ISQ des listes 1.","f":"Retraite & dispositifs"},{"n":393,"q":"De combien l'ATC a été augmenté dans le Protocole 2023-2027 par transfert de primes entre CISQ et ISQ des listes 1 ?","a":"De 112 k€ sur 13 ans, pour tous.","f":"Retraite & dispositifs"},{"n":394,"q":"Pourquoi l'ATC existe-t-elle historiquement ?","a":"Pour compenser temporairement le faible taux de remplacement des pensions de la profession.","f":"Retraite & dispositifs"},{"n":395,"q":"Quelle inégalité femme-homme le décret CIT corrigé supprime-t-il ?","a":"La diminution du CIT pour les femmes ayant eu des enfants après 2004.","f":"Retraite & dispositifs"},{"n":396,"q":"Quelle injustice parentale le décret CIT corrigé annihile-t-il ?","a":"Celle des parents élevant un enfant en situation de handicap qui observaient une diminution du CIT. Ce n'est plus le cas.","f":"Retraite & dispositifs"},{"n":397,"q":"Quel bilan global la campagne retient-elle en matière de retraite ?","a":"+1000 € brut/mois en moyenne pendant 13 ans, puis +350 € au-delà et un âge préservé de départ à 59 ans.","f":"Retraite & dispositifs"},{"n":398,"q":"Qui suis-je ? J'accumule 6 à 12 jours par an pour partir plus tôt à 100% de mon salaire en « pré-retraite » ?","a":"Le CCA : Compte de la Circulation Aérienne.","f":"Retraite & dispositifs"},{"n":399,"q":"À quel taux de rémunération part-on avec le CCA ?","a":"100 % du salaire voire même avec des échelons qui continuent de monter.","f":"Retraite & dispositifs"},{"n":400,"q":"Une sortie ÉNAC qualifiée à 25 ans : à quel âge pourra-t-elle prétendre à une pré-retraite à 100% de salaire ?","a":"Dès 56 ans : c'est 3 ans plus tôt qu'aujourd'hui.","f":"Retraite & dispositifs"},{"n":401,"q":"En 2026, à quel âge un quadragénaire pourra prétendre à une pré-retraite à 100% de salaire ?","a":"Potentiellement l'année de ses 57 ans.","f":"Retraite & dispositifs"},{"n":402,"q":"Pourquoi le CCA a-t-il été créé ?","a":"Pour maintenir le contrat social à la suite de la mise en place du SPS.","f":"Retraite & dispositifs"},{"n":403,"q":"Quelles listes disposent déjà d'un CCA ?","a":"Les listes 1 à 9 et les 10 et 11 au 1er janvier 2027.","f":"Retraite & dispositifs"},{"n":404,"q":"Quelles récupérations sont associées au CCA ?","a":"RS, RPT, RMT : valables jusqu'au 31/12 de l'année suivant leur obtention.","f":"Retraite & dispositifs"},{"n":405,"q":"Qui simule votre future pension au SNCTA ?","a":"La cellule Retraite : montants, procédures, âges, simulations personnalisées.","f":"Retraite & dispositifs"},{"n":406,"q":"Que négocie la PSC pour les ICNA retraités ?","a":"Un plafonnement des cotisations plus avantageux, les ICNA partant 8 ans plus tôt à la retraite qu'un sédentaire.","f":"Retraite & dispositifs"},{"n":407,"q":"Vrai ou faux : l'ATC dépend du niveau de cotisation individuel.","a":"Faux ! Le montant est identique pour tous : c'est la solidarité du corps.","f":"Retraite & dispositifs"},{"n":408,"q":"Quels dispositifs propres au corps sécurise le corps unique ?","a":"ATC, CIT, catégorie active et bonification du 5e.","f":"Retraite & dispositi
